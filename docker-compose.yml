# =====================================================================
#  Ambiente Docker per sviluppo/testing.
#
#    docker compose up --build
#
#  Servizi:
#    - web        Vite dev server          → http://localhost:5173
#    - emulators  Firebase emulators       → UI http://localhost:4000
#                                             Auth      localhost:9099
#                                             Firestore localhost:8080
#                                             Storage   localhost:9199
#
#  Il client (web) si collega automaticamente agli emulatori grazie alle
#  variabili VITE_USE_FIREBASE_EMULATOR/*. Si usa un progetto "demo-*"
#  che gira completamente offline senza credenziali Firebase reali.
#
#  Per creare un utente bartender nell'emulatore Auth:
#    http://localhost:4000 → Authentication → Add user
# =====================================================================
services:
  web:
    build: .
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_USE_FIREBASE_EMULATOR: "true"
      VITE_FIRESTORE_EMULATOR_HOST: localhost
      VITE_FIRESTORE_EMULATOR_PORT: "8080"
      VITE_FIREBASE_PROJECT_ID: demo-tana-drink
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-tana-drink.firebaseapp.com
    volumes:
      - .:/app
      # node_modules in un volume dedicato per non sovrascrivere quelli
      # dell'host ed evitare problemi di binari nativi.
      - web_node_modules:/app/node_modules
    depends_on:
      emulators:
        condition: service_healthy

  emulators:
    build: .
    command: >
      firebase emulators:start
      --project demo-tana-drink
      --only auth,firestore,storage
    ports:
      - "4000:4000" # Emulator UI
      - "9099:9099" # Auth
      - "8080:8080" # Firestore
      - "9199:9199" # Storage
      - "4400:4400" # Emulator hub
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./storage.rules:/app/storage.rules:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4400/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  web_node_modules:
