# =====================================================================
#  Ambiente Docker per sviluppo/testing.
#
#    docker compose up --build
#
#  Servizi:
#    - web        Vite dev server          → http://localhost:5173
#    - emulators  Firebase emulators       → UI http://localhost:4000
#                                             Firestore su localhost:8080
#
#  Il client (web) si collega automaticamente all'emulatore Firestore
#  grazie alle variabili VITE_USE_FIREBASE_EMULATOR / VITE_FIRESTORE_*.
#  Si usa un progetto "demo-*", che gira completamente offline senza
#  credenziali Firebase reali.
# =====================================================================
services:
  web:
    build: .
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      # Modalità emulatore: il browser parla con l'emulatore su localhost.
      VITE_USE_FIREBASE_EMULATOR: "true"
      VITE_FIRESTORE_EMULATOR_HOST: localhost
      VITE_FIRESTORE_EMULATOR_PORT: "8080"
      # Con un progetto demo-* non servono credenziali reali.
      VITE_FIREBASE_PROJECT_ID: demo-tana-drink
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_BARTENDER_PIN: "2468"
    volumes:
      - .:/app
      # node_modules in un volume dedicato per non sovrascrivere quelli
      # dell'host ed evitare problemi di binari nativi.
      - web_node_modules:/app/node_modules
    depends_on:
      - emulators

  emulators:
    build: .
    command: >
      firebase emulators:start
      --project demo-tana-drink
      --only firestore
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "4400:4400" # Emulator hub
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro

volumes:
  web_node_modules:
