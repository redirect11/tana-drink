<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e15" />
    <!-- iOS: aggiunta alla Home come app a schermo intero (senza barre Safari).
         Safari non usa il manifest per questo: servono questi meta apple-*. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tana Drink" />
    <!-- iPhone/iPad usano QUESTA, non le icone del manifest, e la vogliono
         180x180 e OPACA: con la trasparenza iOS riempie di nero e il
         marchio esce con un bordo sporco. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Ordina i tuoi drink alla Tana del Coniglio" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>La Tana del Coniglio — Drink</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Epson ePOS SDK: scarica epos-2.27.0.js da https://developer.epson.com/
         e salvalo in public/epos-2.27.0.js. Non è su npm: deve essere un tag
         <script> sincrono perché usa window.epson (non-ESM). -->
    <script src="/epos-2.27.0.js" onerror="console.warn('[printer] ePOS SDK non trovato in public/. Stampa termica non disponibile.')"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
