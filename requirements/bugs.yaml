  - id: BUG-024
    title: "Le righe aggiunte a un conto nascevano già «in preparazione»"
    area: "src/lib/comande.js, src/components/OrderPosDetail.jsx"
    description: >
      Conto con una comanda in preparazione, si aggiungono altre righe:
      quelle risultavano anche loro in preparazione, cioè già prese in
      carico da qualcuno. Al banco sparivano dalla colonna «Da fare» e non
      le cominciava nessuno — lo stesso danno del ticket che non compare, ma
      più subdolo, perché la card c'è: sta nella colonna sbagliata.
      CAUSA: la comanda che accoglieva le righe nuove si sceglieva con
      `comandaEditable`, che vuol dire «si può ancora toccare» ed è vera sia
      per «da fare» sia per «in preparazione» — quindi le righe finivano
      nella prima toccabile, qualunque passo avesse. Era la regola di prima,
      di quando non c'era una risposta sola alla domanda «in che passo nasce
      il lavoro nuovo»; da quando c'è (`statoComandaNuova`) quella strada
      decideva per conto suo.
      RISOLTO: `comandaPerLeAggiunte(comande, passo)` in comande.js, un
      punto solo, usato da tutte e due le strade che aggiungono righe (il
      tocco sulla griglia e l'auto-conferma della bozza). Le righe vanno
      nella comanda che sta già in quel passo; se non c'è, ne nasce una —
      anche con una comanda in preparazione accanto. Una comanda pronta o
      servita non risponde mai, quindi il vecchio caso «ordine già servito →
      nuova comanda» viene da sé, senza una seconda regola.
      In più: senza una comanda in quel passo, i tocchi sulla griglia
      passano ora dalla BOZZA invece di chiamare `addComanda` uno per uno —
      tre tocchi di fila facevano tre ticket da una riga per lo stesso giro.
