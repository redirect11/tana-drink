  - id: BUG-060
    title: "«Invalid Date» come intestazione di un gruppo in coda"
    area: "src/pages/BartenderPage.jsx (dayOf, groupByDay), src/lib/coda.js (giornataDelConto, raggruppaPerGiornata)"
    description: >
      Segnalato dall'utente il 20/08 con lo screenshot: in coda, sopra un
      gruppo di conti, l'intestazione diceva «Invalid Date».
      LA CAUSA, secca. La coda raggruppava per giornata con
      `dayOf(o) || '—'`: un conto di cui non si riusciva a leggere la data
      finiva in un gruppo che aveva per chiave un TRATTINO. Ma la chiave del
      gruppo è la stessa cosa che poi va al formattatore
      (`businessDayLabel`), e lì dentro diventa `new Date('—T00:00:00')` —
      che non è una data. Il formattatore stampava «Invalid Date», e quello
      si leggeva a schermo.
      LA REGOLA, DETTA DALL'UTENTE: «la data ce la metti in locale, se non
      la leggi c'è qualche problema, non inventare soluzioni». È vero, ed è
      il punto: `createOrder` scrive `order_date` dall'orologio del client
      nell'istante in cui il conto nasce — non aspetta il server, vale anche
      offline, e non è mai vuota.
      LA CURA, in tre pezzi.
      (1) `giornataDelConto` (coda.js, logica pura) impara il ripiego
      COMPLETO sulle date locali che un conto si porta dietro, in ordine di
      attendibilità: `order_date`, poi `created_at` (l'orario del server,
      che finché la scrittura è per strada vale null e quindi non può stare
      per primo), poi l'APERTURA scritta dal client
      (`status_times.aperto` sul conto, che mapOrder porta in
      `tempi_conto`), poi la nascita della prima comanda. Così anche un
      documento monco finisce sotto IL SUO giorno.
      TRAPPOLA TROVATA SCRIVENDO I TEST: `businessDayKey` ha un valore di
      riserva (`new Date()`), quindi passandogli `undefined` risponde OGGI.
      Un campo mancante sarebbe diventato «oggi» invece di «non lo so», e i
      ripieghi dopo non sarebbero stati nemmeno provati: si passa `?? null`.
      (2) `raggruppaPerGiornata` non usa più nessun segnaposto: se dopo
      tutti i ripieghi la data non c'è — caso patologico — il conto va sotto
      OGGI, dove chi lavora lo vede. Al formattatore arriva sempre una
      chiave vera.
      (3) La lista continua a raggruppare con le stesse regole: le due
      funzioni sono una sola, e si provano senza rete.
      L'ORDINE FANTASMA «#—» COL 🌐, cosa si è escluso coi fatti. Nella
      stessa segnalazione compariva fra i chiusi una card senza numero e
      senza autore. Il 🌐 non è un segno di guasto: OrderBy lo mostra a
      QUALUNQUE conto senza `placed_by`, quindi un conto senza numero e
      senza autore si disegna così. Nel client non esiste una strada che
      fabbrichi un conto senza documento sotto, e sono state guardate tutte
      le memorie locali che potevano farlo:
      · `lib/pendingOrders.js` — i conti battuti e non ancora sincronizzati
        sono disegnati a parte (renderPendingCard) e scrivono «#…», non
        «#—»; e non entrano mai in `ordersRaw`.
      · `lib/comandeLocali.js` — sostituisce solo l'array `comande` di un
        conto che ESISTE già nella lista: non ne crea nessuno.
      · `lib/mutazioniOrdine.js` — la memoria di «quello che ho appena
        scritto» la leggono le MUTAZIONI (leggiOrdine), mai la coda; scade
        da sé al confronto con la cache o dopo 2 secondi.
      · `lib/ordiniNascosti.js` — toglie conti dalla lista, non ne aggiunge.
      · `BartenderPage` popola `ordersRaw` in un punto solo (riga 883), dal
        solo `subscribeActiveOrders`, che rimappa gli snapshot a ogni giro:
        un documento cancellato sparisce, non resta appeso.
      RESTA QUINDI UN DOCUMENTO VERO, letto dalla CACHE del browser: la
      persistenza di Firestore (IndexedDB) sopravvive a un database
      ricostruito da zero — è la stessa cosa che `lib/sync.js` dice già
      degli errori «not found» in locale — e `subscribeActiveOrders` legge
      APPOSTA la cache per prima (`dallaCache`) e disegna prima che il
      server risponda. Con l'emulatore piantato, quello che si vede è la
      cache di ieri notte. NON RIPRODOTTO su dati puliti; se ricapita, la
      prova che lo dimostra è aprire quel conto e vedere se il documento
      esiste sul server.
      COSA CAMBIA COMUNQUE AL BANCO: qualunque sia la sua provenienza, un
      conto del genere adesso non stampa più «Invalid Date» e sta sotto un
      giorno vero.
      PASSI PER RIPRODURLO (prima della cura): un conto in coda senza
      `order_date` e senza `created_at`. L'intestazione del suo gruppo dice
      «Invalid Date».
    in_produzione: false
