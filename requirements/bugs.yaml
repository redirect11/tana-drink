  - id: BUG-036
    title: "Lo staff non riceve le notifiche di ritiro e servizio"
    area: "functions/lib/push-core.js, functions/index.js, src/lib/api.js, public/sw.js"
    description: >
      Segnalato dall'utente il 19/08: «lo staff non riceve le notifiche del
      ritiro/servizio, quelle devono assolutamente arrivare».
      Sono le notifiche che dicono a chi lavora che c'è un drink pronto da
      portare o da consegnare: senza, la comanda resta ferma sul banco
      finché qualcuno non guarda lo schermo — che è esattamente quello che
      le corsie dovevano evitare.
      DOVE SI FERMAVA: NON PARTIVA. Due guasti distinti.
      1) SERVIZIO. Il messaggio nasceva (decideStaffServePush) ma
      `pushToStaff` lo mandava con `roles: ['staff']`, e `destinatariPush`
      teneva solo le righe di `staff_tokens` col campo `role` a 'staff'.
      Quel campo non era il ruolo della persona: era il nome della
      SCHERMATA che aveva registrato il dispositivo, e la schermata dove
      si finisce tutti è la coda, che ci scriveva 'bartender'. Elenco
      vuoto, uscita silenziosa. PROVA: su tana-drink-test tutte e quattro
      le righe di `staff_tokens` avevano role 'bartender', nessuna 'staff'.
      2) RITIRO. Nessun messaggio nasceva affatto: decideStaffServePush
      usciva su `service_mode === 'banco'`, dando per scontato che ci
      pensasse il cliente — che però riceve la push solo se ha ordinato
      dal menù (il `push_token` sul conto), e un conto battuto al POS non
      ce l'ha. Su quei conti non partiva niente per nessuno.
      CORREZIONE: via il filtro per ruolo (chi porta i drink non è un
      ruolo, è chi è in piedi); il messaggio nasce anche per il ritiro,
      con parole sue; a non riceverlo è solo il terminale che ha premuto
      «pronto», che ora lascia scritto `avanzamento_device` sul conto. Il
      campo `role` in `staff_tokens` non lo scrive né lo legge più
      nessuno: mentiva, ed è stato tolto. Corretto nello stesso giro l'OR
      troppo largo del service worker (`focused ||`), che avrebbe fatto
      sparire l'avviso appena riattivato su un tablet a schermo spento.
      RESTA DA FARE: il DEPLOY delle Cloud Functions. Finché non si
      deploya, in produzione gira ancora il codice vecchio.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, notifiche, banco]
    test_cases:
      - tests/bdd/notify-staff-call.test.js
      - tests/bdd/notify-order.test.js
      - tests/unit/scritturaComande.test.js
      - tests/unit/serviceWorkerAvvisi.test.js

