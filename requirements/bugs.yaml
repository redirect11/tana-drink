  - id: BUG-038
    title: "Sulla PWA Android le notifiche arrivano solo accendendo lo schermo"
    area: "public/sw.js, functions/lib/push-core.js"
    description: >
      Segnalato dall'utente il 19/08: sull'app installata su Android le
      notifiche non arrivano in tempo reale — restano ferme finché non si
      accende lo schermo. Al banco vuol dire che una chiamata dalla sala
      arriva quando ormai non serve più.
      DIAGNOSI (19/08), e in buona parte non dipende da noi.
      LA PRIORITÀ È GIÀ ALTA: tutte le push allo staff partono con
      `webpush: { headers: { Urgency: 'high' } }` — nuovo ordine e pronto
      con TTL 600, la chiamata con TTL 180 (functions/index.js). Lì non c'è
      niente da guadagnare: l'ipotesi «mandiamo una notifica normale» è
      esclusa.
      Quello che resta è il risparmio energetico di Android sull'app
      installata: a schermo spento il sistema sospende la consegna e la
      rilascia quando il telefono si sveglia. Non è una cosa che si
      corregge nel codice — si toglie l'ottimizzazione batteria per il
      browser/la PWA dalle impostazioni del telefono. Da dire all'utente
      così com'è, invece di inseguire una correzione impossibile.
      C'È PERÒ UN NOSTRO DIFETTO LATENTE, che si vedrà appena BUG-036 sarà
      risolto: in public/sw.js la notifica «drink pronti da servire» viene
      SALTATA se una finestra su /bar risulta
      `w.focused || w.visibilityState === 'visible'`. È un OR, cioè il
      controllo più largo possibile: un telefono lasciato aperto sulla coda
      con lo schermo spento può restare `focused`, e in quel caso la
      notifica non viene mostrata affatto. Va stretto a una sola
      condizione, la visibilità.
      NON RIPRODOTTO: in locale le push non si provano (niente emulatore
      FCM, service worker non registrato in sviluppo).
      19/08 — il difetto del service worker è CORRETTO (è andato con
      BUG-036: si guarda la visibilità, non il fuoco, e ora public/sw.js
      ha i suoi test). Resta aperto solo quello che non dipende da noi:
      il risparmio energetico di Android. Da chiudere con l'utente dopo
      il deploy, provando col telefono in mano.
    in_produzione: true
    status: todo
    generate_issue: true
    labels: [bug, notifiche, pwa]
