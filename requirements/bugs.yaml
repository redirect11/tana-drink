      due silenziosi: quei drink sparivano dagli occhi di chi doveva farli, e
      il magazzino veniva scaricato per roba mai uscita.
      CAUSA: due strade. `payGroupCash` (pagamento di un gruppo/tavolo)
      chiamava serveAllComande SEMPRE, senza guardare a che punto stessero le
      comande — un tavolo che paga insieme mentre due giri sono al banco li
      faceva sparire già «serviti». E il valore di partenza di `autoServe`
