      E lo stato delle due parti segue quello di partenza
      (`statiDopoLaDivisione`, un posto solo per chi scrive e per chi
      disegna): da «da fare» la parte scelta va in preparazione e il resto
      resta da fare; da «in preparazione» vanno tutte e due in preparazione
      — il lavoro è cominciato su entrambe, e mandarne una indietro direbbe
      che quei drink non li ha ancora presi in mano nessuno. La comanda di
      partenza si annulla come sempre col motivo «divisione», e non compare
      fra le annullate per finta.
