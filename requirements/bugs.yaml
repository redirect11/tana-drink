  - id: BUG-056
    title: "Aggiunte veloci allo stesso conto: l'ultima scrittura cancellava le altre"
    area: "src/lib/mutazioniOrdine.js (nuovo), src/lib/api.js"
    description: >
      Segnalato dall'utente il 20/08 provando al banco: «ho creato un
      ordine, ho aggiunto velocemente item, ma ha sincronizzato e mi ha
      lasciato solo il primo item». E dallo stesso giro, con le aggiunte
      fatte tutte insieme: due comande separate per un conto solo.
      LA CAUSA. Ogni mutazione di un conto — `addComanda`,
      `bartenderUpdateComanda`, `updateOrderItems`, `preparazioneParziale`,
      `advanceComanda`, l'incasso — LEGGE il documento, ricompone l'array
      `comande` e lo RISCRIVE INTERO: Firestore un array lo riscrive
      intero, non esiste un percorso tipo `comande.2.items`. Due gesti
      ravvicinati sullo stesso conto partono insieme, il secondo legge
      PRIMA che la scrittura del primo sia comparsa in cache, compone dal
      passato, e l'ultimo che scrive cancella l'altro. Stessa radice di
      BUG-022, che era stato curato in un punto solo (`scriviCampiComanda`,
      che si rilegge dentro la scrittura): le funzioni grosse leggevano
      ancora all'inizio del lavoro.
      LA CURA, alla radice, in due pezzi che stanno insieme.
      (1) LE MUTAZIONI DI UNO STESSO CONTO SI METTONO IN FILA: una catena
      di promesse per `orderId`, la stessa idea della coda di stampa di
      BUG-052. Conti DIVERSI non si aspettano fra loro — al banco si lavora
      su piu' conti insieme, e un conto lento non deve fermare gli altri.
      Il local-first non si tocca: a mettersi in fila e' il lavoro interno,
      non chi ha toccato lo schermo, che continua a ricevere subito il
      conto composto (`ordineDopo`).
      (2) LA FILA DA SOLA NON BASTA. Il turno finisce quando la scrittura e'
      PARTITA, non quando la cache l'ha applicata, e fra le due cose passa
      un giro. Quindi ogni mutazione RICORDA il conto come l'ha appena
      composto, e la mutazione dopo legge quel ricordo finche' la cache non
      ha recuperato — si capisce che ha recuperato guardando se i campi
      scritti sono tornati indietro uguali, senza timer che indovinano. Un
      tempo massimo di due secondi c'e', ma e' solo la rete di sicurezza
      per la scrittura che in cache non arrivera' MAI (documento cancellato
      sotto, rifiuto definitivo).
      DEADLOCK EVITATO A MANO: `preparazioneParziale` chiama l'avanzamento
      dentro il proprio turno, e mettersi in fila dietro se stessi vuol
      dire non ripartire mai. Per quello `advanceComandaOra` esiste
      separato da `advanceComanda`.
      IL LIMITE, dichiarato: finche' il ricordo e' vivo, una modifica
      arrivata da un ALTRO terminale sugli stessi campi si perde. E' la
      finestra fra la scrittura e la cache — millisecondi — ed e' lo stesso
      «l'ultimo che scrive vince» che c'era gia', ristretto invece che
      allargato.
      PASSI PER RIPRODURLO: due `addComanda` sullo stesso conto partite
      nello stesso giro. Il test lo fa con una cache che applica le
      scritture in ritardo, che e' quello che fa davvero: spegnendo una
      qualunque delle due meta' della cura, cinque prove su sette
      falliscono.
    in_produzione: false
    status: fixed
    generate_issue: true
    labels: [bug, ordini, local-first, banco]
    severity: alta
    priority: P1
    test_cases:
      - tests/unit/mutazioniInFila.test.js

  - id: BUG-057
    title: "Un ordine solo, due comande: la creazione non era una battuta sola"
    area: "src/lib/comande.js (comandaPerLeAggiunte, presaInCarico), src/lib/printer.js (comandeDaStampare), src/lib/api.js, src/components/OrderPosDetail.jsx"
    description: >
      Segnalato dall'utente il 20/08 con lo schermo davanti: un conto solo,
      il #20, battuto in creazione, e DUE facsimili di comanda — un
      LIMONCELLO da solo, poi JEFFERSON + AMERICANO + MONTENEGRO +
      JAGERMEISTER. «Mi crea piu' comande quando creo un solo ordine. In
      fase di creazione deve gestire tutto come UNA comanda».
      DUE CAUSE INSIEME, e lo screenshot era compatibile con tutte e due.
      (1) LA REGOLA DI IERI SERA (REQ-ORD-016): le aggiunte non entrano in
      una comanda «da in preparazione in poi». Nel locale che fa NASCERE le
      comande gia' in preparazione — l'impostazione «Le comande nascono
      gia' in preparazione» — quella condizione e' vera dal primo istante:
      ogni riga battuta dopo la prima faceva per forza un ticket nuovo. E
      l'esclusione della comanda gia' stampata (`auto_print_at`) faceva lo
      stesso danno appena l'auto-stampa era accesa.
      (2) LA CORSA DI BUG-056: due scritture ravvicinate sullo stesso conto
      componevano dallo stesso passato. Curata a parte, nel suo commit.
      LA REGOLA, CORRETTA DALL'UTENTE, in due mosse.
      IL DISCRIMINE E' LA PRESA IN CARICO, NON LO STATO: «devi aggiungere
      prodotti a una NUOVA comanda solo se lo stato viene PASSATO in
      preparazione (comanda presa in carico)». Una comanda nata in
      preparazione per impostazione del locale non l'ha presa in mano
      nessuno. Serve un segno, ed e' `presa_in_carico`, scritto solo da
      advanceComanda. Documenti vecchi senza il campo: si guarda lo stato
      con la regola prudente («in preparazione» senza segno = presa in
      carico), cosi' i ticket gia' in mano al banco stasera non si gonfiano.
      LA SESSIONE DI CREAZIONE E' UN SOTTOSTATO DEL CONTO (`in_creazione`).
      «Se non sono ancora uscito dalla creazione ordine (solo con il tasto
      indietro agli ordini) quella e' sempre UNA SOLA comanda (anche se da
      creazione ordine vado in pagamento)». Lo apre il POS alla nascita, lo
      chiude l'uscita dalla schermata — il pagamento no, e' sempre la
      stessa battuta. Finche' e' aperto: ogni aggiunta entra nella comanda
      1, e L'AUTO-STAMPA NON PARTE. E' il facsimile col LIMONCELLO da solo:
      la carta era uscita a meta' composizione. Il ticket esce quando la
      sessione si chiude, e allora e' completo.
      L'ESCLUSIONE `auto_print_at` E' STATA TOLTA come discrimine —
      contraddiceva la regola nuova — ma la ragione per cui era nata resta
      vera: una comanda gia' stampata che si gonfia lascia al banco una
      carta vecchia. LA CURA COERENTE: quando una comanda NON presa in
      carico riceve aggiunte, il suo `auto_print_at` si AZZERA e la coda
      RISTAMPA il ticket completo. Il banco butta il foglio vecchio e ha
      quello giusto. Perche' funzioni anche sul terminale che aveva gia'
      stampato, la pretesa locale segue le RIGHE della comanda e non solo
      il suo id.
      COL SERVIZIO SPENTO NON C'E' NIENTE DA GUARDARE — non esistono passi,
      non esiste «preso in carico» — e allora sceglie una persona: «se non
      ci sono gli stati di servizio, il bartender/admin SCEGLIE, solo in
      modifica». Due tasti sotto il totale, «Nella comanda» e «Comanda
      nuova»; finche' non si risponde le righe restano a schermo. Uscendo
      senza scegliere vanno nella comanda, che e' la strada che non fa
      carta in piu'.
      IL CASO CHE RESTA SCOPERTO, e non per dimenticanza: se l'app muore a
      meta' battuta il segno `in_creazione` resta appeso e quella comanda
      non esce da sola. «Non e' un problema, Flavio puo' ristampare la
      comanda con l'apposito tasto» (l'utente, 20/08). Niente scadenze a
      tempo, niente chiusure da altri terminali: un avanzamento di stato la
      chiude comunque, e il resto ha gia' il suo rimedio a mano.
