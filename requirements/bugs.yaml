      strada che si dimenticava di dirlo serviva tutto in silenzio.
      RISOLTO: `autoServe` parte SPENTO dappertutto — sbagliando in questo
      verso resta un conto aperto e si chiude, sbagliando nell'altro si
      perde un drink e si scarica una scorta mai uscita — e il pagamento di
      gruppo passa dalla regola di tutti (chiusuraPagamento). A servire resta
      una strada sola, ed è un gesto esplicito: «Riscuoti e servi» nella
      schermata di pagamento. Senza gli stati del servizio non cambia niente:
