  - id: BUG-062
    title: "Il tasto «Chiudi cassa» e' largo il doppio del suo nome e mangia la testata"
    area: "src/pages/BartenderPage.jsx (testata della coda), src/index.css (.board-cassa)"
    description: >
      Segnalato dall'utente il 20/08, con lo screenshot: «il tasto chiudi
      cassa nella schermata ordini e' troppo largo e occupa troppo spazio».
      PERCHE' ERA LARGO. Il tasto stava in un riquadro incolonnato
      (`.board-cassa-box`) con sotto la riga che spiega perche' non si puo'
      chiudere — «Prima chiudi 3 conti e servi 2 comande» — e in una
      colonna la larghezza la fa il figlio piu' largo: il bottone veniva
      lungo quanto la frase, il doppio del suo nome, in una testata dove lo
      spazio e' della barra di ricerca. La frase era stata messa li' per un
      motivo buono (in fondo alla riga finiva accanto al «+» e si leggeva
      come una nota del «nuovo ordine»): il difetto e' il POSTO, non la
      frase.
      LA CURA: il tasto torna un bottone normale, largo quanto «🔒 Chiudi
      cassa», e la spiegazione NON si butta — e' la sola cosa che dice
      perche' e' spento. Vive nel `title`, dove chi ha un mouse la trova
      passandoci sopra, e al banco — dove il mouse non c'e' — esce come
      avviso (toast) appena si prova a chiudere. Che e' il momento in cui
      la domanda nasce davvero: prima di allora e' una riga che nessuno
      legge, pagata da tutti in larghezza.
      PER QUESTO IL TASTO NON E' PIU' `disabled` MA `aria-disabled`: un
      tasto spento davvero non riceve il tocco, e chi lo preme non saprebbe
      mai perche' non succede niente. Resta scolorito (`.board-cassa.spento`)
      e continua a non chiudere niente. Sul telefono non cambia nulla: li'
      la cassa e' gia' una voce del ⋯, col suo hint.
      PASSI PER RIPRODURLO (prima della cura): coda ordini da tablet, con
      un conto aperto — il tasto «Chiudi cassa» e' largo come la frase che
      ha sotto.
      ── CORRETTA LA CURA IL 20/08/2026 ──
      «E' scomparsa la label sotto al tasto. Diventa "chiudi X conti e X
      comande"» (l'utente, guardando il risultato). Togliere la frase aveva
      curato la larghezza portandosi via la sola cosa che dice perche' il
      tasto e' grigio: il `title` lo vede chi ha un mouse da fermare sopra,
      e al banco il mouse non c'e'; l'avviso al tocco arriva DOPO aver
      premuto un tasto che sembrava rotto.
      LA FRASE TORNA SOTTO IL TASTO, E PIU' CORTA: «Chiudi 3 conti e 2
      comande» invece di «Prima chiudi 3 conti e servi 2 comande» — via il
      «Prima» e via il verbo di mezzo, che una riga sotto un tasto in cima
      alla coda si legge di sguincio mentre si versa. Declinata al singolare
      («Chiudi 1 conto e 1 comanda») e, se una delle due quantita' e' zero,
      nomina solo l'altra.
      E IL TASTO NON SI RIALLARGA, che era il difetto vero: la colonna
      (`.board-cassa-box`) adesso CENTRA i figli invece di stirarli — niente
      `align-items: stretch` — quindi il bottone tiene la sua larghezza
      naturale e la frase, che e' testo leggero e non un bersaglio, puo'
      sporgere di lato senza che nessuno provi a premerla. A sorvegliare
      l'allineamento c'e' tests/unit/css.test.js: jsdom non fa layout, e dal
      DOM quella cosa non si vede.
      L'AVVISO AL TOCCO RESTA: un tocco che non fa NIENTE si legge come
      un'app rotta, e chi preme di corsa la riga sotto non l'ha guardata.
