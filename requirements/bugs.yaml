      card non sarebbe servito — sarebbe finito fuori dal riquadro e tagliato
      come l'ombra. In piu' `overflow-x: clip`, se no i pochi pixel
      dell'ombra facevano comparire una barra di scorrimento orizzontale in
      fondo a ogni colonna (`auto` su un asse rende `auto` anche l'altro).
      DUE, ed e' un difetto piu' serio perche' toglieva l'ombra del tutto:
      TRE REGOLE RISCRIVEVANO `box-shadow` invece di aggiungersi. La
