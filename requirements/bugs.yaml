      fare». Con quel salto acceso nessuna comanda ci sta mai, quindi
      nessuna risultava divisibile. Il ragionamento di prima — «quello che è
      già al banco non si divide, il lavoro è cominciato» — valeva quando i
      due passi c'erano tutti e due.
      RISOLTO: una comanda si divide FINCHÉ IL DRINK NON È USCITO DAL BANCO,
      cioè a «da fare» e a «in preparazione». Da «pronto» in poi no: è roba
