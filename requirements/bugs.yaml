# requirements/bugs.yaml
#
# I BUG APERTI, gestiti con lo stesso formato dei requisiti.
#
# Un bug qui dentro è un comportamento sbagliato visto davvero (di solito
# al banco), descritto con cosa succede e cosa dovrebbe succedere. Quando
# viene sistemato, la fix segue il metodo di sempre: codice, test e
# requisito aggiornati insieme — il test che dimostra la fix va citato nel
# requisito dell'area in requirements.yaml, e qui lo stato passa a fixed.
#
# Formato (lo stesso di requirements.yaml, letto da lib-requisiti.mjs):
#   id:             Identificatore stabile (es. BUG-001)
#   title:          Cosa non va, in una riga
#   area:           File o moduli coinvolti
#   description:    Sintomo, comportamento atteso, e cosa si sa già
#   status:         todo (da sistemare) | fixed (risolto, test citato nel
#                   requisito dell'area) | wontfix (deciso di non farlo)
#   generate_issue: true se questa voce e' SEGUITA su GitHub. Non vuol dire
#                   «creane una adesso»: l'issue NUOVA nasce solo finche' la
#                   voce e' da fare. Quando viene finita il flag RESTA true,
#                   altrimenti la voce esce dal giro e nessuno puo' piu'
#                   metterla «in prova» su develop ne' chiuderle l'issue da
#                   main. Si mette false solo per quello che su GitHub non
#                   deve comparire affatto.
#   labels:         Label GitHub dell'AREA (pos, magazzino, stampa...) e
#                   «hotfix» se va sistemato d'urgenza. La FAMIGLIA non si
#                   scrive a mano: «requirements» o «bug» si ricava dal file da
#                   cui la voce arriva, cosi' non se ne dimentica una e non
#                   finisce «requirements» su un bug. Anche P0..P3 e
#                   severity-* si ricavano dai loro campi.
#   in_produzione:  true se morde sull'installazione che sta lavorando
#   severity:       Quanto fa male QUANDO SUCCEDE, e non dipende da noi:
#                   bloccante (il servizio si ferma) | grave (i numeri
#                   sbagliano, o lo vede il cliente) | media (si aggira) |
#                   lieve (estetica e comodita'). Sulle funzioni si lascia
#                   vuota: una cosa che non c'e' non fa male.
#   priority:       QUANDO lo sistemiamo, ed e' una decisione nostra:
#                   P0 (adesso; in produzione e' un hotfix) | P1 (questa
#                   versione) | P2 (la prossima) | P3 (quando capita).
#                   Da severity e priority scendono da se' le etichette
#                   dell'issue (P1, severity-grave): non si riscrivono in
#                   `labels`, che si terrebbero allineate in due posti.
#   test_cases:     I test della fix, quando esiste
#
# Per generare le issue da questo file:
#   node scripts/generate-issues.mjs --dry-run     # anteprima
#   GITHUB_TOKEN=<token> node scripts/generate-issues.mjs
#
# E da sé: un push su main o su un ramo hotfix/** che tocca questo file fa
# girare .github/workflows/generate-issues.yml, che crea le issue mancanti.
#
# Le issue sono idempotenti come per i requisiti: titolo con [BUG-ID],
# chi esiste già viene saltato.
#
# I bug urgenti arrivano di solito come note vocali dal banco: si mettono in
# registrazioni/ (ignorata da git) e si trascrivono con
# `python scripts/trascrivi-registrazioni.py`.

bugs:

  - id: BUG-001
    title: "In produzione l'admin vede «Missing or insufficient permissions» sulla coda"
    area: "src/lib/firebaseClient.js (App Check), firestore.rules, src/pages/BartenderPage.jsx"
    description: >
      Banner giallo d'errore in cima alla coda «In servizio» e coda vuota
      (0 aperti · 0 chiusi) per l'utente admin. Analisi del 14/08: il banner
      ha una sola sorgente, l'onError di subscribeActiveOrders — ma la
      collection orders è in lettura pubblica, quindi con le regole del repo
      quel deny è impossibile. Candidati, in ordine: (1) App Check/reCAPTCHA
      che non rilascia il gettone (incidente identico già documentato nei
      commenti di scripts/appcheck.js e scripts/recaptcha-domini.js: nega
      tutto, anche le collection pubbliche, e dipende dal dispositivo o dal
      dominio, non dal ruolo); (2) regole live in produzione diverse dal
      repo (prima del commit f8cd5ed il ruolo admin era rifiutato ovunque
      tranne che su orders); (3) banner che non si azzera mai una volta
      comparso, quindi basta una scrittura fallita per tenerlo fisso tutta
      la sessione. Verifiche in sola lettura: diagnostica-permessi.js
      (non passa da App Check: se lì è verde e il browser no, è App Check),
      appcheck.js e recaptcha-domini.js, confronto rules live/repo. Da
      chiedere: succede su tutti i dispositivi o solo su uno? Comunque
      vada, la fix collaterale è azzerare il banner al primo snapshot
      buono e loggare gli errori dei listener oggi silenziati.
    in_produzione: true
    status: todo
    generate_issue: true
    labels: [bug, produzione, sicurezza]
    severity: bloccante
    priority: P1
    test_cases: []

