    description: >
      Col locale che fa nascere le comande già in preparazione,
      «✂️ Preparazione parziale» non compariva più da nessuna parte: né nel
      dettaglio comanda né nel riquadro Comande del conto. Una funzione
      scomparsa senza che nessuno l'avesse tolta.
