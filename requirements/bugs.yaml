      copie: il secondo vede il segno del primo. La pretesa locale resta
      come primo filtro, per i propri snapshot che arrivano prima che la
      scrittura del segno torni.
      CAMBIATA LA DECISIONE, sempre il 20/08 e sempre l'utente: «solo il
      terminale che inserisce l'ordine stampa automaticamente la comanda».
      Il «chiunque l'abbia battuta» qui sopra vale ancora per il DIFETTO —
