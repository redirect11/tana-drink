  - id: BUG-044
    title: "Le ombre delle card tagliate nelle corsie, e sparite dopo il pagamento"
    area: "src/index.css (.corsia-lista, .corsia-card.pagato-da-servire, .corsia-card.acconto, .order-card.conto-acceso)"
    description: >
      Segnalato dall'utente il 19/08 guardando la lavagna: «qualcosa non va
      con le ombre, su da fare sono tagliate, su ritirato/servito non c'e'
      nulla», e poco dopo: «l'ombra scompare dopo il pagamento e il bordino
      diventa piu' spesso».
      DUE CAUSE DIVERSE, e la seconda spiega la prima meta' della frase.
      UNO: la lista di ogni corsia SCORRE (`overflow-y: auto` da 900px in
      su) e non aveva spazio attorno alle card. Un contenitore che scorre
      taglia quello che esce dai suoi bordi, e l'ombra esce: 18px di
      sfocatura piu' 4 di scostamento. Le card risultavano mozzate a destra
      e in basso, e nelle colonne strette sembravano piatte.
      RISOLTO con un padding sulla lista (2px sopra, 6 ai lati, 16 sotto):
