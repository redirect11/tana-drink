  - id: BUG-050
    title: "La comanda automatica non stampava per chi l'aveva battuta, ne' per la seconda comanda"
    area: "src/lib/printer.js (comandeDaStampare, claimComandaPrint), src/pages/BartenderPage.jsx"
    description: >
      Segnalato dall'utente il 20/08 provando sull'emulatore: «questo non
