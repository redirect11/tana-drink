      contro `isNew || closed`). Il secondo, che è quello che si usa, spegneva
      tutta la creazione.
      RISOLTO: una regola sola per entrambi — si annulla finché il conto è
      aperto, e in creazione sempre. A conto ancora vuoto non c'è niente da
      buttare, quindi non si chiede conferma: si torna in coda.
    in_produzione: false
    status: fixed
    generate_issue: false
    labels: [bug, ui, pos]
    test_cases: [tests/component/PosPage.test.jsx]

