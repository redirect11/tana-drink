  - id: BUG-047
    title: "Uno scontrino che non è uscito non esce mai più, nemmeno riaprendo il conto"
    area: "src/lib/printer.js (claimReceiptPrint), src/components/PaymentScreen.jsx, src/pages/BartenderPage.jsx, src/components/OrderPosDetail.jsx"
    description: >
      Secondo vocale della stessa sera, ed è la parte che si vedeva peggio:
      «succede anche se chiudo un conto, non l'ha stampato perché ho fatto lo
      sconto, dopo lo riapro, non gli applico lo sconto, lo chiudo, neanche
      lo stampa: è come se registra che ho fatto lo sconto in precedenza e
      quello sconto non fa la stampa».
      NON ERA LO SCONTO A RICORDARSENE. `claimReceiptPrint` tiene in
      `localStorage` l'elenco dei conti già stampati, e serve: la chiusura
      passa da più strade (schermata pagamento, coda, incasso di gruppo) e
      senza guardia lo stesso scontrino uscirebbe due volte. Ma il conto
      veniva segnato PRIMA di stampare e non veniva liberato mai: se la carta
      non usciva — la stampa fallita finiva in un `console.warn`, e il
      messaggio a schermo spariva con la schermata che si chiudeva — quel
      conto non stampava più lo scontrino automatico. Riaprirlo e richiuderlo
      non serviva a niente, e chi sta al banco non aveva modo di capirlo.
      RISOLTO con `releaseReceiptPrint`: la prenotazione si restituisce
      quando la stampa fallisce (nelle due strade automatiche) e quando un
      conto viene riaperto. La guardia contro la doppia copia resta intatta —
      cambia solo che smette di valere per una stampa che non c'è stata.
    in_produzione: true
    status: fixed
