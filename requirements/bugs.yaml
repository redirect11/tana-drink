# requirements/bugs.yaml
#
# I BUG APERTI, gestiti con lo stesso formato dei requisiti.
#
# Un bug qui dentro è un comportamento sbagliato visto davvero (di solito
# al banco), descritto con cosa succede e cosa dovrebbe succedere. Quando
# viene sistemato, la fix segue il metodo di sempre: codice, test e
# requisito aggiornati insieme — il test che dimostra la fix va citato nel
# requisito dell'area in requirements.yaml, e qui lo stato passa a fixed.
#
# Formato (lo stesso di requirements.yaml, letto da lib-requisiti.mjs):
#   id:             Identificatore stabile (es. BUG-001)
#   title:          Cosa non va, in una riga
#   area:           File o moduli coinvolti
#   description:    Sintomo, comportamento atteso, e cosa si sa già
#   status:         todo (da sistemare) | fixed (risolto, test citato nel
#                   requisito dell'area) | wontfix (deciso di non farlo)
#   generate_issue: true se questa voce e' SEGUITA su GitHub. Non vuol dire
#                   «creane una adesso»: l'issue NUOVA nasce solo finche' la
#                   voce e' da fare. Quando viene finita il flag RESTA true,
#                   altrimenti la voce esce dal giro e nessuno puo' piu'
#                   metterla «in prova» su develop ne' chiuderle l'issue da
#                   main. Si mette false solo per quello che su GitHub non
#                   deve comparire affatto.
#   labels:         Label GitHub dell'AREA (pos, magazzino, stampa...) e
#                   «hotfix» se va sistemato d'urgenza. La FAMIGLIA non si
#                   scrive a mano: «requirements» o «bug» si ricava dal file da
#                   cui la voce arriva, cosi' non se ne dimentica una e non
#                   finisce «requirements» su un bug. Anche P0..P3 e
#                   severity-* si ricavano dai loro campi.
#   in_produzione:  true se morde sull'installazione che sta lavorando
#   severity:       Quanto fa male QUANDO SUCCEDE, e non dipende da noi:
#                   bloccante (il servizio si ferma) | grave (i numeri
#                   sbagliano, o lo vede il cliente) | media (si aggira) |
#                   lieve (estetica e comodita'). Sulle funzioni si lascia
#                   vuota: una cosa che non c'e' non fa male.
#   priority:       QUANDO lo sistemiamo, ed e' una decisione nostra:
#                   P0 (adesso; in produzione e' un hotfix) | P1 (questa
#                   versione) | P2 (la prossima) | P3 (quando capita).
#                   Da severity e priority scendono da se' le etichette
#                   dell'issue (P1, severity-grave): non si riscrivono in
#                   `labels`, che si terrebbero allineate in due posti.
#   test_cases:     I test della fix, quando esiste
#
# Per generare le issue da questo file:
#   node scripts/generate-issues.mjs --dry-run     # anteprima
#   GITHUB_TOKEN=<token> node scripts/generate-issues.mjs
#
# E da sé: un push su main o su un ramo hotfix/** che tocca questo file fa
# girare .github/workflows/generate-issues.yml, che crea le issue mancanti.
#
# Le issue sono idempotenti come per i requisiti: titolo con [BUG-ID],
# chi esiste già viene saltato.
#
# I bug urgenti arrivano di solito come note vocali dal banco: si mettono in
# registrazioni/ (ignorata da git) e si trascrivono con
# `python scripts/trascrivi-registrazioni.py`.

bugs:

  - id: BUG-001
    title: "In produzione l'admin vede «Missing or insufficient permissions» sulla coda"
    area: "src/lib/firebaseClient.js (App Check), firestore.rules, src/pages/BartenderPage.jsx"
    description: >
      Banner giallo d'errore in cima alla coda «In servizio» e coda vuota
      (0 aperti · 0 chiusi) per l'utente admin. Analisi del 14/08: il banner
      ha una sola sorgente, l'onError di subscribeActiveOrders — ma la
      collection orders è in lettura pubblica, quindi con le regole del repo
      quel deny è impossibile. Candidati, in ordine: (1) App Check/reCAPTCHA
      che non rilascia il gettone (incidente identico già documentato nei
      commenti di scripts/appcheck.js e scripts/recaptcha-domini.js: nega
      tutto, anche le collection pubbliche, e dipende dal dispositivo o dal
      dominio, non dal ruolo); (2) regole live in produzione diverse dal
      repo (prima del commit f8cd5ed il ruolo admin era rifiutato ovunque
      tranne che su orders); (3) banner che non si azzera mai una volta
      comparso, quindi basta una scrittura fallita per tenerlo fisso tutta
      la sessione. Verifiche in sola lettura: diagnostica-permessi.js
      (non passa da App Check: se lì è verde e il browser no, è App Check),
      appcheck.js e recaptcha-domini.js, confronto rules live/repo. Da
      chiedere: succede su tutti i dispositivi o solo su uno? Comunque
      vada, la fix collaterale è azzerare il banner al primo snapshot
      buono e loggare gli errori dei listener oggi silenziati.
    in_produzione: true
    status: todo
    generate_issue: true
    labels: [bug, produzione, sicurezza]
    severity: bloccante
    priority: P1
    test_cases: []

  - id: BUG-002
    title: "L'ordine annullato si apre vuoto: niente item e totale a zero"
    area: "src/components/OrderPosDetail.jsx, src/lib/api.js cancelOrder"
    description: >
      Un conto annullato con saldo maggiore di zero (es. #38, 12,00 € in
      lista) aprendolo mostra 0,00 € e nessuna riga. Comportamento atteso:
      l'ordine annullato resta la fotografia di com'era prima
      dell'annullamento — item e totale visibili e coerenti con la lista.
      L'annullamento deve solo neutralizzare gli effetti: reintegro del
      magazzino (già REQ-ORD-005) e nessun cumulo nel guadagno di serata.
      Annullare non è svuotare.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, ordini, pos]
    test_cases:
      - tests/component/OrderPosDetail.test.jsx

  - id: BUG-003
    title: "L'annullamento fatto da un collega manda allo staff la notifica del cliente"
    area: "functions/lib/push-core.js, src/lib/notify.js, src/lib/preferenzeNotifiche.js"
    description: >
      Un admin che apre un ordine annullato da un altro admin su un altro
      dispositivo riceve la notifica pensata per il cliente («c'è un
      problema con il tuo ordine»), che per chi lavora al banco non ha
      senso. Comportamento atteso per admin, bartender e staff: testo
      dedicato allo staff; NESSUNA notifica push sul dispositivo; l'evento
      compare solo nella lista notifiche in-app (ordini annullati e
      ricevuti), e la si vede entrando nell'app, non aprendo l'ordine.
      Il cliente continua a ricevere la sua push come oggi.
      CAUSA (trovata il 19/08). Il messaggio non veniva dal server: la push
      delle Functions va al `push_token` scritto sull'ORDINE, che è del
      telefono del cliente. Veniva da OrderStatusPage, che è la STESSA
      pagina per tutti e due — chi lavora ci trova il conto, il cliente lo
      stato del suo ordine — e mostrava l'avviso dell'annullamento senza
      guardare chi stesse davanti allo schermo. Il gemello «drink pronto»
      quel controllo ce l'aveva già.
      RISOLTO: a chi lavora niente che interrompa — nessun avviso a schermo
      e nessuna notifica di sistema — ma l'evento si scrive nella lista
      della campanella con parole da banco («✖️ Conto annullato», numero e
      nome del conto). Un annullamento non è una cosa da fare, è una cosa
      successa: la si trova entrando nell'app, non addosso aprendo un conto.
      Al cliente resta la sua, identica.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, notifiche, staff]
    severity: lieve
    priority: P2
    test_cases:
      - tests/component/OrderStatusPage.test.jsx

  - id: BUG-004
    title: "Nel dettaglio ordine il subtotale di riga non segue la quantità"
    area: "src/components/OrderPosDetail.jsx, src/lib/orderLines.js"
    description: >
      Con 3× Tennent's Super la riga mostrava sempre 4,00 € (il prezzo
      unitario). Non era un calcolo sbagliato: il subtotale non esisteva
      proprio — nella riga c'erano nome, prezzo unitario e i tasti −/+ — e
      per sapere quanto faceva quella riga si moltiplicava a mente, col
      cliente davanti. Risolto il 14/08 come su uno scontrino: a sinistra
      «3 × 4,00 €» (da dove viene il numero), a destra il totale della riga
      accanto ai tasti; con un pezzo solo non compare, che ripeterebbe il
      prezzo già scritto accanto al nome.
      Resta aperta, e va trattata a parte, la richiesta collegata: mostrare
      gli item come righe separate invece che aggregati con la quantità. La
      base c'è (la nota fa parte dell'identità della riga, orderLines.js).
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, pos]
    test_cases:
      - tests/component/OrderPosDetail.test.jsx

  - id: BUG-005
    title: "Le note degli item non si vedono nelle code a schermo"
    area: "src/pages/BartenderPage.jsx, src/components/ServiceQueue.jsx"
    description: >
      La nota della singola riga («senza ghiaccio», «per Anna») si vede
      solo nel dettaglio POS e sulla comanda stampata. Le card della coda
      del gestionale (BartenderPage) e della sala (ServiceQueue) mostrano
      gli item come qty× nome, senza nota: chi prepara o serve guardando
      lo schermo invece della stampante non la vede mai. Comportamento
      atteso: la nota dell'item compare sotto la riga anche nelle card
      delle code, come già avviene per la nota del conto.
      RISOLTO (1.5.x). La nota della riga va a capo sotto il nome del
      prodotto — non a fianco, dove il prezzo a destra la tagliava a metà —
      in tutte e due le card: quella della coda del gestionale e quella
      della coda di sala. Le viste a corsie e il dettaglio della comanda la
      mostravano già; mancavano proprio le due card citate qui. La griglia
      compatta resta senza righe, come da disegno: non elenca i prodotti.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, comande, ui]
    severity: grave
    priority: P1
    test_cases: [tests/component/NoteRigheCoda.test.jsx]

  - id: BUG-006
    title: "Nel pagamento a righe separate il meno spegne anche quelle sotto"
    area: "src/components/PaymentScreen.jsx"
    description: >
      Con «Separa uguali», su tre birre uguali: premendo − su una si
      spengono anche tutte quelle sotto, mentre premendo + se ne riaccende
      una sola. Chi incassa vede sparire dal conto roba che non ha toccato,
      e se non se ne accorge il cliente paga meno di quello che ha preso.
      La causa è che le righe separate sono un modo di DISEGNARE una riga
      sola: la selezione resta un numero per prodotto (sel[key] = quante
      unità pagare) e le unità mostrate sono «le prime N accese». Toccare
      la seconda di tre non vuol dire «questa sì, questa no», vuol dire
      «portami il contatore a due» — e la terza si spegne per forza. Serve
      una selezione per UNITÀ, non un contatore per prodotto.
      In produzione (1.3.1) la stessa cosa succede con le caselline da
      spuntare: spuntandone una in mezzo, si spengono quelle sotto.
      RISOLTO: separando le righe, ogni unità ha la SUA quantità. Fuori da
      «separa uguali» la selezione resta un conteggio — «di questi tre, due
      li paga lui» — e va benissimo; dentro, spegnere la prima spegne la
      prima. Le due forme si convertono l'una nell'altra (unitaDaConteggio /
      conteggioDaUnita) e restano allineate, così il totale da incassare
      continua a leggersi da un numero solo.
      Un primo tentativo aveva fatto scendere il contatore di uno: ne usciva
      una sola, ma la spenta era l'ultima e non quella toccata — a schermo
      restava un gesto che non corrispondeva a niente.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, pagamenti]
    test_cases:
      - tests/component/PaymentScreen.test.jsx
      - tests/unit/pagamento.test.js

  # ── I guai raccontati dal banco il 17 agosto 2026 ────────────────────────
  # Quattro note vocali e tre schermate, trascritte con
  # scripts/trascrivi-registrazioni.py. Tutti e quattro nel Magazzino, tutti
  # e quattro da sistemare adesso: vanno in un hotfix solo.

  - id: BUG-007
    title: "Il magazzino scende sotto zero, e il carico dopo parte dal negativo"
    area: "src/lib/api.js (scarico delle comande), src/lib/inventory.js"
    description: >
      Continuando a battere un prodotto finito la giacenza scende sotto zero
      invece di fermarsi a zero. Il 17 agosto il Jagermeister era a −0,04 pz,
      con «valore −0,67 €» e la conta che si apriva già a −0,04. Il danno
      vero arriva dopo: comprando e caricando una bottiglia, il carico parte
      dal negativo e ne conta meno di una — sullo scaffale però c'è tutta, e
      da quel momento il magazzino mente su quanto prodotto c'è davvero.
      La causa è che lo scarico fa increment(-qty) senza guardare quanto c'è
      (scelto apposta: è commutativo e si accoda offline, e così deve
      restare). Va tolto al massimo quello che risulta in giacenza, sia allo
      scarico della comanda sia quando si ricalcola una comanda modificata; e
      un carico su una giacenza negativa deve ripartire da zero, altrimenti
      il buco resta. Sotto zero non si scende mai.
      RISOLTO il 17/08 (hotfix 1.3.4): due funzioni pure in inventory.js —
      scaricoPossibile (mai più di quello che c'è) e giacenzaPerCarico (un
      carico non parte dal negativo) — usate nello scarico al pagamento, nel
      riallineo della comanda modificata, in loadStock e in receiveBottles.
      L'increment resta com'era; anche unitsInStock si ferma a zero, che è da
      lì che nasceva il «valore −0,67 €».
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, hotfix, magazzino]
    test_cases: [tests/unit/inventory.test.js]

  - id: BUG-008
    title: "Sulla card del magazzino compare «7.49000000000001 pz»"
    area: "src/lib/inventory.js (formatQty), src/components/InventoryManager.jsx"
    description: >
      Sotto al numero grande, scritto bene («7,49 pz»), la card del Campari
      ne ripete uno lungo così com'è uscito dal calcolo: 7.49000000000001 pz,
      col punto al posto della virgola e la coda di decimali che si porta
      dietro qualunque moltiplicazione di ricetta. formatQty stampa il numero
      grezzo, mentre formatPezzi e formatIn arrotondano a due decimali: basta
      che lo faccia anche lui.
      Già che quella riga si tocca: per gli articoli a pezzi ripete lo stesso
      dato del numero grande, mentre lì sotto dovrebbe esserci il CONTENUTO
      in cl (o in g) — è scritto anche nel commento del codice, ed è quello
      che serve a chi sta versando.
      RISOLTO il 17/08 (hotfix 1.3.4): formatQty arrotonda a due decimali e
      usa la virgola come già facevano formatPezzi e formatIn (una funzione
      sola, condivisa con formatIn), e il `total` di bottleSummary è il
      contenuto anche per gli articoli contati a pezzo — pezzi × capienza
      della confezione, letto in cl o in g.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, hotfix, magazzino, ui]
    test_cases: [tests/unit/inventory.test.js, tests/component/InventoryManagerCard.test.jsx]

  - id: BUG-009
    title: "Il dettaglio della card del magazzino esce fuori dalla card"
    area: "src/index.css (.inv-info), src/components/InventoryManager.jsx"
    description: >
      Aprendo un prodotto nella vista a Card, il pannello dei dettagli sborda
      e il testo si incolonna a fisarmonica: «0 pz · 0 piene · 1 pz = 100 cl»
      va a capo quattro volte, e costo, IVA e prezzo consigliato si
      accavallano l'uno sull'altro. La coppia etichetta/valore usa la stessa
      griglia a due colonne della vista a Lista, dove però c'è tutta la
      larghezza dello schermo: dentro una card stretta la colonna del valore
      resta larga un dito. Nelle card va incolonnato — etichetta sopra,
      valore sotto — come già succede sugli schermi piccoli.
      PRIMO GIRO il 17/08 (hotfix 1.3.4): una regola in index.css
      (.grid-card .grid-card-actions .inv-info .inv-info-row a una colonna).
      La vista a Lista, che ha tutta la larghezza dello schermo, resta a due
      colonne: il blocco delle azioni è lo stesso per le due viste, quindi la
      regola è agganciata alla card.
      NON BASTAVA — provato sul test: le righe di testo si leggevano, ma la
      fila dei tre tasti (Modifica · Duplica · Elimina) usciva ancora dai
      bordi. Stesso errore un piano sotto: .inv-azioni era repeat(3, 1fr), e
      1fr vale minmax(auto, 1fr), che non scende sotto la larghezza del
      contenuto — tre bottoni con emoji e parola hanno un minimo più largo di
      quello che una card da 175px può dargli. La regola che li mandava a capo
      era una @media sulla FINESTRA, quindi non scattava con la finestra
      grande e la card stretta.
      SECONDO GIRO: .grid-card .inv-azioni usa
      repeat(auto-fit, minmax(min(112px, 100%), 1fr)) — colonne che si
      stringono davvero e vanno a capo da sé secondo la larghezza della CARD,
      mai più larghe della card — e i bottoni hanno min-width: 0 con la parola
      troncata come ultima difesa. La vista a Lista resta a tre colonne.
      Il layout non si misura in happy-dom (le larghezze sono zero): il test
      applica il foglio di stile vero al DOM vero e controlla quale regola
      vince su quell'elemento. Che la fila stia dentro la card va guardato con
      gli occhi.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, hotfix, magazzino, ui]
    test_cases: [tests/component/InventoryManagerCard.test.jsx]

  - id: BUG-010
    title: "Manca un'unità di misura generica: il tempo di lavorazione si legge «1 g»"
    area: "src/components/InventoryManager.jsx (form articolo), src/lib/inventory.js"
    description: >
      Nel «Contenuto di un pezzo» si può scegliere solo fra cl, ml e g. Per
      quello che non si versa e non si pesa — il tempo di lavorazione, per
      dire — non c'è niente di adatto, e si finisce a scrivere grammi: nella
      ricetta del Daiquiri si legge «Tempo di Lavorazione 1 g», che a chi
      prepara non dice niente. Serve un'unità generica «U», senza
      conversioni, accanto a cl, ml e g in quel menu a tendina.
      CHIARITO il 17/08 nell'issue #20: «Tempo di Lavorazione» non è un errore
      da togliere, è una voce di magazzino creata di proposito per mettere la
      MANODOPERA a listino — si aggancia come ingrediente ai drink che
      richiedono lavorazione, ha un costo per unità, e da lì entra nel costo
      della ricetta e nel prezzo consigliato.
      RISOLTO (hotfix 1.3.4): la «U» è un'unità di misura dell'ARTICOLO (non un
      contenuto), retta da tutta la catena — BASE_UNITS, ENTRY_UNITS,
      toBaseQty/fromBaseQty, baseUnit, UNIT_LABEL, formatQty, smallUnits,
      costPerUnit, recipeCost — e si sceglie nel form dalle «Unità di
      misura».
      Non essendo una scorta: niente scarico (resta fuori da
      computeConsumption), mai «esaurito» (stockStatus), nessun valore di
      magazzino (unitsInStock), e in carta al cliente non compare (MenuPage).
      Vedi REQ-MAG-012.
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, hotfix, magazzino]
    test_cases: [tests/unit/inventory.test.js, tests/unit/pricing.test.js, tests/component/InventoryManagerCard.test.jsx, tests/component/MenuPage.test.jsx]

  - id: BUG-011
    title: "In creazione ordine il tasto «Annulla» della barra azioni è spento"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Battendo un conto nuovo, il tasto «Annulla» della barra azioni resta
      disabilitato: prima e dopo aver aggiunto le righe, sempre. Chi apre un
      conto per sbaglio — o cambia idea a metà — non ha un modo evidente di
      uscire e deve cercare la freccia «← Ordini» in alto.
      CAUSA: i tasti «annulla» sono due, quello del pannello e quello della
      barra azioni, e avevano due regole diverse (`isNew ? !conRighe : closed`
      contro `isNew || closed`). Il secondo, che è quello che si usa, spegneva
      tutta la creazione.
      RISOLTO: una regola sola per entrambi — si annulla finché il conto è
      aperto, e in creazione sempre. A conto ancora vuoto non c'è niente da
      buttare, quindi non si chiede conferma: si torna in coda.
    in_produzione: false
    status: fixed
    generate_issue: false
    labels: [bug, ui, pos]
    test_cases: [tests/component/PosPage.test.jsx]

  - id: BUG-012
    title: "In coda compare il cartello «I gruppi sono spenti» a chi i gruppi non li usa"
    area: "src/pages/BartenderPage.jsx, src/lib/coda.js"
    description: >
      Aprendo i «Pannelli» dal ⋯ della coda, chi ha i gruppi spenti si
      ritrova un riquadro che dice «I gruppi sono spenti: si accendono in
      Impostazioni → Gruppi». È un cartello su una cosa che non ha, nello
