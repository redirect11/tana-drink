      DI PAGAMENTO apre «Pagamenti».
      LO STESSO IDENTICO INCIAMPO, LA SECONDA VOLTA. Il 20/08 era successo
      con «Riscuoti (senza stampa)»: stessa sezione sbagliata, stessa
