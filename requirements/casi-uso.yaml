  - id: UC-MENU-003
    title: "Si prepara il menù che vede il cliente: sezioni, voci e Special"
    gruppo: "Il menù"
    attore: "Gestore"
    obiettivo: >
      Presentare al tavolo un menù pensato per chi ordina, diverso dalla
      disposizione del banco, con gli Special della casa in evidenza e
      un QR che apre solo loro.
    parte_da: >
      Gestore. Nel menù della cassa ci sono le categorie «Gin e Vodka» e
      «Shot»; il menù dei clienti non è mai stato personalizzato.
      Licenza con i disegni dei drink (come la Tana).
    passi:
      - "Apre Menù e sceglie «Menù dei clienti»: senza struttura il menù dei
        clienti segue le categorie della cassa."
      - "Tocca «Prepopola con le voci della cassa»: nasce una sezione per
        categoria, con dentro i suoi prodotti."
      - "In «Nuova sezione» scrive «Vodka» e aggiunge: la sezione compare in
        cima."
      - "Su una vodka di «Gin e Vodka» usa «Sposta … in un’altra sezione» e
        sceglie «Vodka»."
      - "Su una voce scrive il «Nome» letto dal cliente, una «Descrizione» e
        gli «Ingredienti» separati da virgola."
      - "Rende nascosta la sezione «Shot»: la sezione dice «Nascosta: al
        tavolo la sezione non compare.»"
      - "Sceglie «Special (N)»: accende «Menù Special attivo», scrive Titolo e
        Sottotitolo; sotto c'è il «QR del menù Special»."
      - "Apre la scheda di un drink, accende «Drink speciale», sceglie
        bicchiere, colore e decorazione del disegno e salva."
      - "Dal menu apre «Vista cliente» (il menù come lo vede chi ordina): in
        cima il carosello degli Special; sotto le sezioni nell'ordine scelto,
        senza «Shot»."
      - "Tocca una card: si apre il dettaglio con l'immagine grande, nome e
        prezzo, la descrizione intera e gli ingredienti uno per riga."
      - "Nel carosello tocca «Vedi tutti ›»: si apre il menù Special; «← Tutto
        il menù» riporta al menù."
    esito: >
      Il cliente che apre il menù dal QR del tavolo vede le sezioni
      scelte, coi nomi, le descrizioni e gli ingredienti scritti per
      lui; ogni voce resta collegata a un prodotto della cassa, quindi
      si ordina e si scarica come sempre. Il QR del menù Special apre
      solo gli Special.
    varianti:
      - quando: "Una voce è «Non in menu» nel gestionale"
        allora: "Non compare al cliente, nemmeno nella sua sezione."
      - quando: "Il campo «Ingredienti» di una voce è vuoto"
        allora: "Al cliente si mostrano gli ingredienti della ricetta, senza quelli
          in unità «U»."
      - quando: "Si tocca «Riparti dalle voci della cassa» o il ritorno al menù per
          categorie"
        allora: "Una conferma lo chiede prima; i prodotti della cassa restano."
      - quando: "Il locale è impostato a «solo menù»"
        allora: "Al cliente spariscono i tasti per aggiungere; chi è dello staff,
          dalla stessa pagina, può ancora inserire un ordine."
      - quando: "Il locale non ha la licenza dei disegni"
        allora: "Al posto del disegno si vede la foto della voce, o un bicchiere
          neutro."
