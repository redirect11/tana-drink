  - id: UC-IMP-001
    title: "Si sceglie l'aspetto del gestionale: tema, icone, card della coda, aiuti sotto i campi"
    gruppo: "Le impostazioni"
    attore: "Admin, Bartender"
    obiettivo: >
      Chi lavora tutto il giorno sul gestionale lo vuole leggibile e
      sobrio: un tema chiaro o scuro, icone monocrome, card
      riconoscibili, e schede senza righe d'aiuto ripetute ogni giorno.
    parte_da: >
      Collegato come admin, da tablet o PC. Si apre «Impostazioni» e si
      sceglie il gruppo «Aspetto»: riquadro «Aspetto» con «Gestionale —
      quello che vedi ora», «Le card della coda», «Le icone del
      gestionale», «Aiuti sotto i campi».
    passi:
      - "Dalla tendina del tema sceglie «☀️ Chiaro»: tutta la pagina cambia
        colori subito, tasti e angoli compresi."
      - "Sceglie «🔷 Pico scuro»: cambiano anche le forme (angoli, tasti,
        ombre), non solo i colori."
      - "Tocca «Personalizza colori», cambia «Colore accento» e tocca «Salva
        tema»: accanto al titolo compare «· personalizzato»; «↩︎ Ripristina
        preset» lo riporta al tema scelto."
      - "In «Le icone del gestionale», per «Navigazione» sceglie «Emoji»: le
        icone del menu laterale tornano emoji colorate; per «Tasti e stati»
        lascia «Silhouette»."
      - "In «Le card della coda» sceglie «Il colore del conto»: nella coda la
        striscia a sinistra delle card porta il colore del conto invece dello
        stato."
      - "Apre la scheda di un drink in «Menù»: fra un campo e l'altro non ci
        sono righe d'aiuto; gli avvisi su un dato mancante si vedono lo
        stesso."
      - "Torna in «Aspetto» → «Aiuti sotto i campi» e sceglie «Visibili»:
        riaprendo la scheda del drink, e quella di un prodotto di magazzino,
        le righe d'aiuto ci sono, in frasi impersonali nel registro del
        mestiere."
    esito: >
      Le scelte valgono per tutti i terminali del locale e arrivano agli
      altri dispositivi senza ricaricare; il menù dei clienti non
      cambia, perché ha il suo tema in «Menù clienti».
    varianti:
      - quando: "Il tablet del banco è collegato con un altro account"
        allora: "Vede lo stesso tema: oggi l'aspetto è del locale, non della
          persona."
      - quando: "La rete è staccata mentre si cambia tema"
        allora: "Il tema cambia subito su questo dispositivo; gli altri lo ricevono
          quando la rete torna."
      - quando: "Si sceglie un tema scuro e uno chiaro con lo stesso conto colorato
          in coda"
        allora: "Le card colorate e i colori degli stati restano leggibili su
          entrambi."
    si_prova: browser
