  - id: UC-LIC-004
    title: "Il locale fermo per la licenza lo dice, e i dati restano"
    gruppo: "Licenza e moduli"
    attore: "Admin, Bartender, Sala"
    obiettivo: >
      Quando l'abbonamento non è in regola chi apre l'app deve capire
      che non è un guasto, che i dati non sono persi e cosa fare; il
      titolare deve sapere con anticipo se e quando i dati verranno
      cancellati.
    parte_da: >
      Un locale con cassa e conti dei giorni prima. La licenza viene
      portata, dal seme del test, a «sospesa» con un motivo e una data.
    passi:
      - "Aprendo l'app, al posto di tutto compare «Installazione sospesa»:
        «L’app di <nome del locale> è sospesa dal … . Motivo: … .», «Non è un
        guasto e i dati non sono andati persi.» e «Vai alla pagina del
        prodotto»."
      - "Dalla console del browser una scrittura su un ordine viene rifiutata
        dal database."
      - "La licenza torna «attiva»: l'app si riapre da sola sulla coda, con i
        conti di prima."
      - "Alla licenza si aggiunge una cancellazione programmata: su ogni
        schermata di chi lavora compare in cima «I dati del locale verranno
        cancellati il …» con cosa fare e «Vai all’area clienti»; l'avviso non
        si chiude."
    esito: >
      Sospesa, chiusa, scaduta o non attivata, l'app si ferma con una
      schermata che spiega lo stato; le letture restano possibili e
      niente viene cancellato dalla sospensione; l'avviso della
      cancellazione resta in vista finché la regia non lo toglie.
    varianti:
      - quando: "La licenza è scaduta (valida fino a ieri) e alla scadenza «ferma»"
        allora: "Compare «Licenza scaduta» con la data, anche con la rete staccata."
      - quando: "La licenza è scaduta e alla scadenza «free»"
        allora: "L'app non si ferma: valgono i limiti del piano Free (UC-LIC-003)."
      - quando: "La licenza non c'è"
        allora: "Compare «Installazione non attivata»; appena la licenza arriva,
          l'app si apre da sola."
      - quando: "La licenza è «chiusa»"
        allora: "Compare «Installazione chiusa» con «I dati restano consultabili
          fino alla loro cancellazione.»"
      - quando: "A guardare è un cliente sul menù"
        allora: "L'avviso della cancellazione non gli compare."
    si_prova: browser
    bisogni: []
    requisiti: [REQ-FLOTTA-008, REQ-LIC-009, REQ-FLOTTA-026]
    previsti: []
    test_cases: []

  - id: UC-LIC-005
    title: "Il titolare legge le novità di una versione e sceglie se aggiornare"
    gruppo: "Licenza e moduli"
    attore: "Admin"
    obiettivo: >
      Il titolare non vuole trovarsi una versione nuova al banco senza
      saperlo: legge prima cosa cambia e decide se aggiornare adesso,
      rimandare o saltare quella versione.
    parte_da: >
      Collegato come admin. La licenza dice «aggiornamenti a scelta» e
      propone una versione più nuova con le sue note; la regia di prova
      accetta la scelta.
    passi:
      - "All'apertura compare la finestra «Versione X disponibile» con «Prima
        di aggiornare, ecco cosa cambia:» e le note."
      - "Tocca «Più tardi»: la finestra si chiude e torna alla prossima
        apertura dell'app."
      - "Alla riapertura tocca «Salta questa versione»: la finestra si chiude;
        in «Impostazioni» → «Sistema» → «Informazioni», sotto «Aggiornamenti»,
        resta «Disponibile la versione X» col suo «Aggiorna»."
      - "Da lì tocca «Aggiorna»: compare «Versione X» col messaggio che
        l'aggiornamento è partito, e «Chiudi»."
    esito: >
      La scelta arriva alla regia senza far aspettare chi la fa; la
      proposta saltata resta recuperabile da Informazioni.
    varianti:
      - quando: "La regia pubblica un avviso sulle condizioni del servizio"
        allora: "Prima della proposta compare «Condizioni del servizio» col testo,
          «In vigore dal …» e «Ho letto»; esce una volta sola e resta in
          campanella."
      - quando: "La modalità è «obbligatori», o la licenza non ne parla"
        allora: "Nessuna finestra: l'app si aggiorna come sempre."
      - quando: "Si entra come bartender o sala"
        allora: "La finestra non compare."
      - quando: "La licenza non dice dove mandare la scelta"
        allora: "Nella finestra non ci sono «Aggiorna» e «Salta»: c'è il rimando
          «Apri l’area clienti»."
      - quando: "La regia non risponde"
        allora: "Sotto i tasti compare il messaggio d'errore della scelta; la
          proposta resta."
      - quando: "Il locale è fermo per la licenza"
        allora: "La finestra non compare sopra la schermata del locale fermo."
    si_prova: browser-con-finti
    bisogni: [UR-011]
    requisiti: [REQ-FLOTTA-020]
    previsti: []
    test_cases: []

  - id: UC-LIC-006
    title: "Il titolare passa dall'area clienti della regia all'app, e ritorno, senza rifare l'accesso"
    gruppo: "Licenza e moduli"
    attore: "Admin"
    obiettivo: >
      Il titolare gestisce abbonamento e locale da due posti (area
      clienti della regia e app del locale) e vuole saltare dall'uno
      all'altro con un tocco, già riconosciuto.
    parte_da: >
      Il titolare ha nel locale un account admin con la stessa email
      (verificata) dell'area clienti. La licenza porta l'indirizzo della
      regia; la regia di prova emette il codice di passaggio.
    passi:
      - "Si apre l'app con l'indirizzo che porta il codice di passaggio della
        regia: l'app entra da sola col suo account e il codice sparisce
        dall'indirizzo."
      - "Nel menu laterale tocca «Area clienti»: la voce dice «Apro l’area
        clienti…» e si apre la pagina della regia, già entrati."
    esito: >
      Il passaggio non chiede password in nessuna delle due direzioni e
      il codice non resta nell'indirizzo, né si riusa.
    varianti:
      - quando: "Il codice è scaduto o già usato"
        allora: "Si arriva al riquadro «Accesso staff» con una riga che dice perché,
          sopra il modulo."
      - quando: "La regia non risponde a «Area clienti»"
        allora: "Si resta nell'app con un messaggio d'errore in una riga."
      - quando: "Si è collegati come bartender"
        allora: "La voce «Area clienti» non c'è."
      - quando: "Il titolare vuole correggere telefono, partita IVA, codice fiscale
          o sede legale scritti dalla regia"
        allora: "Da stabilire (vedi dubbi): il riquadro «Il locale» che li contiene
          non compare in nessun gruppo delle Impostazioni."
    si_prova: browser-con-finti
