  - id: UC-PAG-002
    title: "Il tavolo chiede il conto e ognuno paga la sua parte"
    gruppo: "I pagamenti"
    attore: "Bartender"
    obiettivo: >
      Il bartender mostra il preconto al tavolo e poi incassa il conto a
      pezzi: chi paga i suoi drink, chi lascia una cifra, chi chiude il
      resto; a ogni passo si sa cosa è pagato e cosa resta.
    parte_da: >
      Cassa aperta. In coda c'è il conto del tavolo 4 con 2 × Daiquiri
      (8,00 €), 1 × Birra in Bottiglia (5,00 €) e 2 × Negroni (8,00 €):
      37,00 €. Stampante finta. Entrato come bartender.
    passi:
      - "Apre il conto, tocca «Pagamento · 37,00 €» e poi «Preconto»: esce il
        preconto e il conto resta aperto e modificabile."
      - "Tocca «Deseleziona tutti»: tutte le voci passano a zero e si vedono
        smorte; in alto «NESSUNA RIGA SCELTA», 0,00 €, e «Riscuotere» è
        spento."
      - "Tocca le etichette dei due Daiquiri e della Birra in Bottiglia: in
        alto «RIGHE SCELTE (3)» e 21,00 €."
      - "Tocca «Contante» e «Riscuotere · 21,00 €»: il conto resta aperto;
        sotto «GIÀ PAGATO» c'è «Pagate · Contante» con «2× Daiquiri · 1× Birra
        in Bottiglia»."
      - "Il secondo cliente lascia 10 €: batte 10 sul tastierino; in alto
        «IMPORTO A MANO» e sotto «Acconto: resta sul conto, non copre righe
        precise.» Riscuote in «Carta di Credito»."
      - "Tocca «Seleziona tutti»: «Riscuotere · 6,00 €». Riscuote in
        contanti."
    esito: >
      Il conto è chiuso con tre incassi distinti (21,00 € pagate in
      contanti, 10,00 € di acconto in carta, 6,00 € di saldo in
      contanti), ognuno col suo metodo e la sua ora. Il tasto Pagamento
      ha detto a ogni passo quanto restava. Lo scontrino finale riporta
      i metodi davvero usati.
    varianti:
      - quando: "Dopo il primo tocco su una voce"
        allora: "Il primo tocco restringe la selezione a quella voce, i tocchi
          successivi aggiungono; il «−» toglie sempre una unità."
      - quando: "Chi ha pagato la sua parte vuole una ricevuta e il locale ha acceso
          lo scontrino d'acconto"
        allora: "«Acconto con scontrino» incassa la parte e stampa la ricevuta; se
          quell'incasso chiuderebbe il conto, è spento e al tocco spiega
          perché."
      - quando: "Il tavolo vuole dividere in parti uguali"
        allora: "I tasti «/2» e «/3» del tastierino dividono l'importo."
      - quando: "Il cliente chiede il codice lotteria"
        allora: "«Codice Lotteria»: si scrive il codice, «Salva codice», e il tasto
          mostra ✓; il codice esce sullo scontrino."
      - quando: "Il cliente chiede una fattura di cortesia (funzione premium
          accesa)"
        allora: "«Invia fattura» emette la fattura numerata, la si invia per email o
          si stampa, e la si ritrova nel gestionale in «Fatture»."
      - quando: "La rete è staccata"
        allora: "Ogni incasso si vede subito sotto «GIÀ PAGATO» e parte in
          sottofondo."
