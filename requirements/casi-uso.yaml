  - id: UC-BANCO-006
    title: "Si annulla un conto sbagliato e lo si rimette in corso"
    gruppo: "Il conto al banco"
    attore: "Bartender"
    obiettivo: >
      Il bartender annulla un conto battuto per errore (le scorte
      tornano e il cliente viene avvisato), oppure riapre un conto
      chiuso o annullato per sbaglio, senza perdere niente e lasciando
      traccia del perché.
    parte_da: >
      Cassa aperta, stati del servizio accesi. In coda c'è un conto
      aperto con un Negroni in preparazione (la giacenza del gin è già
      stata annotata) e un conto da 16,00 € incassato in contanti e
      chiuso. Entrato come bartender.
    passi:
      - "Apre il conto col Negroni e tocca «Annulla ordine»: si apre
        «Annullare l'ordine #…?» con «Le eventuali scorte usate verranno
        ripristinate.»"
      - "Sceglie la frase per il cliente, lascia acceso «Notifica il cliente»
        e tocca «Conferma»: si torna alla coda e il conto non è più fra gli
        aperti."
      - "Apre «Filtri» → «Annullati»: il conto è lì."
      - "Apre il conto annullato: al posto di «Pagamento» c'è «Riapri conto».
        Lo tocca: «Rimettere in corso il conto?», con «Perché lo riapri?
        (facoltativo)»."
      - "Scrive «annullato per errore» e tocca «Riapri»: il conto torna fra
        gli aperti, con il motivo leggibile dentro il conto."
      - "Dal ⋯ apre «Storia del conto»: aperto, annullato e riaperto, con chi
        (nome e ruolo) e perché."
      - "Apre il conto chiuso da 16,00 €, tocca «Riapri conto» e conferma con
        «Riapri»."
    esito: >
      Annullando, le scorte scalate sono tornate in magazzino com'erano
      state scalate (non ricalcolate dalla ricetta di adesso). Riaperto,
      il conto annullato ha le comande annullate di nuovo da fare. Il
      conto incassato riaperto torna da incassare: il suo incasso da
      16,00 € esce dai guadagni della serata e dal contante atteso, e la
      storia dice «riaperto — tolti 16,00 € dagli incassi»; le righe si
      possono di nuovo modificare. Gli altri terminali vedono l'avviso
      «Conto ripristinato», questo no.
    varianti:
      - quando: "Il conto era stato scontato o pagato con un buono VIP"
        allora: "Annullando, il credito torna al beneficiario; riaprendo un conto
          annullato e scontato col buono, il saldo si ri-addebita (fino a
          quanto ce n'è)."
      - quando: "Il drink era già stato preparato e il cliente non l'ha ritirato"
        allora: "Si segna «non ritirato» / «non servito»: il conto si annulla ma le
          scorte restano scalate."
      - quando: "Il locale fa solo servizio al tavolo"
        allora: "Nel dialogo di annullo la frase «Prego recarsi al bancone» non
          viene proposta."
      - quando: "La rete è staccata"
        allora: "Annullo e riapertura si vedono subito in coda; la scrittura parte
          quando la rete torna."
    si_prova: browser
    bisogni: [UR-006, UR-010]
    requisiti:
