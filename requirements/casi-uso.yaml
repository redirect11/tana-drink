  - id: UC-CLIENTE-005
    title: "Il cliente paga online quando ordina dal telefono"
    gruppo: "Il cliente al telefono"
    attore: "Cliente, Bartender"
    obiettivo: >
      Il cliente vuole pagare subito con la carta dal telefono, e il
      banco vuole che il conto risulti pagato solo quando il pagamento è
      andato a buon fine.
    parte_da: >
      Licenza con SumUp; in Impostazioni → Pagamenti è acceso «Pagamento
      online (SumUp)». Il lettore e il servizio SumUp sono sostituiti da
      un finto che risponde «riuscito» o «rifiutato». Il cliente ha due
      drink nel carrello.
    passi:
      - "Tocca «Rivedi ordine»: sotto «Pagamento» sceglie «Paga ora» (l'altra
        scelta è «Paga al bancone»)."
      - "Scrive il nome e tocca «Conferma e paga»."
      - "Sulla pagina dell'ordine, nel riquadro «Pagamento», tocca «Paga ora»
        col totale e completa il pagamento."
      - "Legge «Verifico il pagamento…» e poi il pagamento risulta fatto."
      - "Al banco il conto risulta pagato online."
    esito: >
      Il conto è saldato col metodo online, con l'importo dell'ordine, e
      le righe non si possono più cambiare dal telefono.
    varianti:
      - quando: "Il pagamento viene rifiutato"
        allora: "Il conto resta da pagare; il tasto diventa «Riprova il pagamento» e
          il cliente può di nuovo correggere l'ordine."
      - quando: "Il locale richiede il pagamento online per ordinare"
        allora: "Il riepilogo avverte che la carta verrà chiesta dopo la conferma;
          il conto entra nella coda del banco, e lo annuncia l'avviso «Nuovo
          ordine», solo quando è pagato."
      - quando: "Pagando al bancone col vincolo «ritiro se non pagato»"
        allora: "Il servizio al tavolo è spento e il riepilogo spiega che per il
          servizio al tavolo si paga online."
      - quando: "La carta viene rifiutata"
        allora: "Compare «Il pagamento non è andato a buon fine. Riprova» e il tasto
          «Riprova il pagamento»; l'ordine resta da pagare e non entra in
          coda."
      - quando: "Il pagamento non è obbligatorio"
        allora: "L'ordine entra in coda subito; se il pagamento fallisce il cliente
          può pagare al bancone."
      - quando: "Il pagamento online non è disponibile"
        allora: "La pagina dice che non è al momento disponibile e cosa fare."
    si_prova: browser-con-finti
    bisogni: [UR-009, UR-008]
    requisiti: [REQ-PAG-005, REQ-NOTIF-002, REQ-CLI-001]
    previsti: [REQ-TAVOLI-001]
    test_cases: []

  - id: UC-STAMPA-001
    title: "La comanda esce da sola, una volta, dal terminale che ha battuto il conto"
    gruppo: "La stampa"
    attore: "Bartender"
    obiettivo: >
      Chi batte un conto vuole che la comanda esca su carta senza
      premere niente, una volta sola e accanto a sé, non sul tablet in
      fondo alla sala; e quando serve vuole poterla rifare a mano.
    parte_da: >
      Due terminali di banco, tutti e due con la stampante impostata e,
      in Impostazioni → Cassa e giornata → Stampa automatica, «Stampa la
      comanda all'arrivo dell'ordine» acceso con «Banco e sala». Cassa
      aperta. La stampante è quella finta: ogni foglio uscito si conta.
    passi:
      - "Sul tablet A, Marzia tocca «Nuovo ordine» e batte due Negroni e un
        Hugo: mentre compone il conto non esce niente."
      - "Tocca «Torna agli ordini»: dal tablet A esce una comanda con «COMANDA
        1 - ORDINE N», i due Negroni su una riga sola («2») e l'Hugo."
      - "Dal tablet B, con la coda aperta, non esce niente."
      - "Ricaricando la coda sul tablet A la comanda non esce una seconda
        volta."
      - "Marzia riapre il conto, aggiunge uno Spritz e manda la comanda: esce
        dal tablet A una comanda con lo Spritz."
      - "Nel conto apre «Comande»: ci sono due comande e sopra i tasti «Una
        per comanda (2)» e «Tutto su una»."
      - "Tocca «Tutto su una»: esce un foglio solo con tutti i prodotti del
        conto, quantità sommate."
      - "Tocca «Una per comanda (2)»: escono due fogli separati, uno per
        comanda."
    esito: >
      Ogni comanda è uscita una volta, dal terminale che l'ha battuta,
      con le voci uguali accorpate; le ristampe a mano fanno esattamente
      i fogli che dicono i tasti, e contengono solo quel conto.
    varianti:
      - quando: "Marzia annulla il conto mentre lo sta ancora componendo"
        allora: "Non esce nessuna comanda, nemmeno con la stampa automatica accesa."
      - quando: "L'ordine arriva da un cliente col telefono (non ha un terminale che
          l'ha battuto)"
        allora: "Lo stampa il terminale con la stampa automatica accesa che lo vede
          per primo, una volta sola."
      - quando: "Stampa automatica impostata «Solo dalla sala»"
        allora: "Le comande battute al banco non escono da sole; quelle della sala
          sì."
      - quando: "Il conto ha una comanda annullata"
        allora: "Né «Una per comanda» né «Tutto su una» la rimettono su carta."
      - quando: "Il conto ha una comanda sola"
        allora: "I due tasti di ristampa insieme non compaiono; resta la stampa
          della singola comanda."
      - quando: "Una riga ha una nota"
        allora: "Sulla comanda la riga con la nota resta separata da quelle uguali
          senza nota, e la nota si legge."
    si_prova: browser-con-finti
    bisogni: [UR-004]
    requisiti:
      - REQ-STAMPA-001
      - REQ-STAMPA-013
      - REQ-STAMPA-012
      - REQ-STAMPA-021
      - REQ-STAMPA-010
      - REQ-STAMPA-014
      - REQ-UI-025
