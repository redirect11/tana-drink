  - id: UC-AVVISI-003
    title: "Sala e bancone si chiamano a vicenda"
    gruppo: "Gli avvisi fra chi lavora"
    attore: "Sala, Admin, Bartender"
    obiettivo: >
      Chi è al banco vuole chiamare un collega in sala, e chi è in sala
      vuole chiamare il bancone, senza gridare né scrivere messaggi: la
      chiamata deve farsi notare finché qualcuno non risponde.
    parte_da: >
      Flavio (admin) al banco sulla coda; Ciro (sala) col telefono sulla
      coda. Nessuna chiamata in corso.
    passi:
      - "Ciro, dal menu laterale, tocca «Chiama il bancone»: la voce diventa
        «In attesa del bancone…» e un secondo tocco non ne manda un'altra."
      - "Sul tablet di Flavio compare a tutto schermo «Chiamata dalla sala»,
        con chi chiama, e «✓ Rispondo»."
      - "Flavio tocca «✓ Rispondo»: il riquadro sparisce e sul telefono di
        Ciro la voce torna «Chiama il bancone»."
      - "Flavio apre il ⋯ della coda e tocca «Chiamate staff e gruppi»: nel
        riquadro «Chiama lo staff» c'è Ciro."
      - "Tocca «Chiama» accanto a Ciro, scrive «Vieni al bancone» e tocca
        «Invia chiamata»: accanto a Ciro compare «In chiamata…»."
      - "Sul telefono di Ciro, su qualunque schermata, compare «Chiamata dal
        bancone» col messaggio; tocca «✓ Rispondo»."
    esito: >
      Ogni chiamata è arrivata alla persona o al ruolo giusto, è rimasta
      in vista finché non c'è stata risposta, e la risposta l'ha chiusa
      per tutti e due.
    varianti:
      - quando: "Non c'è nessun altro account dello staff da chiamare"
        allora: "Il riquadro aperto dal ⋯ lo dice, e dice che gli account si creano
          in «Utenti e ruoli»."
      - quando: "Il telefono chiamato è in tasca o l'app è chiusa"
        allora: "Arriva come notifica di sistema e il telefono vibra con insistenza
          (prova a mano)."
      - quando: "Un cliente prova a chiamare qualcuno"
        allora: "Non può: il database lo rifiuta."
      - quando: "La rete è staccata sul telefono della sala quando tocca «Chiama il
          bancone»"
        allora: "La voce passa subito a «In attesa del bancone…»; la chiamata parte
          quando la rete torna."
      - quando: "Nel locale c'è un solo account del personale"
        allora: "Aprendo «Chiamate staff e gruppi» si legge «Non c'è nessun altro da
          chiamare: gli account dello staff si creano in Utenti e ruoli»."
      - quando: "Chi riceve la chiamata sta guardando un conto o la cassa"
        allora: "La chiamata compare lo stesso sopra quella schermata."
      - quando: "Il dispositivo che riceve è in tasca con l'app chiusa"
        allora: "Arriva la notifica push che vibra (da verificare a mano su un
          telefono vero)."
