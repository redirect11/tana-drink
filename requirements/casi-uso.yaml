  - id: UC-STAMPA-004
    title: "Il gestore decide come si presenta il locale: nome, intestazione, campi e logo sulle stampe"
    gruppo: "La stampa"
    attore: "Admin, Cliente"
    obiettivo: >
      Il gestore vuole che nome, indirizzo e logo del locale siano
      quelli giusti ovunque li legga un cliente — vetrina, menù,
      scontrino — e scegliere quali voci compaiono sullo scontrino e
      sulla comanda.
    parte_da: >
      Flavio (admin) è in Impostazioni. Nessun valore salvato in «Il
      locale» né nei campi di stampa: valgono quelli della build.
      Stampante finta.
    passi:
      - "In Impostazioni → Il locale scrive un nome del locale, l'indirizzo e
        la ragione sociale."
      - "Apre la vetrina e il menù in un'altra finestra, come cliente: nome
        nella barra, nella testata del menù e nel benvenuto."
      - "In Impostazioni → Stampante, in «Cosa c'è sullo scontrino», spegne
        l'intestazione delle colonne e accende la riga di saluto scrivendone
        il testo."
      - "Tocca la prova di stampa del riquadro: lo scontrino di prova ha il
        nuovo indirizzo in testa, la ragione sociale in fondo, la riga di
        saluto, niente intestazione delle colonne, e sempre la lista dei
        prodotti e il totale."
      - "In «Cosa c'è sulla comanda» spegne l'ora nella fascia: la comanda di
        prova ha la fascia «COMANDA 1 - ORDINE N» senza ora."
      - "In «Logo sulle stampe» carica un logo chiaro e piccolo: viene
        accettato; lo accende per lo scontrino e il preconto e lo lascia
        spento per la comanda."
    esito: >
      Le pagine del cliente e la carta parlano col nome del locale; le
      stampe escono coi campi scelti, e su tutti i terminali, perché
      sono impostazioni del locale.
    varianti:
      - quando: "Il logo caricato è una foto scura, o quasi bianca, o molto più alta
          che larga"
        allora: "Viene rifiutato subito, dicendo perché; resta il logo di prima."
      - quando: "Il logo non si carica al momento della stampa"
        allora: "Lo scontrino esce lo stesso, senza logo."
      - quando: "Chi è collegato è un bartender o la sala"
        allora: "Non può caricare il logo né cambiare l'identità del locale."
      - quando: "Un locale che non ha mai aperto questi riquadri"
        allora: "La carta esce identica a prima."
      - quando: "L'intestazione era già stata scritta in Impostazioni → Stampante,
          «Dati del locale»"
        allora: "Sullo scontrino vince quella già scritta: «Il locale» riempie solo
          dove non c'è niente."
