  - id: UC-STAFF-002
    title: "Ognuno vede e fa solo quello che il suo ruolo consente"
    gruppo: "Il personale"
    attore: "Admin, Bartender, Sala"
    obiettivo: >
      Il titolare vuole che la sala serva e corregga i conti senza
      toccare il lavoro del banco, e che i conti del locale (bilancio,
      fornitori) li veda solo lui, anche se qualcuno prova a forzare
      l'indirizzo.
    parte_da: >
      Cassa aperta, un conto in coda con una comanda «in preparazione» e
      una «pronta». Si entra a turno con gli account di sala, bartender
      e admin (UC-STAFF-001).
    passi:
      - "Come sala: il menu laterale ha «Coda ordini», «Da servire»,
        «Stampante», «Ordina dal menù» e «Chiama il bancone»; non ci sono
        «Cassa», «Statistiche», «Magazzino», «Utenti e ruoli»,
        «Impostazioni»."
      - "Come sala, nella coda, la comanda «pronta» si porta a «servito»; la
        comanda «in preparazione» non ha i tasti per portarla a «pronto» o per
        tornare indietro."
      - "Come sala apre il conto e toglie con «−» una riga della comanda in
        preparazione: la riga sparisce e il totale scende subito."
      - "Come sala aggiunge un drink al conto e conferma: nella coda compare
        una comanda nuova, separata da quelle che c'erano."
      - "Come sala scrive a mano nell'indirizzo /bar?tab=impostazioni: si
        ritrova sulla coda ordini."
      - "Come bartender: il menu laterale ha Coda ordini, Cassa, Statistiche,
        Menù, Magazzino, Staff, Utenti e ruoli, Impostazioni, ma non
        «Bilancio» né «Fornitori»."
      - "Come bartender scrive a mano /bar?tab=bilancio: si ritrova sulla
        coda, senza una pagina che dice «non puoi»."
      - "Come bartender apre «Utenti e ruoli»: vede l'elenco del personale con
        la scritta «I ruoli li assegna l’admin…», senza i tasti «Ruolo»,
        sospendi ed elimina."
      - "Come admin: nel menu laterale ci sono anche «Bilancio» e «Fornitori»,
        e in «Utenti e ruoli» le sezioni «Utenze registrate», «Chi apre la
        cassa», «Nuovo account», «Buoni VIP»."
    esito: >
      Le sezioni del menu laterale e i tasti delle comande corrispondono
      al ruolo; un indirizzo scritto a mano non apre una sezione
      riservata; le correzioni fatte dalla sala si vedono subito sulla
      card in coda.
    varianti:
      - quando: "La rete è staccata mentre la sala toglie una riga o porta una
          comanda a «servito»"
        allora: "La card in coda cambia nell'istante del gesto; la sincronizzazione
          arriva dopo."
      - quando: "La sala prova a togliere una riga da una comanda già servita o
          annullata"
        allora: "Il «−» resta spento: quello che è stato servito non si tocca."
      - quando: "La sala prova ad annullare il conto o dividere una comanda"
        allora: "I tasti non ci sono: restano del banco."
      - quando: "Un cliente registrato o la sala provano, dalla console del browser,
          a scrivere un ordine non loro, a portare un conto ad «annullato» o a
          scrivere le paghe"
        allora: "Il database rifiuta la scrittura (permesso negato); a schermo non
          cambia niente sugli altri terminali."
    si_prova: browser
