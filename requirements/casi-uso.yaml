  - id: UC-STAMPA-003
    title: "Al cliente si stampano il preconto, lo scontrino e la ricevuta d'acconto"
    gruppo: "La stampa"
    attore: "Bartender"
    obiettivo: >
      Il cliente vuole un foglio che dica quanto deve, poi lo scontrino
      di quello che ha pagato; chi paga una parte e se ne va vuole la
      sua ricevuta. Chi incassa non vuole che la carta esca due volte o
      non esca.
    parte_da: >
      Cassa aperta, stampante finta. «Stampa lo scontrino alla
      riscossione del conto» acceso con «Banco e sala». Un conto aperto
      al tavolo 4 con tre drink, nessun incasso.
    passi:
      - "Marzia tocca «Pagamento» e poi «Preconto»: esce un foglio col totale;
        il conto resta aperto e modificabile."
      - "Nella schermata di pagamento lascia selezionato un solo drink,
        sceglie «Contante» e tocca «Riscuotere»: lo scontrino finale non esce,
        il conto resta aperto."
      - "Ristampa il preconto: elenca l'incasso preso e la riga «Resta da
        pagare» con la differenza."
      - "Seleziona il resto, sceglie la carta e tocca «Riscuotere»: esce lo
        scontrino, una volta sola, con i metodi scritti per esteso
        («Contante», «Carta di Credito»)."
      - "Sullo scontrino ci sono numero e data, il tavolo 4, e la riga di chi
        stampa porta il nome di chi è collegato (Marzia)."
    esito: >
      Preconto e scontrino riportano le stesse cifre del conto; lo
      scontrino è uscito una volta, al gesto della riscossione che
      chiude il conto.
    varianti:
      - quando: "In Cassa e giornata è acceso «Un tasto per l'acconto con lo
          scontrino»"
        allora: "Nella schermata di pagamento c'è «Acconto con scontrino»: incassa
          la parte scelta ed esce la ricevuta con la fascia «ACCONTO», le
          righe pagate, il metodo e quanto resta; il conto resta aperto.
          Quando l'incasso chiuderebbe il conto il tasto è spento e, toccato,
          dice perché."
      - quando: "È acceso «Lo scontrino d'acconto a ogni riscossione»"
        allora: "Ogni incasso che non chiude il conto fa uscire da sé la ricevuta
          d'acconto; l'interruttore del tasto è spento e dice perché."
      - quando: "Si riscuote con «Riscuoti (senza stampa)»"
        allora: "Il conto si chiude e la carta non esce."
      - quando: "Si riapre un conto già chiuso e lo si riscuote di nuovo"
        allora: "Lo scontrino esce di nuovo."
      - quando: "Rientrando in coda su un terminale con la memoria vuota"
        allora: "Non esce nessuno scontrino dei conti già pagati: la coda stampa
          solo comande."
      - quando: "A fine serata si chiude la cassa"
        allora: "Esce la chiusura con gli incassi divisi per i metodi davvero usati,
          scritti per esteso."
    si_prova: browser-con-finti
    bisogni: [UR-002, UR-005]
    requisiti:
