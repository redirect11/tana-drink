    obiettivo: >
      Avere una copia di tutto (ordini, incassi, magazzino, menù, ore)
      prima di un'operazione grossa, e poterla rimettere senza perdere
      quello che è arrivato dopo.
    parte_da: >
      Accesso come admin, su un ambiente di test con dati. Gin Tonic
      Prova costa 8,00 €.
    passi:
      - "In Impostazioni apre «Backup e ripristino»: ci sono «Esporta tutto» e
        «Ripristina da file»."
      - "Tocca «Esporta tutto»: il tasto dice «Scarico…» e il browser scarica
        un file JSON."
      - "Nel Menù porta Gin Tonic Prova a 9,00 € e crea una voce nuova «Voce
        dopo il backup»."
      - "Torna in «Backup e ripristino», tocca «Ripristina da file» e sceglie
