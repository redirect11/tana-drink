  - id: UC-PAG-001
    title: "Si incassa con la carta: col lettore SumUp o con un POS esterno"
    gruppo: "I pagamenti"
    attore: "Bartender"
    obiettivo: >
      Il bartender incassa con la carta del cliente; il conto risulta
      pagato solo quando il lettore conferma, e un pagamento rifiutato
      lascia il conto da incassare con lo stesso importo.
    parte_da: >
      Cassa aperta. In Impostazioni → Pagamenti «Lettore SumUp Solo» è
      acceso e associato (nell'ambiente di prova, il lettore simulato).
      In coda c'è un conto aperto da 15,00 €. Entrato come bartender.
    passi:
      - "Apre il conto, tocca «Pagamento · 15,00 €» e nella colonna dei metodi
        tocca «SumUp» (col nome del lettore)."
      - "Tocca «Riscuotere · 15,00 €»: compare «Transazione avviata sul
        lettore: il conto si aggiorna da solo all'esito.»"
      - "Il lettore conferma il pagamento: il conto risulta pagato senza
        toccare altro."
    esito: >
      Il conto è chiuso e l'incasso è registrato come carta col lettore,
      separato dai contanti: nella chiusura di cassa non entra nel
      contante atteso. Il conto è stato segnato pagato solo dopo l'esito
      confermato dal lettore.
    varianti:
      - quando: "La carta viene rifiutata"
        allora: "Il conto resta aperto con lo stesso importo da incassare e la card
          in coda mostra «Pagamento fallito»; si può ripetere o cambiare
          metodo."
      - quando: "Si incassa dalla card in coda"
        allora: "«Incassa sul lettore» avvia la transazione; mentre è in corso la
          card dice «In corso sul lettore… carta del cliente sul Solo.» e c'è
          «Annulla sul lettore»."
      - quando: "Il lettore non è ancora associato"
        allora: "«SumUp» è spento a vedersi ma si può toccare: dice che il lettore
          si attiva in Impostazioni → Pagamenti."
      - quando: "Il bancone incassa su un POS di un'altra banca"
        allora: "Si sceglie «Carta di Credito»: l'incasso si registra subito come
          carta, anche senza rete, e non entra nei contanti."
      - quando: "Si associa il lettore"
        allora: "In Impostazioni → Pagamenti, con «Lettore SumUp Solo» acceso, si
          scrive il codice di pairing mostrato dal lettore e si tocca
          «Associa»; un codice scaduto lo dice in chiaro. Associare è di chi
          sta al banco."
      - quando: "La rete è staccata"
        allora: "SumUp è spento e al tocco dice di registrare come «Carta di
          Credito»."
    si_prova: browser-con-finti
    bisogni: [UR-009, UR-005]
    requisiti: [REQ-PAG-001, REQ-PAG-004, REQ-CASSA-003]
    previsti: []
