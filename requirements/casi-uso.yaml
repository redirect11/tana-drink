  - id: UC-AVVISI-002
    title: "Ognuno sceglie i suoi avvisi, ritrova lo storico e sa quando sono spenti"
    gruppo: "Gli avvisi fra chi lavora"
    attore: "Sala, Bartender"
    obiettivo: >
      Al banco serve «nuovo ordine», in sala serve «pronto»: chi lavora
      vuole tenere solo gli avvisi del suo mestiere su quel dispositivo,
      ritrovare quelli arrivati, e accorgersi se il dispositivo non
      suona affatto.
    parte_da: >
      Ciro (sala) è entrato sul telefono; il browser non ha ancora
      deciso sui permessi delle notifiche. È sulla coda.
    passi:
      - "In cima alla pagina compare «Gli avvisi sono spenti su questo
        dispositivo.» con «Attiva gli avvisi»."
      - "Tocca «Attiva gli avvisi» e accetta: la riga sparisce; aprendo la
        campanella legge «Gli avvisi arrivano su questo terminale.»"
      - "Dal menu laterale tocca il suo nome e apre «Il mio profilo»: nel
        riquadro «Notifiche» spegne «Nuovo ordine» e lascia acceso «Diventa
        pronto»."
      - "Al banco entra un ordine nuovo: a Ciro non arriva nessun avviso. Il
        banco porta una comanda a «Pronto»: a Ciro arriva."
      - "Nella campanella tocca «Segna tutte lette»: le notifiche escono dalla
        lista; con «Storico» le ritrova, le già lette sbiadite."
      - "Lo «Storico delle notifiche» nel profilo mostra lo stesso elenco;
        «Svuota storico» lo svuota anche nella campanella."
    esito: >
      Su quel telefono arrivano solo gli avvisi scelti, la scelta non
      tocca né il tablet del banco né gli altri colleghi, e lo storico
      racconta cosa è arrivato su quello schermo.
    varianti:
      - quando: "Ciro rifiuta il permesso"
        allora: "La riga ricompare con «Non sono stati attivati. Riprova: senza, qui
          non arriva nessun ordine.» e il tasto per riprovare."
      - quando: "Il browser ha bloccato le notifiche"
        allora: "La riga spiega che si riaccendono dalle impostazioni del browser,
          alla voce Notifiche per questo sito, e non mostra un tasto che non
          farebbe niente."
      - quando: "Ciro esce («Esci») e al banco arriva un ordine"
        allora: "Il suo telefono non suona più; rientrando si registra di nuovo da
          sé, senza passare dalla coda (prova a mano per la push)."
      - quando: "Ciro esce senza rete"
        allora: "Esce comunque entro pochi secondi, senza restare bloccato."
      - quando: "In Impostazioni → Notifiche (gestore)"
        allora: "C'è solo un cartello che porta al profilo."
    si_prova: browser
