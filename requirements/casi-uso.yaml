  - id: UC-MAG-007
    title: "Arriva la merce: si registra la consegna e il magazzino si carica"
    gruppo: "Fornitori, ordini e conti del mese"
    attore: "Admin"
    obiettivo: >
      Caricare in magazzino quello che è arrivato davvero, coi pezzi e i
      prezzi del documento di consegna, e lasciare in attesa quello che
      manca.
    parte_da: >
      Accesso come admin. Ordine a Nova «Richiesto» con due righe: Gin
      Prova 6 pz a 19,50 € e Vermouth Prova 3 pz a 12 €. Gin Prova ha 2
      pz ed è «In assortimento».
    passi:
      - "In Fornitori → «Lista ordini» sceglie il filtro «Richiesti»: c'è
        l'ordine di Nova."
      - "Tocca «Consegnato»: si apre «Merce arrivata da Nova?» con tutte le
        righe spuntate; ogni riga dice pezzi × prezzo e il suo totale, in
        fondo il «Totale netto»."
      - "Su Gin Prova corregge i pezzi da 6 a 5 e il prezzo da 19,50 a 20: il
        totale riga diventa 100,00 e il netto si rifà a ogni battuta."
      - "Toglie la spunta al Vermouth Prova, non arrivato: il tasto diventa
        «Carica i selezionati (1)». Lo tocca."
      - "In Magazzino Gin Prova ha 7 pz; nella sua movimentazione c'è una
        «Consegna ordine fornitore» di +5 pz."
      - "Nel listino di Nova il prezzo di Gin Prova è 20,00, con la variazione
        registrata."
      - "Sull'ordine il Vermouth Prova risulta ancora da ricevere; ripetendo
        «Consegnato» compare solo lui."
    esito: >
      Il magazzino è stato caricato sulle quantità ricevute; il prezzo
      del documento è diventato il prezzo di listino di Nova e il costo
      del prodotto. Quando l'ordine non ha più righe da ricevere passa a
      «Consegnato», con la scritta «senza documento» finché non ha una
      fattura, e i suoi prodotti escono da «In assortimento» tornando
      allo stato di prima.
    varianti:
      - quando: "Tutto è arrivato come ordinato"
        allora: "Il tasto dice «Carica tutti (2)» e carica tutte le righe in un
          gesto."
      - quando: "Una riga dell'ordine riguarda un prodotto che in magazzino non
          esiste"
        allora: "Alla consegna il prodotto nasce con nome, prezzo e IVA della riga,
          contato a pezzi e con la merce già dentro, segnato come scheda da
          completare finché non gli si dà la categoria."
      - quando: "Gin Prova era sotto zero (−1 pz) prima della consegna"
        allora: "Dopo la consegna di 5 pz la giacenza è 4 pz."
