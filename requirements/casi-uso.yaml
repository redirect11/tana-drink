  - id: UC-PAG-005
    title: "Una tavolata con più conti paga insieme o alla romana"
    gruppo: "I pagamenti"
    attore: "Bartender, Sala"
    obiettivo: >
      Quando più conti separati devono pagare insieme (una tavolata, un
      evento) il bartender li raccoglie in un gruppo e li incassa in
      blocco o in quote uguali.
    parte_da: >
      Cassa aperta, «Abilita i gruppi» acceso in Impostazioni → Gruppi
      di ordini. In coda ci sono tre conti aperti (8,00 €, 15,00 € e
      14,00 €). Entrato come bartender.
    passi:
      - "Crea il gruppo «Compleanno» dal pannello dei gruppi in coda."
      - "Apre ciascuno dei tre conti e dal ⋯ «Associa a un gruppo» sceglie
        «Compleanno»."
      - "Apre il gruppo: vede i tre conti, il totale 37,00 € e quanto resta da
        pagare."
      - "Tocca «Dividi», accanto a «Dividi per» porta le parti a 3 con «+» e
        «−», e tocca «3 quote» col segno dei contanti."
    esito: >
      I tre conti sono saldati; la somma delle quote fa esattamente
      37,00 € e il centesimo di resto va sull'ultima. Il gruppo risulta
      saldato.
    varianti:
      - quando: "Si paga tutto il gruppo in un colpo"
        allora: "«Contanti» o «Carta» saldano tutti i conti da pagare del gruppo."
      - quando: "Si paga un conto solo del gruppo"
        allora: "Dall'elenco del gruppo si incassa quel conto, gli altri restano da
          pagare."
      - quando: "Il gruppo ha sottogruppi"
        allora: "Il totale somma tutto l'albero; un gruppo contenitore non riceve
          ordini diretti."
      - quando: "Un conto annullato sta nel gruppo"
        allora: "Non entra nel totale."
      - quando: "Il lettore SumUp o il pagamento online sono attivi"
        allora: "«Lettore» o «Online» incassano l'intero gruppo con la carta, e il
          pagamento chiude tutti i conti del gruppo."
      - quando: "Si paga tutto insieme invece che a quote"
        allora: "«Contanti» o «Carta» saldano il resto del gruppo in un colpo,
          ciascuno col suo metodo."
      - quando: "Ogni persona paga il suo conto"
        allora: "Con «Paga per singolo ordine» si incassa un conto per volta, in
          contanti o con carta."
      - quando: "Il gruppo contiene sottogruppi (es. «Tavolo A» e «Tavolo B»)"
        allora: "Il totale somma tutti i conti dei sottogruppi; nel gruppo che li
          contiene non si possono mettere conti diretti, si ordina nei figli."
      - quando: "Un conto del gruppo è stato annullato"
        allora: "Non entra nel totale del gruppo."
      - quando: "I gruppi sono spenti in Impostazioni"
        allora: "Non compaiono da nessuna parte e nulla cambia nel resto del
          lavoro."
    si_prova: browser
