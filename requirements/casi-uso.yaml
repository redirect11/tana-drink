  - id: UC-BANCO-004
    title: "Dalla coda si trova subito il conto che serve"
    gruppo: "Il conto al banco"
    attore: "Bartender, Sala"
    obiettivo: >
      A metà serata chi è al banco ritrova un conto fra decine (i suoi,
      quelli chiusi, quelli annullati, quelli rimasti aperti da ieri) e
      sa con chi sta lavorando, senza che la coda nasconda lavoro da
      fare.
    parte_da: >
      Cassa aperta. In coda ci sono conti aperti di Marzia e di Ciro,
      due conti chiusi, uno annullato e un conto rimasto aperto dalla
      serata di ieri. Marzia (bartender) è sulla Coda ordini; Ciro è
      collegato da un altro terminale.
    passi:
      - "Marzia apre la coda: compare subito, dalla copia locale, senza
        attese; il riepilogo in testata dice quanti conti sono aperti, chiusi
        e annullati in questa apertura."
      - "Nella legenda vede le iniziali di chi ha aperto i conti e chi è
        collegato adesso, Ciro compreso."
      - "In fondo alla coda il conto di ieri sta sotto la sua data, con la
        riga «⏳ Da chiudere»."
      - "Tocca «Filtri»: sotto si apre la fila dei filtri."
      - "Accende anche «Chiusi» oltre ad «Aperti»: vede gli uni e gli altri;
        spegne «Aperti»: restano i chiusi."
      - "Nella tendina degli autori lascia solo sé stessa: restano i suoi
        conti, in qualunque stato."
      - "Chiude la fila: il tasto dei filtri dice cosa è acceso (per esempio
        «Chiusi +1»)."
      - "Accende «Annullati»: compare il conto annullato, che non conta fra i
        chiusi."
    esito: >
      Il riepilogo in testata non cambia cambiando filtro. Il conto di
      ieri non si mescola a quelli di stasera ma non sparisce. I filtri
      restano come li si è lasciati su questo terminale.
    varianti:
      - quando: "Si spengono sia «Chiusi» sia «Annullati»"
        allora: "«Aperti» si riaccende da solo: la coda non resta mai vuota per un
          filtro."
      - quando: "Si accende «Solo oggi»"
        allora: "I conti dei giorni scorsi spariscono dalla vista e il filtro dice
          quanti sono."
      - quando: "A guardare è la sala"
        allora: "Vede la legenda di chi ha aperto i conti ma non chi è collegato."
      - quando: "Si chiude un conto da questo terminale"
        allora: "Sparisce dagli aperti nell'istante in cui si torna alla coda, senza
          aspettare il server."
      - quando: "La cassa è stata chiusa e riaperta nella stessa sera"
        allora: "I conti chiusi o annullati prima dell'ultima chiusura non compaiono
          più in nessun filtro; i conti aperti restano sempre."
    si_prova: browser
    bisogni: [UR-002, UR-007]
