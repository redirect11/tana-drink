  - id: UC-CLIENTE-002
    title: "Il cliente corregge o annulla il suo ordine finché non è in preparazione"
    gruppo: "Il cliente al telefono"
    attore: "Cliente, Bartender"
    obiettivo: >
      Il cliente ha sbagliato una quantità o ha cambiato idea, e vuole
      sistemarlo da sé prima che il banco cominci; se è il banco ad
      annullare, vuole sapere perché e cosa fare.
    parte_da: >
      Come UC-CLIENTE-001: il cliente ha appena mandato un ordine di due
      drink, che è «Ordine ricevuto» e nessuno ha ancora preso in mano.
      È sulla pagina dell'ordine.
    passi:
      - "Nel «Riepilogo» tocca «+» su un drink: il totale si aggiorna."
      - "Tocca «Salva modifiche»: compare «Modifiche salvate» e al banco la
        card mostra il totale nuovo."
      - "Tocca «Annulla ordine»: la finestra chiede «Annullare il tuo ordine?»
        e avverte che l'ordine verrà annullato definitivamente."
      - "Conferma con «Annulla ordine»: la pagina dice «Ordine annullato» e
        offre «← Torna al menù»."
      - "Al banco il conto esce dagli aperti e va fra gli annullati."
    esito: >
      Le correzioni del cliente arrivano al banco col totale giusto;
      l'ordine annullato non resta fra quelli da preparare.
    varianti:
      - quando: "Il banco ha già portato l'ordine «In preparazione», o ha aggiunto
          una comanda"
        allora: "Spariscono «Salva modifiche» e «Annulla ordine»: da lì si chiede
          allo staff."
      - quando: "Il banco annulla l'ordine del cliente con la frase «Prego recarsi
          al bancone» e un motivo"
        allora: "La pagina del cliente mostra «C'è stato un problema con il tuo
          ordine.», la frase scelta e «Motivazione: …»; se il cliente ha
          attivato le notifiche gli arriva anche «Problema con il tuo ordine»
          (prova a mano)."
      - quando: "Il cliente ha già pagato online"
        allora: "Le righe non si toccano più e l'ordine non si annulla dal
          telefono."
    si_prova: browser
    bisogni: [UR-008]
