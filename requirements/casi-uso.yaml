  - id: UC-LIC-002
    title: "Il titolare prova, aggiunge o disdice un modulo dal Marketplace"
    gruppo: "Licenza e moduli"
    attore: "Admin"
    obiettivo: >
      Il titolare allarga o restringe quello che l'app fa, al mese,
      senza uscire dall'app e senza chiedere a nessuno, e vede il modulo
      comparire appena la licenza cambia.
    parte_da: >
      Collegato come admin su un locale con licenza della regia (con
      indirizzo della regia). La regia di prova risponde col listino e
      accetta le azioni; Stripe è sostituito da una pagina finta.
      «Inventario di magazzino» non è incluso, «Magazzino e fornitori»
      sì.
    passi:
      - "Dal menu laterale apre «Marketplace» e sceglie la sezione «Moduli»:
        una scheda per modulo con lo stato («Incluso», «Non incluso», «In
        prova fino al …») e il prezzo al mese."
      - "Sulla scheda di un modulo non incluso con prova tocca «Prova gratis N
        giorni»: si legge «Prova di «…» attivata: il modulo compare fra pochi
        istanti.»; poco dopo lo stato diventa «In prova fino al …» e la voce
        compare nel menu laterale."
      - "Su un altro modulo non incluso tocca «Aggiungi»: si apre la pagina di
        pagamento; al ritorno si legge «Pagamento ricevuto. Il modulo si
        attiva appena la regia aggiorna la licenza.»"
      - "Sulla scheda «Magazzino e fornitori» tocca «Disdici»: la conferma
        «Disdire «…»?» avvisa che resta attivo fino alla fine del periodo
        pagato e che si spegne anche «Inventario di magazzino», se c'è; tocca
        «Disdici»."
      - "Si legge «Disdetta registrata: «…» resta attivo fino al …»."
    esito: >
      Prove, acquisti e disdette partono dall'app e la licenza cambia
      dalla regia; l'app la vede cambiare da sola e accende o spegne le
      voci del modulo.
    varianti:
      - quando: "Il modulo richiede una base che il locale non ha (l'inventario
          senza il magazzino)"
        allora: "Sulla scheda non ci sono «Prova» e «Aggiungi», solo la frase
          «Richiede …»."
      - quando: "Il piano è gestito a mano (pagato fuori da Stripe)"
        allora: "«Aggiungi» non porta al pagamento: si legge «Richiesta di «…»
          inviata all'assistenza: il modulo si attiva alla conferma del
          pagamento.»"
      - quando: "Il pagamento viene annullato sulla pagina di pagamento"
        allora: "Al ritorno: «Pagamento annullato: nessun addebito e nessuna
          modifica alla licenza.»"
      - quando: "La regia non risponde (rete staccata)"
        allora: "Si legge «Il listino della regia non risponde: prezzi e prove sono
          quelli già noti a questo dispositivo.»; un'azione tentata dà «La
          regia non risponde. Verificare la connessione e riprovare.»"
      - quando: "Si entra come bartender"
        allora: "Le schede si vedono senza tasti, con «Moduli e abbonamenti li
          gestisce il titolare.»"
      - quando: "La licenza è quella scritta nell'installazione (la Tana)"
        allora: "Si legge «La licenza di questa installazione si gestisce presso chi
          la amministra: qui si consulta soltanto.» e non ci sono tasti."
    si_prova: browser-con-finti
