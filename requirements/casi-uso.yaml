  - id: UC-STAMPA-005
    title: "La stampante non risponde: lo si sa prima, si sa cosa non è uscito e si rimette a posto"
    gruppo: "La stampa"
    attore: "Bartender, Sala"
    obiettivo: >
      Con la stampante spenta, senza carta o col certificato scaduto,
      chi lavora vuole saperlo prima di averne bisogno, sapere quale
      foglio non è uscito e perché, e non restare con l'app bloccata.
    parte_da: >
      Cassa aperta, Marzia al banco sulla coda con la stampante
      impostata e il pallino verde. Stampante finta, che dal pannello
      Dev sa fingere «Carta finita» e «Nessuna risposta».
    passi:
      - "Dal pannello Dev si finge «Carta finita»."
      - "Marzia batte un conto e lo riscuote: il conto si chiude subito, come
        sempre, anche se la carta non esce."
      - "Arriva l'avviso «Stampa non riuscita» che dice quale foglio non è
        uscito e «la carta è finita»; l'avviso resta nella campanella."
      - "In Impostazioni → Stampante, nel «Registro delle stampe», la voce
        dello scontrino dice «Non stampata» con il motivo; sopra, lo stato
        della coda delle stampe («Nessuna stampa in corso», «Coda vuota»)."
      - "Si toglie il guasto e si riscuote un altro conto: lo scontrino esce,
        senza uscire dall'app né ricollegare niente, e nel registro la voce
        risulta stampata."
    esito: >
      Nessun gesto è rimasto ad aspettare la stampante, il foglio non
      uscito è scritto sia nell'avviso sia nel registro, e la stampa
      riprende da sola appena il guasto passa.
    varianti:
      - quando: "La stampante riceve ma non conferma («Nessuna risposta» dal
          pannello Dev)"
        allora: "Nel registro la voce resta «In attesa di risposta»; nessun avviso
          d'errore."
      - quando: "Lo stesso guasto si ripete più volte in un minuto"
        allora: "Arriva un avviso solo, non uno per foglio; il registro le ha
          tutte."
      - quando: "La stampa resta appesa"
        allora: "Dopo quindici secondi la stampa si arrende e lo dice; il conto si
          può ristampare."
      - quando: "La stampante è spenta o il certificato non è più accettato (prova a
          mano, al locale)"
        allora: "Entro mezzo minuto il pallino in coda diventa rosso; toccandolo si
          legge «Adesso la comanda non uscirebbe: …» e il collegamento
          all'indirizzo della stampante per accettare l'avviso di sicurezza.
          Riaccesa, il pallino torna verde e la comanda successiva esce."
      - quando: "Il pallino rosso lo guarda chi è in sala"
        allora: "Non gli si dice di andare nelle impostazioni, che non ha."
      - quando: "Stampante vera: carta finita o coperchio aperto a metà serata
          (prova a mano)"
        allora: "Avviso con la frase giusta, e il collegamento non viene buttato:
          tolto il guaio, si stampa subito."
