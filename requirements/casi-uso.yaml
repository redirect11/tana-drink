  - id: UC-CLIENTE-003
    title: "Il cliente che ritira al banco viene avvisato quando il drink è pronto"
    gruppo: "Il cliente al telefono"
    attore: "Cliente, Bartender"
    obiettivo: >
      Chi ha ordinato col ritiro al banco deve alzarsi al momento
      giusto: vuole essere avvisato quando il drink è pronto, una volta
      sola, e non restare a fissare il telefono.
    parte_da: >
      Locale con consegna «Ritiro e servizio», gli stati del servizio
      accesi e il tabellone «stiamo servendo» acceso in Impostazioni →
      Menù clienti. Il cliente ha mandato un ordine col «Ritiro al
      banco» ed è sulla pagina dell'ordine; il browser non gli ha ancora
      chiesto le notifiche.
    passi:
      - "Sulla pagina vede «Avvisami quando è pronto» e la frase che senza
        notifiche la pagina si aggiorna da sola."
      - "Tocca «Avvisami quando è pronto» e accetta il permesso: legge
        «Notifiche attive: ti avviseremo quando è pronto.»"
      - "Al banco Marzia porta la comanda a «Pronto»."
      - "La pagina del cliente passa a «Pronto al servizio» da sola; sul menù
        il tabellone mostra «Pronto al ritiro il numero» col suo numero."
      - "Al cliente arriva la notifica «Il tuo drink è pronto!» con «Ordine #N
        pronto al ritiro.» (prova a mano)."
    esito: >
      Il cliente sa che il drink è pronto da tre strade — la pagina, il
      tabellone, la notifica — e la notifica arriva una volta per
      comanda.
    varianti:
      - quando: "Il cliente non concede le notifiche"
        allora: "Niente squillo: la pagina lo dice («Senza notifiche non si perde
          niente…») e passa a pronto da sola."
      - quando: "Il banco riporta la comanda indietro e la rimette a «Pronto»"
        allora: "Il cliente non riceve un secondo avviso per lo stesso drink (prova
          a mano)."
      - quando: "L'ordine è servito al tavolo"
        allora: "«Avvisami quando è pronto» non c'è; la pagina dice «Non devi fare
          niente: te lo portiamo al tavolo.»"
      - quando: "Gli stati del servizio sono spenti"
        allora: "Nessun tasto d'avviso: la pagina dice di ritirare al banco quando
          il drink è pronto."
      - quando: "Il cliente ha ordinato a voce al banco, senza telefono"
        allora: "Il suo numero, stampato sullo scontrino, compare nel tabellone del
          menù fra i pronti al ritiro."
    si_prova: browser
    bisogni: [UR-008]
    requisiti: [REQ-CLI-006, REQ-NOTIF-001, REQ-CLI-001]
    previsti: []
    test_cases: []

  - id: UC-CLIENTE-004
    title: "Il cliente segue dal telefono un ordine battuto dallo staff, col QR"
    gruppo: "Il cliente al telefono"
    attore: "Bartender, Sala, Cliente"
    obiettivo: >
      Chi ha ordinato a voce vuole comunque seguire il suo drink dal
      telefono; chi lavora vuole girargli una schermata adatta a lui e
      tornare subito al conto.
    parte_da: >
      Stati del servizio accesi, cassa aperta. Marzia ha battuto al
      banco un conto di un Negroni ed è nella schermata del conto. Il
      cliente ha il telefono in mano.
    passi:
      - "Marzia apre il ⋯ del conto e tocca «Mostra al cliente»."
      - "Si apre la schermata da girare al cliente: «Ordine #N» con lo stato,
        «✏️ Modifica», e «Mostra QR al cliente»; non c'è il riquadro «Il tuo
        numero»."
      - "Tocca «Mostra QR al cliente»: compare il QR con «Il cliente scansiona
        e segue l'ordine dal suo telefono.»"
      - "Il cliente apre sul suo telefono il collegamento del QR: vede «Il tuo
        numero», il numero e lo stato del suo ordine."
      - "Marzia tocca «✏️ Modifica»: torna nel conto."
      - "Marzia porta la comanda a «Pronto»: la pagina sul telefono del
        cliente cambia da sola."
    esito: >
      Il cliente segue lo stesso conto che il banco lavora; lo staff ha
      girato la schermata giusta ed è tornato al conto senza passare
      dalla coda.
    varianti:
      - quando: "Gli stati del servizio sono spenti"
        allora: "«Mostra al cliente» e «Mostra QR al cliente» non compaiono: non ci
          sarebbe niente da seguire."
      - quando: "Chi lavora apre il collegamento dell'ordine senza la vista cliente"
        allora: "Entra nella schermata del conto, qualunque ruolo abbia (banco o
          sala)."
    si_prova: browser
    bisogni: [UR-008]
