  - id: UC-MAG-002
    title: "Si carica merce a mano, si rettifica una giacenza e si fa un reso al fornitore"
    gruppo: "Il magazzino"
    attore: "Gestore"
    obiettivo: >
      Tenere la giacenza allineata allo scaffale fuori dal giro degli
      ordini: un carico diretto, una rettifica dopo un controllo, una
      bottiglia resa, e poi ritrovare tutto nella movimentazione del
      prodotto.
    parte_da: >
      Gestore in Magazzino → Prodotti. «Gin Prova» ha 2 pz (1 pz = 70
      cl), costo 20 €/pz netti; nessun movimento negli ultimi 90 giorni.
    passi:
      - "Apre la card di Gin Prova e tocca «Carico»: in «Verso del movimento»
        è scelto «Carico»."
      - "Scrive 3 come quantità caricata in pz, lascia «Costo unitario (€,
        netto)» a 20 e tocca «Conferma carico»: la giacenza passa a 5 pz."
      - "Tocca «Contenuto reale», scrive 4,5 in «Contenuto effettivo di “Gin
        Prova”» con l'unità pz e tocca «Salva contenuto»: la giacenza diventa
        4,5 pz."
      - "Tocca di nuovo «Carico», sceglie «Reso al fornitore», scrive 1 come
        quantità resa e tocca «Conferma reso»: la giacenza scende a 3,5 pz."
      - "Tocca «Movimenti»: si apre la movimentazione di Gin Prova, sul
        periodo «90 giorni»."
      - "Legge i totali per tipo: «Carico diretto» +3 pz, «Contenuto reale»
        −0,5 pz, «Reso al fornitore» −1 pz; sotto, il «Venduto mese per mese»
        e l'elenco dei movimenti dal più recente."
      - "Chiude la movimentazione e dalla barra in alto passa alla sezione
        «Movimenti» del magazzino: i tre movimenti sono fra gli ultimi di
        tutto il magazzino."
    esito: >
      Giacenza di Gin Prova 3,5 pz. Ci sono tre movimenti col loro
      motivo: carico, rettifica (contenuto reale) e reso al fornitore.
      Il reso esce dalla giacenza e si sottrae dagli acquisti del
      periodo al costo del prodotto: non viene contato come consumo. Il
      prezzo di vendita delle voci di menù che usano il gin non cambia.
    varianti:
      - quando: "La giacenza è sotto zero (−1 pz) e si caricano 5 pz"
        allora: "La giacenza diventa 4 pz: il carico si somma alla giacenza com'è,
          non riparte da zero."
      - quando: "Nel carico si scrive un costo unitario diverso (22 invece di 20)"
        allora: "Il costo di riferimento del prodotto passa a 22 €/pz; il prezzo di
          vendita del menù non si muove."
      - quando: "La merce arriva a cartoni: si accende «Carico a colli», «Pezzi per
          collo» 6 e «Colli ricevuti» 2"
        allora: "La quantità si riempie da sé a 12 pz e il prezzo si ricava dal
          totale del collo."
      - quando: "C'è un inventario in corso"
        allora: "Nell'inventario il carico va in ACQ, il contenuto reale cambia RIM
          e CONS (non il DEP), il reso toglie da ACQ e non tocca il CONS."
      - quando: "Si sceglie il periodo «Tutto» su un prodotto venduto prima
          dell'app"
        allora: "Fra i totali compaiono anche le «Vendite su Tiller», e il venduto
          mese per mese ha le due colonne App e Tiller."
