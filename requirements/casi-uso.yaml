# requirements/casi-uso.yaml
#
# LA SPECIFICA DEL PRODOTTO: cosa fa chi usa l'app, un obiettivo intero
# alla volta (REQ-DEV-019, docs/modello-a-v.md).
#
# L'utente, 09/11/2026: «non abbiamo una specifica vera del prodotto.
# Sulla base di quella, vanno testati i casi d'uso direttamente nel
# browser». I requisiti dicono cosa fa l'app un comportamento alla volta;
# qui c'è quello che banco, sala, cliente e gestore fanno davvero, dalla
# prima schermata all'esito. Ogni caso d'uso si prova con un test
# end-to-end in tests/e2e/, fatto coi soli gesti di chi lavora, su un
# ambiente di prova generato per il giro e poi eliminato; il cliente
# valida dopo, sul sito di test.
#
# BOZZA del 09/11/2026, scritta dai registri, dai test e dal codice: va
# rivista col gestore prima di scriverci sopra i test. Le domande aperte
# raccolte stendendola stanno in docs/casi-uso-domande.md.
#
# Formato:
#   id:          UC-<ZONA>-NNN, stabile
#   title:       l'obiettivo, in una frase
#   gruppo:      il capitolo della specifica
#   attore:      Bartender | Sala | Cliente | Gestore | Admin (anche più d'uno)
#   obiettivo:   cosa vuole ottenere e perché gli serve
#   parte_da:    le condizioni di partenza, osservabili
#   passi:       i gesti e quello che si vede, coi nomi dell'interfaccia
#   esito:       cosa si vede alla fine e cosa deve risultare vero
#   varianti:    le coppie quando/allora: rete staccata, cassa chiusa,
#                ruolo che non può, dato mancante…
#   si_prova:    browser | browser-con-finti (stampante o SumUp finti) |
#                a-mano (carta stampata, lettore fisico)
#   bisogni:     gli UR-* che serve
#   requisiti:   i REQ-* fatti che mette in gioco
#   previsti:    i REQ-* todo/partial che aspetta
#   test_cases:  i test end-to-end (tests/e2e/), quando ci sono

casi_uso:

  - id: UC-CASSA-001
    title: "Si apre la cassa a inizio serata, anche dopo aver già battuto i primi conti"
    gruppo: "La cassa della serata"
    attore: "Bartender"
    obiettivo: >
      Il bartender apre la serata con il fondo cassa, così che da lì in
      poi ogni incasso finisca nella chiusura giusta; se i primi clienti
      arrivano prima, i loro conti si battono lo stesso e si incassano
      appena la cassa è aperta.
    parte_da: >
      Entrato come bartender, sulla Coda ordini. Nessuna cassa aperta:
      in cima alla coda c'è l'avviso «Cassa chiusa — gli ordini si
      battono, per incassare va aperta la cassa.» con il tasto «Apri
      cassa». Nel menù ci sono Negroni (8,00 €) e Mojito (8,00 €).
    passi:
      - "Tocca «Nuovo ordine» e batte un Negroni: il conto nasce al primo
        tocco e il tasto in fondo dice «Pagamento · 8,00 €»."
      - "Tocca «Pagamento»: nella schermata di pagamento compare «Cassa
        chiusa: per incassare va aperta la cassa.»; «Riscuotere» e «Impagato»
        sono spenti, mentre «Preconto» e «Sconto» restano usabili."
      - "Chiude il pagamento con «✕ Chiudi», torna con «Torna agli ordini» e,
        al box «Nome del conto», tocca «Salva senza nome»: in coda c'è la card
        del conto con 8,00 €."
      - "Tocca «Apri cassa» nell'avviso in cima alla coda: si apre un box che
        chiede il fondo, facoltativo."
      - "Scrive 50 nel fondo e conferma con «Apri cassa»: l'avviso sparisce e
        nel menù ⋯ della coda la voce diventa «Chiudi cassa»."
      - "Riapre il conto dalla card, tocca «Pagamento»: «Riscuotere · 8,00 €»
        ora è acceso, senza essere usciti e rientrati."
    esito: >
      La cassa risulta aperta con fondo 50,00 €; il conto battuto prima
      dell'apertura c'è, è numerato e si può incassare. Nessun incasso è
      stato registrato mentre la cassa era chiusa. Il riepilogo in
      testata della coda conta i conti di questa apertura.
    varianti:
      - quando: "Nel box del fondo si tocca «Annulla»"
        allora: "La cassa resta chiusa e l'avviso «Cassa chiusa» resta in cima alla
          coda."
      - quando: "Il fondo si lascia vuoto"
        allora: "La cassa si apre lo stesso, con fondo zero."
      - quando: "A guardare la coda è la sala (Ciro — Sala)"
        allora: "L'avviso dice «gli ordini si battono, per incassare la deve aprire
          il banco.» e non c'è nessun tasto «Apri cassa», né nell'avviso né
          nel menù ⋯."
      - quando: "Sulle card della coda, a cassa chiusa"
        allora: "I tasti «Contanti», «Carta» e «Incassa sul lettore» ci sono ma sono
          spenti, e il loro titolo dice il perché; il «+» per un nuovo ordine
          resta attivo."
      - quando: "La rete è staccata e l'app si è appena aperta"
        allora: "Finché la sessione di cassa non è arrivata dalla cache non si
          spegne niente; il conto battuto prende comunque il numero giusto
          della serata."
    si_prova: browser
    bisogni: [UR-005, UR-007]
    requisiti:
      - REQ-CASSA-002
      - REQ-CASSA-008
      - REQ-CASSA-017
      - REQ-ORD-007
      - REQ-ORD-016
    previsti: []
    test_cases:
      - tests/e2e/apriCassa.spec.js

  - id: UC-CASSA-002
    title: "A metà serata si controlla quanto deve esserci in cassa"
    gruppo: "La cassa della serata"
    attore: "Bartender, Admin"
    obiettivo: >
      Al cambio turno, o quando un conteggio non torna, chi tiene la
      cassa vuole sapere subito quanto contante deve esserci nel
      cassetto, quanto si è incassato e chi ha incassato, senza
      aspettare la chiusura.
    parte_da: >
      Cassa aperta con fondo 50,00 €. Nella serata sono stati incassati
      un conto da 16,00 € in contanti (da Marzia) e uno da 8,00 € con
      «Carta di Credito» (da Banco, l'admin). Entrato come bartender,
      sulla Coda ordini.
    passi:
      - "Dal menù laterale apre «Cassa»: si apre sulla sottosezione «Flusso»,
        con la pastiglia «Cassa aperta»."
      - "Legge «Incassato serata»: 24,00 €."
      - "Legge «In cassa adesso»: 66,00 €, cioè il fondo più i soli contanti."
      - "Legge «Conto medio», con il numero dei conti, dei coperti e quanto
        lascia una persona."
      - "Legge «Chi ha incassato»: Marzia 16,00 €, l'admin 8,00 €."
      - "Scorre fino ad «Andamento per ora» per vedere com'è andata l'ultima
        ora."
    esito: >
      Il contante atteso in cassa è 66,00 €: la carta non è finita nei
      contanti. I numeri sono quelli della serata in corso e si
      aggiornano da soli a ogni nuovo incasso, anche fatto da un altro
      terminale.
    varianti:
      - quando: "In tutta la serata ha incassato una persona sola"
        allora: "L'elenco «Chi ha incassato» non compare."
      - quando: "Un incasso è stato registrato con un metodo mai usato prima"
        allora: "Compare con il suo nome accanto agli altri metodi, che restano
          elencati anche a zero."
      - quando: "Dalla stessa pagina si apre «Storico ordini» o «Chiusure»"
        allora: "Sono le altre due sottosezioni della stessa Cassa, nel menù
          laterale."
    si_prova: browser
    bisogni: [UR-005]
    requisiti: [REQ-CASSA-007, REQ-CASSA-003, REQ-CASSA-006]
    previsti: []
    test_cases: []

  - id: UC-CASSA-003
    title: "Si chiude la cassa a fine serata e il contante torna al centesimo"
    gruppo: "La cassa della serata"
    attore: "Bartender"
    obiettivo: >
      A fine serata il bartender conta il contante, lo confronta con
      quello che dice l'app e chiude la serata con lo scontrino di
      chiusura, con ogni metodo di pagamento separato e gli impagati in
      evidenza.
    parte_da: >
      Cassa aperta alle 19:00 con fondo 50,00 €. Nella serata: un conto
      da 16,00 € incassato in «Contante», uno da 8,00 € con «Carta di
      Credito» e uno da 6,00 € chiuso «Impagato». Nessun conto aperto,
      nessuna comanda da servire. Sono le 01:30 (dopo mezzanotte).
      Stampante finta accesa sul terminale. Sulla Coda ordini.
    passi:
      - "Dal menù ⋯ della coda tocca «Chiudi cassa» (sotto c'è scritto «Conta
        il contante e chiudi la serata.»)."
      - "Si apre il box «Chiudere la cassa?»: «Incassato serata» 24,00 €, «di
        cui contanti» 16,00 €, «Contante atteso» 66,00 €."
      - "Il box dice anche «1 conto chiuso impagato» e «6,00 € da
        riscuotere»."
      - "Nel campo del contante contato scrive 65: compare «Mancano 1,00 €
        rispetto all'atteso.»"
      - "Corregge in 66: compare «Il conto torna.»"
      - "Tocca «Chiudi cassa»: compare «Cassa chiusa.» e in cima alla coda
        torna l'avviso «Cassa chiusa»."
    esito: >
      La sessione di cassa è chiusa con fondo 50, incassato 24, contanti
      16, contante atteso 66, contato 66, differenza 0 e 6,00 € di
      impagato da riscuotere. La serata, anche se chiusa all'01:30,
      appartiene al giorno in cui era stata aperta. Dalla stampante esce
      lo scontrino di chiusura con gli incassi divisi per metodo, solo
      quelli usati. Nella coda i conti incassati e annullati di questa
      serata non compaiono più, in nessun filtro; il riepilogo in
      testata torna a zero.
    varianti:
      - quando: "C'è ancora un conto aperto, o una comanda pagata ma non servita"
        allora: "«Chiudi cassa» nel menù ⋯ è spento e sotto dice cosa manca in una
          riga, per esempio «Chiudi 2 conti e 3 comande»."
      - quando: "La stampante è spenta o non risponde"
        allora: "La cassa si chiude lo stesso, nell'istante del tocco; l'avviso
          «Chiusura non stampata» lo dice e l'esito resta nel registro delle
          stampe."
      - quando: "La rete è staccata"
        allora: "La chiusura si vede subito a schermo e arriva al server da sola
          quando la rete torna."
      - quando: "Il conto impagato era stato aperto il giorno prima"
        allora: "Conta per la serata in cui è stato chiuso, non per quella in cui
          era nato."
      - quando: "Il cambio di giornata (Impostazioni → Giornata di lavoro) cade
          dentro l'orario di apertura"
        allora: "Le impostazioni mostrano un avviso: spezzerebbe la serata in due
          giornate."
    si_prova: browser-con-finti
    bisogni: [UR-005]
    requisiti:
      - REQ-CASSA-001
      - REQ-CASSA-002
      - REQ-CASSA-003
      - REQ-CASSA-008
      - REQ-CASSA-015
      - REQ-CASSA-016
      - REQ-ORD-007
      - REQ-STAMPA-004
      - REQ-STAMPA-016
    previsti: []
    test_cases: []

  - id: UC-CASSA-004
    title: "Il gestore rivede com'è andata una serata, una settimana o un mese"
    gruppo: "La cassa della serata"
    attore: "Gestore"
    obiettivo: >
      Il gestore ritrova una serata passata per verificarne incasso,
      scontrino medio e venduto per prodotto, e confronta le serate per
      settimana o per mese, al netto degli sconti.
    parte_da: >
      Esistono chiusure di cassa per più serate di agosto 2026, fra cui
      sabato 15 (aperta alle 19:00, chiusa all'01:08 del 16) e nessuna
      per lunedì 17. Entrato come admin, sul gestionale.
    passi:
      - "Dal menù laterale apre «Cassa» → «Chiusure»: una riga per serata con
        data, apertura → chiusura, durata e incasso; la serata in corso, se
        c'è, ha la pastiglia «in corso» e un trattino al posto dell'incasso."
      - "Nel campo data sceglie il 15 agosto: la lista non si filtra, scorre
        fino alla serata del 15 e la accende; una riga dice dove è
        evidenziata."
      - "Sceglie il 17 agosto: compare «Nessuna chiusura di cassa registrata
        per lunedì 17 agosto» e la lista resta intera."
      - "Sceglie il 16 agosto: la serata chiusa all'01:08 del 16 non risulta,
        perché appartiene al 15."
      - "Tocca la riga del 15: sotto si apre il riepilogo con sconti concessi,
        conti chiusi, contante contato e il rendiconto della serata."
      - "Nel rendiconto guarda i conti con listino, sconto, incassato, costo e
        guadagno, e il cumulativo per prodotto e categoria."
      - "Tocca il gettone «Settimana»: ogni riga è una settimana da lunedì a
        domenica, con numero di serate, incasso totale e media a serata."
      - "Tocca il gettone «Mese» e poi la riga di agosto: si apre sulle serate
        che contiene."
      - "Apre «Cassa» → «Storico ordini» e nel calendario sceglie «ieri»:
        compaiono i conti di quella giornata commerciale, anche quelli battuti
        dopo mezzanotte."
    esito: >
      La serata del 15 si trova nella giornata del 15 anche se chiusa
      all'01:08. I prezzi del rendiconto sono quelli venduti, con lo
      sconto scorporato, non il listino. Le settimane e i mesi sommano
      gli incassi congelati alla chiusura e la media divide solo per le
      serate già chiuse; le settimane senza chiusure non compaiono.
    varianti:
      - quando: "Si raggruppa per settimana e poi si cerca una data"
        allora: "Si apre la settimana che contiene quella serata e la riga si
          accende lì dentro; il raggruppamento scelto resta."
      - quando: "In «Storico ordini» ci sono anche ordini fatti dai clienti dal
          telefono"
        allora: "Compare il filtro su chi ha aperto il conto (il locale o il
          cliente); se non ce ne sono, il filtro non compare."
      - quando: "Si apre «Statistiche» sulla stessa serata"
        allora: "Si leggono incassi, prodotti più venduti e tempi di preparazione e
          consegna misurati."
    si_prova: browser
    bisogni: [UR-005]
    requisiti:
      - REQ-CASSA-001
      - REQ-CASSA-004
      - REQ-CASSA-005
      - REQ-CASSA-006
      - REQ-CASSA-013
      - REQ-CASSA-014
      - REQ-ORD-015
    previsti: []
    test_cases: []

  - id: UC-BANCO-001
    title: "Si batte un conto al banco e si manda la comanda"
    gruppo: "Il conto al banco"
    attore: "Bartender"
    obiettivo: >
      Il bartender batte quello che il cliente ha chiesto e manda la
      comanda a chi prepara, senza mai aspettare la rete, con il totale
      giusto a schermo in ogni momento.
    parte_da: >
      Cassa aperta. Entrato come bartender (Marzia), sulla Coda ordini,
      con la stampante finta impostata sul terminale e la stampa
      automatica delle comande spenta. Il pallino della stampante in
      coda è verde. Nel menù ci sono Negroni (8,00 €) e Spritz Aperol
      (6,00 €).
    passi:
      - "Tocca «Nuovo ordine»: si apre la griglia dei prodotti divisa per
        categoria, con i preferiti e i recenti."
      - "Tocca Negroni due volte: il conto nasce al primo tocco senza cambiare
        schermata. Ogni tocco dalla griglia è una riga a sé, da personalizzare
        e annotare separatamente: due righe Negroni, la tessera segna 2 e il
        tasto dice «Pagamento · 16,00 €»."
      - "Scrive «spri» nella ricerca e tocca Spritz Aperol: la riga si
        aggiunge e la ricerca si svuota da sola."
      - "Tocca la riga Spritz Aperol, in «Nota per questa riga» scrive «senza
        ghiaccio» e tocca «Salva»: la nota compare sotto la riga."
      - "Legge il riepilogo: «Subtotale» 22,00 € e in fondo il totale; il
        tasto dice «Pagamento · 22,00 €». Accanto alle righe c'è il quadratino
        con l'iniziale di chi le ha battute (title «Aggiunto da …»)."
      - "Tocca «Invia comanda»: compare «Comanda inviata al banco»."
      - "Tocca «Torna agli ordini»; nel box «Nome del conto» scrive «Giulia» e
        salva."
    esito: >
      In coda c'è subito la card del conto, con un numero della serata
      mai usato da un altro conto, 22,00 € e «3 prodotti», con
      l'iniziale di chi l'ha aperto. Dalla stampante esce la comanda con
      tutte e tre le righe e la nota «senza ghiaccio». Gli altri
      terminali vedono comparire il conto da soli; questo terminale non
      si avvisa di un ordine che ha battuto lui.
    varianti:
      - quando: "La stampa automatica delle comande è accesa e non si tocca «Invia
          comanda»"
        allora: "Mentre si batte non esce niente; la comanda esce da sola, una e
          completa, quando si esce dalla schermata del conto."
      - quando: "La rete è staccata"
        allora: "Tutto come sopra, nell'istante di ogni tocco: il conto nasce, la
          card compare con il totale giusto, e in alto c'è il nastro «Offline
          — puoi continuare a lavorare»; la sincronizzazione arriva dopo, una
          volta sola."
      - quando: "Si tocca due volte di fila «Pagamento» mentre il conto sta ancora
          nascendo"
        allora: "Nasce un conto solo e la schermata di pagamento resta aperta."
      - quando: "Il pallino della stampante è rosso"
        allora: "Lo si vede in coda prima di battere; toccandolo si legge il motivo.
          La comanda resta comunque a schermo, in coda."
      - quando: "Il cliente chiede una cosa che non è a menù"
        allora: "Dal menù ⋯ del conto, «Prodotto libero»: nome, prezzo e
          ingredienti; la riga si aggiunge al conto con quel prezzo."
      - quando: "La ricerca non trova niente"
        allora: "Lo dice, invece di lasciare la griglia com'era; la ✕ accanto al
          campo lo svuota con un tocco."
      - quando: "Il locale ha scelto «Accendi e porta lì» per la ricerca
          (Impostazioni → Vista ordine)"
        allora: "La griglia non si restringe: scorre fino alla prima card che
          risponde e la accende."
      - quando: "Si batte dal telefono (schermo sotto i 700px)"
        allora: "In pagina restano totale, righe e i tre tasti «Invia», «Paga»,
          «Annulla»; prodotto libero, dati conto, unisci e separa stanno
          dietro i ⋯."
      - quando: "Il conto è da servire al tavolo e il cliente vuole ritirarlo al
          banco (locale con «Ritiro e servizio»)"
        allora: "Da «Dati conto» si cambia il modo: coperto e servizio si azzerano,
          e si legge prima di confermare."
      - quando: "Gli stati del servizio sono accesi e il cliente vuole seguire il
          drink"
        allora: "Dal ⋯ del conto, «Mostra al cliente» apre la pagina da girargli,
          con «📲 Mostra QR al cliente» e «✏️ Modifica» per tornare al conto; a
          stati spenti la voce non c'è."
      - quando: "Il bartender riordina la griglia in «Organizza»"
        allora: "La card presa dalla maniglia segue il dito (col dito si arma
          tenendo premuto) e resta dove la si lascia, uguale su tutti i
          terminali."
      - quando: "La striscia delle card è impostata su «Scorte» e un ingrediente è
          finito"
        allora: "La card del prodotto ha la striscia rossa; un prodotto fuori menù
          resta grigio."
    si_prova: browser-con-finti
    bisogni: [UR-001, UR-002, UR-004, UR-012]
