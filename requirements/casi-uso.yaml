  - id: UC-STAFF-003
    title: "L'admin mette in regola il personale: nuovi account, ruoli, sospensioni"
    gruppo: "Il personale"
    attore: "Admin"
    obiettivo: >
      Il titolare dà accesso a un nuovo collaboratore col ruolo giusto,
      nomina chi si è registrato da sé, e toglie l'accesso a chi non
      lavora più nel locale, senza riga di comando.
    parte_da: >
      Collegato come admin. Esistono un account bartender, un cliente
      registrato dal sito («Marco») e nessun account per la nuova
      cameriera. Si apre «Utenti e ruoli» dal menu laterale: la sezione
      aperta è «Utenze registrate», con «Personale (N)» e «Clienti
      registrati (N)».
    passi:
      - "Sceglie la sezione «Nuovo account»; compila «Nome» (Giulia), «Email»,
        «Password (min 6 caratteri)», sceglie il ruolo «Staff» e legge sotto
        la sua descrizione."
      - "Tocca «Crea account»: il tasto dice «Creo…», poi in «Utenze
        registrate» Giulia compare in «Personale» col ruolo Staff."
      - "In «Clienti registrati» cerca «Marco» nella casella «Cerca per nome o
        email…» e tocca «Ruolo» sulla sua riga."
      - "Nella finestra «Ruolo di Marco» sceglie «Bartender», legge «Il nuovo
        ruolo vale dal suo prossimo accesso.» e tocca «Assegna»: Marco passa
        in «Personale»."
      - "Tocca «Ruolo» sul bartender esistente e sceglie «Admin»: compare la
        conferma «Nominare admin …?» con «Un admin ha accesso completo e può
        cambiare i ruoli di tutti, incluso il tuo.»; tocca «Conferma»."
      - "Sulla riga di Giulia tocca il tasto di sospensione: conferma
        «Sospendere …?» («Non potrà più accedere. L’account e il suo storico
        restano…»). La riga mostra «sospeso»."
      - "Ritocca lo stesso tasto («Riattiva l’accesso») e conferma: «sospeso»
        sparisce."
      - "Sulla riga di un account da togliere tocca «Elimina definitivamente»:
        conferma rossa «Eliminare …?» con «Operazione irreversibile…»; dopo
        «Conferma» la riga non c'è più."
      - "Sulla propria riga, segnata «(tu)», non ci sono i tasti Ruolo,
        sospendi ed elimina."
    esito: >
      Giulia entra col ruolo Staff, Marco col ruolo Bartender al suo
      accesso successivo, il nuovo admin vede le sezioni dell'admin; un
      account sospeso non entra finché non viene riattivato; un account
      eliminato non c'è più; nessuno può cambiare il ruolo a sé stesso.
    varianti:
      - quando: "Giulia prova a entrare mentre è sospesa"
        allora: "L'accesso non riesce; riattivata, entra con le stesse credenziali."
      - quando: "Marco era già collegato su un altro dispositivo quando gli è stato
          cambiato il ruolo"
        allora: "Il gestionale prende il ruolo nuovo da sé, senza aspettare la
          scadenza della sessione (vedi dubbi: con quale ritardo)."
      - quando: "Il piano è Free (un solo utente)"
        allora: "La pagina dice «Nel piano Free l’app la usa solo il titolare. Per
          aggiungere lo staff passa a un piano a pagamento.» con «Vedi i
          piani» (UC-LIC-003)."
      - quando: "La rete è staccata"
        allora: "La creazione non riesce e la pagina mostra «Errore: …» sopra
          l'elenco; l'elenco già caricato resta."
    si_prova: browser
    bisogni: [UR-007]
    requisiti: [REQ-STAFF-003, REQ-STAFF-004, REQ-UI-015]
    previsti: []
    test_cases: []

  - id: UC-STAFF-004
    title: "Sul tablet condiviso si sceglie chi apre la cassa, senza rifare il login"
    gruppo: "Il personale"
    attore: "Admin"
    obiettivo: >
      Il tablet del banco resta collegato con l'account di un solo
      titolare, ma la serata la apre e la firma chi c'è davvero (Flavio
      o Vittorio).
    parte_da: >
      Due account admin attivi (Flavio e Vittorio) più l'account con cui
      il tablet è collegato (Flavio). Cassa chiusa. Collegati come
      Flavio.
    passi:
      - "In «Utenti e ruoli» → «Chi apre la cassa» c'è un blocco per ogni
        admin, «Col login di Flavio …», con le pastiglie degli admin; quella
        di Flavio è segnata «(sempre)» e non si spegne."
      - "Nel blocco di Flavio spegne la pastiglia di un terzo admin (se
        presente) e lascia accesa quella di Vittorio."
      - "Torna alla coda e tocca «Apri cassa»: nella finestra «Apri la cassa»
        compare «Chi apre la cassa?» con Flavio e Vittorio."
      - "Sceglie Vittorio, scrive 50 in «Fondo cassa iniziale (€) — se ce n'è»
        e tocca «Apri cassa»."
      - "In cima alla barra il nome di chi è collegato diventa Vittorio; la
        serata risulta aperta da Vittorio."
      - "Il giorno dopo, chiusa la cassa, riapre la cassa: la scelta proposta
        è già Vittorio."
    esito: >
      La sessione di cassa risulta aperta dalla persona scelta e il suo
      nome sta in barra; l'account collegato non cambia e non serve
      nessuna password.
    varianti:
      - quando: "C'è un solo admin"
        allora: "La domanda «Chi apre la cassa?» non compare; in «Chi apre la cassa»
          si legge «C’è un solo account admin: all’apertura della cassa non
          c’è niente da scegliere…»."
      - quando: "Nel blocco di un account non è spuntato nessuno"
        allora: "All'apertura compaiono tutti gli admin attivi."
      - quando: "Un admin è stato sospeso o declassato"
        allora: "Non compare più fra quelli da scegliere, anche sul tablet che lo
          ricordava."
      - quando: "Al tablet si collega un altro account"
        allora: "La scelta della sera prima non si eredita: si sceglie di nuovo fra
          gli admin associati a quell'account."
      - quando: "La rete è staccata all'apertura della cassa"
        allora: "L'elenco delle persone viene da quello ricordato sul tablet e la
          finestra non aspetta niente (vedi dubbi: primo avvio senza elenco
          ricordato)."
    si_prova: browser
    bisogni: [UR-005, UR-012]
    requisiti: [REQ-STAFF-016]
    previsti: [REQ-STAFF-017, REQ-STAFF-018]
    test_cases: []

  - id: UC-STAFF-005
    title: "Si programmano i turni, si correggono le timbrature e si fissano le paghe orarie"
    gruppo: "Il personale"
    attore: "Admin"
    obiettivo: >
      Il titolare pianifica chi lavora, confronta le ore programmate con
      quelle effettive e ha il costo del personale calcolato con la
      tariffa in vigore quel giorno, senza fogli a parte.
    parte_da: >
      Collegato come admin; due membri dello staff (Giulia e Marco),
      nessuna tariffa. Si apre «Staff» dal menu laterale: sezioni
      «Calendario», «Timbrature», «Nuovo turno», «Paghe orarie».
    passi:
      - "In «Paghe orarie» sceglie Giulia in «Chi», lascia «Da» a oggi, scrive
        6,25 in «€/ora» e tocca «Salva tariffa»: la riga di Giulia dice «oggi
        6,25 €/h»; Marco mostra «— nessuna tariffa»."
      - "In «Nuovo turno» sceglie «Programmato», Giulia in «Chi *», il giorno
        di sabato, «Entrata *» 20:00, «Uscita *» 02:00: il tasto dice
        «Aggiungi · 6 h (oltre mezzanotte)»; lo tocca."
      - "Nel «Calendario» il sabato riporta il turno di Giulia con la
        pastiglia «prog.»."
      - "In «Timbrature» timbra l'entrata di Marco; poi in «Calendario» apre
        la sua voce «in corso» e con «Correggi timbratura» imposta l'«Uscita»
        e tocca «Salva»."
      - "Il giorno mostra le ore effettive accanto a quelle programmate («… h
        / … h prog.»)."
      - "Alza la tariffa di Giulia da una data futura: i turni già lavorati
        restano valorizzati alla tariffa di prima."
    esito: >
      Turni programmati ed effettivi stanno nello stesso calendario, le
      timbrature si correggono a mano, e il costo del personale usa la
      tariffa valida in ogni giorno.
    varianti:
      - quando: "Non ci sono membri dello staff"
        allora: "In «Paghe orarie» si legge «Nessun membro dello staff: aggiungili
          nella scheda “Staff”, poi qui imposti la loro paga.»"
      - quando: "Un bartender apre «Staff» e prova a salvare una tariffa"
        allora: "Da stabilire (vedi dubbi): le paghe sono riservate all'admin nelle
          regole del database, ma la sezione «Paghe orarie» non è nascosta al
          bartender."
      - quando: "Il modulo «Personale e ore» non è incluso nella licenza"
        allora: "La voce «Staff» non c'è nel menu laterale (UC-LIC-001)."
    si_prova: browser
