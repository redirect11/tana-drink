  - id: UC-MAG-008
    title: "Si registra la fattura del fornitore, si paga e si chiude l'ordine"
    gruppo: "Fornitori, ordini e conti del mese"
    attore: "Admin"
    obiettivo: >
      Tenere nello scadenzario il documento vero del fornitore, legato
      all'ordine che paga, verificare che ordinato, ricevuto e fatturato
      tornino, e sapere quanto resta da pagare.
    parte_da: >
      Accesso come admin. L'ordine a Nova è «Consegnato» senza documento
      (Gin Prova 5 pz a 20 €). È disponibile il PDF della fattura n.
      1556, sotto gli 8 MB.
    passi:
      - "In Fornitori apre «Scadenzario»: in testa «Da pagare» col totale e i
        chip «Solo da pagare», «Senza ordine (N)» e «Senza allegato (N)»."
      - "Tocca «+ Nuovo documento»: sceglie Nova in «Fornitore *», scrive 1556
        in «Numero doc.», la data, il tipo e 122,00 in «Importo € *», e tocca
        «Salva»."
      - "Sul documento tocca «Collega a un ordine» e sceglie l'ordine di
        Nova."
      - "Tocca «Allega» e sceglie il PDF: sul documento si leggono nome e peso
        del file, e il conteggio di «Senza allegato» scende di uno."
      - "Tocca «Aggiungi prodotti»: le righe si propongono dall'ordine
        collegato; la casella del carico avverte che la merce è già entrata
        alla consegna. Conferma."
      - "In «Lista ordini», sull'ordine di Nova, il blocco «Ordinato,
        ricevuto, fatturato» mette in colonna Ordinato, Ricevuto, In fattura e
        Differenza, col segno."
      - "I tre elenchi tornano: tocca «Chiudi» e l'ordine diventa «Chiuso»."
      - "Nello scadenzario segna il documento come pagato: il totale «Da
        pagare» scende di 122,00."
      - "Apre la correzione del documento e cambia l'importo in 121,50, poi
        «Salva le correzioni»: il documento tiene righe, allegato e legame con
        l'ordine."
    esito: >
      Il documento 1556 è nello scadenzario, pagato, con l'allegato, le
      righe e il legame con l'ordine di Nova; l'ordine è chiuso; la
      merce è stata caricata una volta sola, alla consegna.
    varianti:
      - quando: "Il documento si fa leggere all'AI: «Leggi con l'AI» con la foto
          o il PDF della fattura"
        allora: "Compare la proposta: fornitore riconosciuto, numero, data,
          importo e righe abbinate ai prodotti, coi punti da verificare e il
          costo della lettura. Si corregge, «Registra il documento» la
          registra con le righe spuntate e il file letto allegato; il carico
          a magazzino resta spento finché non lo si accende."
      - quando: "La fattura arriva senza un ordine: «Aggiungi prodotti» con la
          ricerca, casella «Carica la merce a magazzino» accesa"
        allora: "Il tasto dice «Aggiungi e carica»: la merce entra in giacenza con
          un movimento «Carico da fattura». Spenta la casella il tasto dice
          «Aggiungi senza caricare» e le giacenze non cambiano."
      - quando: "Fra le righe della fattura un prezzo è diverso da quello in
          archivio"
        allora: "Compare «Aggiorna il prezzo: in archivio … → …», spento di
          partenza; acceso aggiorna listino e costo del prodotto, mai il
          prezzo di vendita del menù."
      - quando: "Dalla Lista ordini si usa «Genera dall’ordine»"
        allora: "Nasce un documento coi prezzi dell'ordine, segnato «Generata
          dall’ordine»."
      - quando: "Dalla Lista ordini si usa «Pagato senza documento»"
        allora: "Nasce la riga di scadenzario già pagata, senza carta."
      - quando: "Ordinato, ricevuto e fatturato non tornano"
        allora: "«Chiudi» è spento e dice perché; la differenza di prezzo si legge
          col segno e da lì si allinea il listino."
      - quando: "Il caricamento dell'allegato non riesce"
        allora: "Lo dice, e il documento resta com'era."
