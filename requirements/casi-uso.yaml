  - id: UC-PAG-003
    title: "Si fa uno sconto o si scala un buono VIP"
    gruppo: "I pagamenti"
    attore: "Bartender"
    obiettivo: >
      Il bartender sconta i drink che sta incassando, o li fa pagare col
      credito prepagato di un cliente, con i conti che tornano sullo
      scontrino e in chiusura.
    parte_da: >
      Cassa aperta. In coda c'è un conto con 3 × Birra in Bottiglia
      (5,00 €) e 2 × Negroni (8,00 €): 31,00 €. Esiste un buono VIP
      intestato a Mario con saldo 20,00 €. Strategia di sconto di
      partenza («tetto al totale»).
    passi:
      - "Apre il conto, tocca «Pagamento», poi «Deseleziona tutti» e tocca le
        tre birre: «RIGHE SCELTE (3)», 15,00 €."
      - "Tocca «Sconto», sceglie «%» e batte 10: «Sconto su quello che stai
        riscuotendo: −1,50 €». Tocca «Applica (−1,50 €)»."
      - "Il tasto dice «Riscuotere · 13,50 €». Riscuote in contanti."
      - "Tocca «Seleziona tutti» (i due Negroni, 16,00 €), apre «Sconto»,
        sceglie il buono e in «Buono di» sceglie Mario: «Dal buono: −16,00 €».
        Tocca «Applica»."
      - "Il conto è coperto: tocca «Chiudi conto · 0,00 €»."
    esito: >
      Sul conto ci sono due sconti distinti, ognuno sulle sue righe; lo
      scontrino li elenca uno per uno («Sconto 10% su 3 prodotti −1,50
      €»). Il saldo del buono di Mario scende a 4,00 €. Rendiconto e
      statistiche riportano i prezzi venduti al netto degli sconti, mai
      il listino.
    varianti:
      - quando: "Dopo aver preparato lo sconto si cambiano le righe scelte"
        allora: "Lo sconto si ricalcola sulle righe rimaste; con «Deseleziona tutti»
          resta sospeso e torna a seguire la selezione al primo tocco."
      - quando: "Lo sconto in euro supera quello che si sta riscuotendo"
        allora: "Compare l'avviso che lo sconto supera l'importo e «Riscuotere»
          resta spento finché non lo si corregge."
      - quando: "Il buono ha meno saldo di quanto si vuole scalare"
        allora: "Si scala quello che c'è («saldo/totale insufficiente») e il resto
          si incassa."
      - quando: "Non esistono buoni con saldo"
        allora: "Il tasto del buono è spento con «Nessun buono con saldo»."
      - quando: "Si vuole togliere lo sconto preparato"
        allora: "«Rimuovi sconto» nella finestra dello sconto."
      - quando: "Il conto viene annullato dopo aver usato il buono"
        allora: "Il credito torna a Mario."
    si_prova: browser
