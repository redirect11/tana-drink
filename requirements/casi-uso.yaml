  - id: UC-BANCO-003
    title: "Si aggiunge un giro a un conto aperto, anche da un altro terminale"
    gruppo: "Il conto al banco"
    attore: "Sala, Bartender"
    obiettivo: >
      Chi è al tavolo aggiunge quello che il cliente chiede dopo, o
      corregge un drink sbagliato, sullo stesso conto: senza riaprire
      quello che è già stato servito e lasciando traccia di chi ha
      battuto cosa.
    parte_da: >
      Cassa aperta, stati del servizio accesi (Impostazioni → Gestione
      preparazione → «Segui la preparazione degli ordini»). Marzia al
      banco ha battuto un conto con un Negroni e ha inviato la comanda;
      al banco la comanda è già stata presa in carico e portata a
      «Pronto». Ciro (sala) è entrato dal suo telefono, sulla Coda
      ordini.
    passi:
      - "Ciro tocca la card del conto: entra nella schermata del conto, la
        stessa del banco, con la griglia dei prodotti."
      - "Batte uno Spritz Aperol e tocca «Invia»: compare «Comanda inviata al
        banco»."
      - "Torna alla coda: la card dice 14,00 € e «2 prodotti»; il quadratino
        sulla card resta quello di Marzia, che l'ha aperto."
      - "Riapre il conto: accanto al Negroni c'è l'iniziale di Marzia, accanto
        allo Spritz quella di Ciro, ognuna nel suo colore."
      - "Toglie lo Spritz con il «−»: la riga sparisce e il totale torna a
        8,00 €; il Negroni, già pronto, non si può togliere."
    esito: >
      Lo Spritz è nato in una comanda nuova (comanda 2) e non dentro
      quella già presa in carico: chi ha già il Negroni in mano non si
      vede allungare il ticket. Al banco il conto si è aggiornato da
      solo. Il totale in coda, nel conto e nel pagamento è lo stesso.
    varianti:
      - quando: "La comanda di prima è ancora «Da fare» (nessuno l'ha presa in
          carico)"
        allora: "Lo Spritz entra nella stessa comanda, la comanda si ristampa
          completa, e le sue righe si possono ancora togliere."
      - quando: "Gli stati del servizio sono spenti"
        allora: "Rientrando in modifica, sotto il totale compare «Le righe nuove
          dove vanno?» con «Nella comanda» e «Comanda nuova»; uscendo senza
          scegliere le righe vanno nella comanda."
      - quando: "Il telefono della sala è senza rete"
        allora: "Lo Spritz compare subito sul conto e sulla card, con l'iniziale di
          Ciro; arriva al banco quando la rete torna."
      - quando: "Due persone toccano lo stesso conto quasi insieme"
        allora: "Nessuno dei due gesti cancella l'altro: restano tutte e due le
          righe."
      - quando: "Le righe uguali sono separate, o una riga ha più pezzi"
        allora: "Il tasto sopra la lista dice «Unisci» o «Separa» a seconda di cosa
          si può fare, ed è spento (non sparito) quando non c'è niente da
          fare."
      - quando: "Si tolgono tutte le righe di un conto appena aperto e senza
          incassi"
        allora: "Il conto si annulla da solo e si torna alla coda."
      - quando: "Il telefono di Alex è senza rete"
        allora: "Iniziali, righe e totale si vedono subito; il banco li riceve
          quando la rete torna."
      - quando: "La comanda da correggere è già servita, o è annullata"
        allora: "Il «−» su quelle righe resta spento: quello che è stato servito non
          si toglie."
      - quando: "Alex apre il ⋯ di una comanda"
        allora: "Può ristamparla, ma non trova «Torna a…» né la preparazione
          parziale: tornare indietro di uno stato, dividere e annullare
          restano del banco."
      - quando: "Alex prova ad annullare tutto il conto"
        allora: "Non può: annullare un conto è del banco, e il database lo rifiuta
          anche se lo si tentasse."
    si_prova: browser
