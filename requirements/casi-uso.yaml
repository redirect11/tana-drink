  - id: UC-AVVISI-001
    title: "Il banco sa che è arrivato un ordine, da qualunque terminale o dal telefono di un cliente"
    gruppo: "Gli avvisi fra chi lavora"
    attore: "Bartender, Sala"
    obiettivo: >
      Chi sta al banco con le mani occupate vuole sentire e vedere che è
      entrato un ordine nuovo o un'aggiunta, una volta sola, e chi l'ha
      mandato non vuole l'avviso di quello che ha appena fatto.
    parte_da: >
      Cassa aperta. Marzia al banco sulla coda, avvisi permessi dal
      browser; Ciro (sala) sulla coda dal telefono. In «Il mio profilo»
      → Notifiche, su tutti e due, «Dove compaiono, ad app aperta» è «In
      alto, ovunque».
    passi:
      - "Ciro batte un conto e manda la comanda."
      - "Sul tablet di Marzia compare in alto l'avviso «Nuovo ordine» con
        «Ordine #N ricevuto.» e suona; la campanella mostra una notifica da
        leggere."
      - "Sul telefono di Ciro nessun avviso per quel conto."
      - "Ciro aggiunge una riga allo stesso conto e manda la comanda: al banco
        non arriva un secondo «Nuovo ordine»."
      - "Marzia apre la campanella: la notifica da leggere è lì; la tocca e
        passa fra le lette (con «Storico» la ritrova)."
    esito: >
      Ogni ordine nuovo è stato annunciato una volta a tutti i terminali
      tranne quello da cui è partito, e l'avviso si ritrova nella
      campanella finché non lo si legge.
    varianti:
      - quando: "In profilo è scelto «Dalla campanella, solo in coda»"
        allora: "L'avviso esce come fumetto dalla campanella solo in coda e sparisce
          da sé; toccandolo si aprono gli avvisi. Fuori dalla coda (es. in
          Cassa) non compare niente, ma la campanella conta la notifica."
      - quando: "L'ordine lo manda un cliente dal telefono"
        allora: "L'avviso arriva a tutti i terminali dello staff."
      - quando: "Un conto annullato viene ripristinato da un altro terminale"
        allora: "Arriva «Conto ripristinato»; non torna a essere «Nuovo ordine». Chi
          ha premuto «Ripristina» non lo riceve."
      - quando: "Il tablet del banco ha lo schermo spento o l'app in secondo piano"
        allora: "L'avviso arriva come notifica di sistema, fusa con quella dell'app
          (prova a mano: le push sugli emulatori non si provano)."
      - quando: "Un'aggiunta a un conto già aperto, con il tablet del banco in
          secondo piano"
        allora: "Arriva la notifica di sistema «Aggiunta al conto» con «Nuova
          comanda sull'ordine #N.» (prova a mano)."
      - quando: "Lo stesso account è collegato sul tablet e sul telefono"
        allora: "Suonano tutti e due i dispositivi tranne quello da cui è partito
          l'ordine (prova a mano)."
    si_prova: browser
