  - id: UC-MAG-006
    title: "Si compone un giro d'ordini e lo si manda ai fornitori"
    gruppo: "Fornitori, ordini e conti del mese"
    attore: "Admin"
    obiettivo: >
      Rifornire quello che manca componendo in una sola tabella gli
      ordini per più fornitori, rivederli uno per uno e mandarli, oppure
      tenerli in bozza.
    parte_da: >
      Accesso come admin. Listini compilati: Gin Prova da Nova a 19,50
      €/pz, Birra Bjorne da Font a 25 € al collo da 24. Gin Prova è
      sotto la soglia di avviso, in stato «In linea». Nessun ordine
      aperto, nessun modello salvato.
    passi:
      - "In Fornitori apre «Nuovo ordine»: una tabella sola con Prodotto,
        Disponibilità, Fornitore, €/pz, Pezzi e Totale."
      - "Tocca «Quello che manca»: si spuntano da soli i prodotti esauriti o
        sotto soglia, Gin Prova compreso."
      - "Sulla riga di Gin Prova il fornitore è Nova e il prezzo 19,50 dal
        listino; scrive 6 pezzi: il totale riga è 117,00."
      - "Cerca «Bjorne», sceglie Font, sceglie «Colli» e scrive 2: il totale
        riga è 50,00."
      - "A lato, «Ordine in composizione» riporta pezzi, netto e totale +IVA.
        Tocca «Salva come modello» e lo chiama «Giro della settimana»."
      - "Tocca «Rivedi e conferma»: si apre il «Riepilogo dell’ordine», una
        riga per fornitore."
      - "Apre Nova, controlla la tabella e tocca «Crea l’ordine»: la riga dice
        «Ordinato»."
      - "Su Font tocca «Salva in bozza»: la riga dice «In bozza»."
      - "In Magazzino, Gin Prova ha lo stato «In assortimento»; Birra Bjorne è
        rimasta com'era."
      - "In «Lista ordini» l'ordine di Nova è «Richiesto» e quello di Font è
        «Bozza»; il filtro per stato porta il numero accanto a ogni voce."
    esito: >
      Sono nati due ordini distinti, uno per fornitore, coi prezzi dei
      listini. Solo il prodotto dell'ordine confermato è passato «In
      assortimento», e ricorda lo stato da cui viene. La bozza non tocca
      il magazzino. Il modello «Giro della settimana» ricorda prodotti,
      fornitori e quantità, non i prezzi.
    varianti:
      - quando: "La rete è staccata"
        allora: "«Crea l’ordine», «Salva in bozza» e «Salva come modello» rispondono
          subito, e il prodotto passa in assortimento nello stesso istante; la
          scrittura parte dopo."
      - quando: "In un nuovo giro si sceglie «Giro della settimana» in «— Scegli un
          modello —»"
        allora: "La tabella si precompila coi prodotti e le quantità del modello,
          per fornitore, e coi prezzi attuali dei listini."
      - quando: "Dalla Lista ordini si riprende la bozza di Font e si tocca «Manda
          l’ordine»"
        allora: "L'ordine passa a «Richiesto» e Birra Bjorne va in assortimento."
      - quando: "Nell'ordine c'è un prodotto «Fuori assortimento»"
        allora: "Alla conferma non passa in assortimento."
      - quando: "Si elimina un ordine richiesto"
        allora: "I suoi prodotti tornano allo stato che avevano prima."
      - quando: "Un prodotto non ha prezzo nel listino del fornitore scelto"
        allora: "La riga lo dice («Nessun prezzo di listino») e il prezzo si scrive
          a mano."
      - quando: "Su un ordine della Lista si usa «Invia a …», «Copia il testo» o
          «Rifarlo uguale»"
        allora: "Si apre la mail al fornitore, il testo dell'ordine va negli
          appunti, oppure si riparte da un ordine uguale."
    si_prova: browser
