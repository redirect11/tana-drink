  - id: UC-IMP-004
    title: "Si prepara il terminale per la serata: zoom, schermo intero, menu laterale"
    gruppo: "Le impostazioni"
    attore: "Bartender, Admin, Sala"
    obiettivo: >
      Chi sta ore davanti al tablet del banco o al PC lo regola una
      volta per leggere bene e avere tutto a portata, e trova la
      regolazione uguale il giorno dopo.
    parte_da: >
      Collegato come bartender sul tablet del banco (larghezza da 768px
      in su), dal browser, app non installata; la coda ordini è aperta.
    passi:
      - "Nella coda tocca «Ingrandisci» due volte: la pagina si ingrandisce
        senza deformarsi; «Torna al 100%» la riporta."
      - "Apre «Impostazioni»: i tasti dello zoom non ci sono, ma il livello
        scelto resta."
      - "Tocca il tasto ⛶ («Schermo intero»): le barre del browser spariscono;
        ritoccandolo («Esci da schermo intero») tornano."
      - "In «Impostazioni» apre il menu laterale col ☰: da tablet resta aperto
        come colonna e il contenuto si stringe; tirandone il bordo si allarga.
        Lo chiude col ☰."
      - "In «Magazzino» stringe la barra delle sezioni («Nascondi le
        sezioni»): resta il tasto «Mostra le sezioni» per rimetterla."
      - "Il giorno dopo, riaprendo, menu laterale e barra delle sezioni sono
        come li aveva lasciati."
    esito: >
      Ogni terminale tiene le sue regolazioni; nella barra in alto ci
      sono sempre, a sinistra il ☰ o la freccia indietro, al centro il
      titolo della pagina e della sezione, a destra campanella e azioni.
    varianti:
      - quando: "Lo stesso giro si fa sul telefono"
        allora: "In barra restano ☰, titolo, campanella e ⋮; «Schermo intero» ed
          «Esci» stanno nel menu ⋮; i tasti dello zoom stanno nella testata
          del conto; il menu laterale è sempre a scomparsa."
      - quando: "Lo spazio in barra manca"
        allora: "Spariscono prima il nome del locale, poi l'indietro, poi il logo;
          il titolo si accorcia coi puntini ma resta."
      - quando: "L'app è installata sul telefono"
        allora: "Il tasto ⛶ non compare; l'app installata porta il nome col ruolo di
          chi l'ha installata."
      - quando: "Un pannello è aperto (il foglio dei ⋯, una conferma)"
        allora: "I tasti dello zoom stanno dietro e non si toccano per sbaglio."
