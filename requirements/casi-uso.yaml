  - id: UC-STAMPA-002
    title: "Il locale decide chi stampa le comande della sala, e la sala collega il suo telefono"
    gruppo: "La stampa"
    attore: "Admin, Sala"
    obiettivo: >
      Il gestore vuole che le comande prese ai tavoli escano di sicuro,
      dal telefono di chi le prende o dal banco; chi è in sala vuole
      collegare il suo telefono alla stampante da sé e sapere prima se
      la comanda uscirà.
    parte_da: >
      Flavio (admin) sul tablet del banco, in Impostazioni → Cassa e
      giornata → Stampa automatica. Ciro (sala) è entrato col telefono,
      che non ha ancora nessuna stampante impostata. Stampante finta.
    passi:
      - "Flavio, sotto «Comande prese in sala», lascia «La stampa il telefono»
        e legge che il pallino nella coda dice se funziona."
      - "Ciro, in coda, vede il pallino della stampante bianco; toccandolo
        legge «Qui non c'è nessuna stampante impostata. Impostala dal menu, in
        Stampante.»"
      - "Ciro apre «Stampante» dal menu laterale: vede indirizzo, porta, HTTPS
        e «Test stampa», e la nota che l'indirizzo vale per questo telefono;
        non vede i dati del locale sulla carta."
      - "Scrive l'indirizzo, tocca «Test stampa» (esce la prova) e «Salva»."
      - "Torna in coda: il pallino diventa verde e toccandolo dice «La
        stampante risponde: le comande escono.»"
      - "Ciro prende un ordine con «Ordina dal menù» e lo conferma: la comanda
        esce dal suo telefono."
    esito: >
      Il telefono della sala è collegato senza passare dal gestore, la
      configurazione condivisa del locale è rimasta quella di prima, e
      la comanda presa al tavolo è uscita.
    varianti:
      - quando: "Flavio sceglie «La stampa il banco»"
        allora: "Il telefono di Ciro non stampa; al posto del pallino la sua coda
          dice «Stampa il banco»; la comanda esce dal tablet del banco con la
          coda aperta e la stampa automatica accesa."
      - quando: "«La stampa il banco» ma la stampa automatica della comanda è
          spenta"
        allora: "L'impostazione avverte: «La stampa automatica della comanda è
          spenta: così le comande della sala non le stampa nessuno.»"
      - quando: "«La stampa il banco» con le comande automatiche «Solo dal banco»"
        allora: "L'impostazione avverte che le comande della sala non le stamperebbe
          nessuno."
      - quando: "«Test stampa» non riesce (certificato non accettato, rete diversa)"
        allora: "Sotto il tasto compare il collegamento all'indirizzo della
          stampante da aprire una volta per accettare il certificato, con cosa
          controllare (accesa, stessa rete, SSL)."
    si_prova: browser-con-finti
    bisogni: [UR-004]
