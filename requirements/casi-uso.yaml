  - id: UC-LIC-001
    title: "Il titolare vede cosa comprende la licenza e accende i moduli inclusi"
    gruppo: "Licenza e moduli"
    attore: "Admin"
    obiettivo: >
      Il titolare vuole sapere che piano ha, fino a quando vale e quali
      funzioni ha comprato, e accendere o spegnere quelle incluse;
      quello che il locale non ha non deve comparire da nessuna parte.
    parte_da: >
      Collegato come admin. La licenza del locale (scritta dalla regia,
      o dal seme del test) include «Magazzino e fornitori» e
      «Statistiche e bilancio», non include «Inventario di magazzino»,
      «Fatture ai clienti» né «Menù digitale e tavoli»; valida fino a
      una data futura; stili del menù: nessuno.
    passi:
      - "Apre «Impostazioni» e sceglie il gruppo «Licenza»: nel riquadro
        «Licenza» legge Piano, «Stato: Attiva», «Validità: Valida fino al …»,
        «Moduli premium inclusi: N su M», e il tasto «Gestisci la licenza»."
      - "Sotto, nel riquadro «Funzioni premium», «Magazzino e fornitori» ha
        l'interruttore acceso con «Funzione premium, inclusa in questa
        installazione.»"
      - "«Fatture ai clienti» ha l'interruttore spento e bloccato con
        «Funzione premium: non inclusa.» e il motivo «Funzione premium: fa
        parte della licenza dell’installazione e non si attiva da questa
        schermata.»"
      - "Spegne «Magazzino e fornitori»: la voce «Magazzino» sparisce dal menu
        laterale; la riaccende e torna."
      - "Nel menu laterale non ci sono «Fatture» né «Vista cliente»; scrive a
        mano /bar?tab=fatture e si ritrova sulla coda."
      - "Da un altro dispositivo, senza accesso, apre /menu: compare «Il menù
        digitale non è attivo» con «Questa funzione non fa parte del piano di
        questo locale.»"
    esito: >
      Il riepilogo della licenza è in sola lettura; un modulo lavora
      solo se è incluso e acceso; le voci, le pagine e gli indirizzi dei
      moduli che il locale non ha non si aprono per nessuno.
    varianti:
      - quando: "Un modulo è incluso ma gli manca quello che richiede (l'inventario
          senza il magazzino)"
        allora: "L'interruttore dice quale modulo manca e che «Si attiva quando è
          attivo anche quello.»"
      - quando: "Il modulo è in prova"
        allora: "Accanto si legge «In prova fino al …»."
      - quando: "La licenza è quella scritta nell'installazione (la Tana), senza
          indirizzo della regia"
        allora: "Non c'è il tasto «Gestisci la licenza»; il testo dice che si
          modifica «presso chi gestisce l’installazione»."
      - quando: "La licenza nomina lo stile «Notte»"
        allora: "Il riquadro mostra la riga «Stili del menù» e in «Menù clienti» lo
          stile Notte si può scegliere; senza, non compare e i disegni dei
          drink non si vedono: al loro posto la foto caricata o un bicchiere
          neutro."
      - quando: "Si accede come bartender"
        allora: "Il gruppo «Licenza» mostra solo «Funzioni premium», senza il
          riquadro «Licenza»."
      - quando: "Dalla console del browser si prova a scrivere nel magazzino di un
          locale che non ha il modulo"
        allora: "Il database rifiuta la scrittura; i dati già presenti restano
          leggibili."
