  - id: UC-MAG-004
    title: "Si fa l'inventario del periodo, scaffale per scaffale"
    gruppo: "Il magazzino"
    attore: "Gestore"
    obiettivo: >
      Rilevare le rimanenze vere, leggere il consumo del periodo (DEP +
      ACQ − RIM) e riallineare le giacenze, come sul foglio INV.
    parte_da: >
      Modulo «Inventario» attivo. Nessun inventario aperto. Prodotti in
      più categorie e assortimenti (in linea, premium, fuori
      assortimento). Gin Prova ha 2 pz.
    passi:
      - "In Magazzino sceglie «Inventario» dal titolo nella barra in alto e
        tocca «Apri l’inventario»."
      - "In testa legge «Inventario in corso dal …», i giorni trascorsi e
        quanti prodotti sono contati sul totale; ogni riga mostra DEP, ACQ,
        CONS e RIM."
      - "Torna in Prodotti e carica 1 pz di Gin Prova: rientrando
        nell'inventario, Gin Prova ha ACQ 1 e la RIM registrata è salita a 3."
      - "A sinistra sceglie la categoria «Gin»: restano solo i gin, in ordine
        alfabetico."
      - "Su Gin Prova scrive 2,5 nella casella RIM; su un altro gin tocca ✓
        per confermare la rimanenza registrata."
      - "In «Filtra i prodotti» sceglie «In linea» e «Premium»: gli altri
        spariscono e una nota dice che i prodotti esclusi, senza rimanenza
        inserita, chiuderanno con la giacenza registrata."
      - "Esce dalla pagina e rientra: le rimanenze scritte ci sono ancora."
      - "Tocca «Chiudi l’inventario»: il dialogo «Chiudere l’inventario?» dice
        i prodotti contati, la differenza in euro e il consumo del periodo;
        conferma."
      - "In Prodotti la giacenza di Gin Prova è 2,5 pz."
      - "Apre «Storico inventari»: l'inventario chiuso è in «Inventari chiusi»
        con data di apertura e chiusura; aperto, le RIM sono bloccate e si
        leggono i consumi."
    esito: >
      Per Gin Prova DEP 2, ACQ 1, RIM 2,5, CONS 0,5 pz. Le giacenze dei
      prodotti contati diventano il numero contato; quelli non contati
      tengono la giacenza registrata. Il consumo a settimana è diviso
      per le settimane vere del periodo, e i valori sono a costo con
      l'IVA. L'inventario resta consultabile nello storico.
    varianti:
      - quando: "Durante l'inventario si usa «Contenuto reale» su un prodotto"
        allora: "Cambiano la sua RIM e il suo CONS; il DEP resta quello
          dell'apertura."
      - quando: "Il locale ha la riapertura automatica (Impostazioni → Funzioni
          premium)"
        allora: "Chiuso l'inventario ne parte subito un altro, da oggi; senza, il
          prossimo si apre a mano."
      - quando: "Il modulo Inventario è spento"
        allora: "Le voci «Inventario» e «Storico inventari» non compaiono fra le
          sezioni del magazzino."
      - quando: "Ambiente di test con «Controllo del magazzino (prova)» acceso in
          Impostazioni → Funzioni premium"
        allora: "In Magazzino c'è «Controllo (prova)»: in «Conta» si corregge un
          prodotto alla volta, subito; in «Rapporto» si leggono acquisti,
          venduto, differenza fra contato e risultante e valore a fine
          periodo, su 7, 30 o 90 giorni. In produzione la voce non esiste."
