  - id: UC-PAG-004
    title: "Si chiude un conto impagato e lo si riscuote in un altro giorno"
    gruppo: "I pagamenti"
    attore: "Bartender"
    obiettivo: >
      Il bartender libera il tavolo di un cliente che pagherà dopo,
      senza perdere il credito e senza bloccare la chiusura di cassa, e
      quando il cliente torna incassa quel conto come un altro.
    parte_da: >
      Cassa aperta, stampante finta. In coda c'è un conto aperto con uno
      Spritz Aperol (6,00 €). Entrato come bartender.
    passi:
      - "Apre il conto, tocca «Pagamento · 6,00 €» e, sotto i metodi,
        «Impagato»."
      - "Si apre «Chiudi impagato»: «Il conto si chiude senza incasso: 6,00 €
        restano da riscuotere.»"
      - "In «Note (stampate in grande sullo scontrino)» scrive «paga Mario
        domani» e tocca «Chiudi impagato»."
      - "Si torna alla coda: il conto non è più fra gli aperti; fra i chiusi
        ha la striscia arancione e la pillola «Impagato»."
      - "Il giorno dopo, con la cassa aperta, ritrova il conto in «Cassa» →
        «Storico ordini» (giornata di ieri), lo apre, tocca «Riapri conto» e
        poi «Riapri»."
      - "Tocca «Pagamento · 6,00 €», «Contante», «Riscuotere · 6,00 €»."
    esito: >
      Alla chiusura impagata esce lo scontrino con «Da riscuotere» 6,00
      €, «IMPAGATO» e la nota in grande; le comande risultano servite e
      il magazzino scalato. La chiusura di cassa di quella sera non è
      stata bloccata e ha riportato «1 conto chiuso impagato · 6,00 € da
      riscuotere». Il giorno dopo l'incasso entra nella cassa del giorno
      dopo e il segno di impagato resta come storia.
    varianti:
      - quando: "La cassa è chiusa"
        allora: "«Impagato» è spento, come «Riscuotere»."
      - quando: "La stampa automatica degli scontrini è spenta"
        allora: "Lo scontrino dell'impagato esce lo stesso."
      - quando: "La rete è staccata"
        allora: "Il conto si chiude impagato nell'istante del tocco e la scrittura
          parte dopo."
