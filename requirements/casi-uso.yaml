  - id: UC-MAG-005
    title: "Si compila il listino di un fornitore"
    gruppo: "Fornitori, ordini e conti del mese"
    attore: "Admin"
    obiettivo: >
      Dire da chi si compra cosa e a che prezzo, anche lo stesso
      prodotto da più fornitori e a colli diversi, così che gli ordini
      si compongano coi prezzi giusti.
    parte_da: >
      Accesso come admin. In magazzino ci sono «Gin Prova» e «Birra
      Bjorne»; esiste il fornitore «Nova», senza listino.
    passi:
      - "Dal menu laterale apre «Fornitori»: si apre «Gestione fornitori» con
        l'elenco."
      - "Scrive «Font» in «Nuovo fornitore (es. NOVA)» e tocca «Aggiungi»."
      - "Sulla riga di Nova tocca «Listino»: si apre la scheda del listino,
        con «← Fornitori» in cima."
      - "In «Cerca un prodotto in magazzino» scrive «Gin» e sulla riga di Gin
        Prova tocca «＋»: il prodotto entra in «Prodotti a listino»."
      - "Scrive il prezzo 19,50 e il «Codice del fornitore», poi tocca
        «Salva»."
      - "Torna ai fornitori, apre il listino di Font, associa Birra Bjorne,
        sceglie «Prezzo espresso per» collo, scrive 24 in «Pezzi per collo» e
        25 come prezzo, e salva."
      - "Cerca «Tonica Nuova», che in magazzino non c'è, e tocca «＋ Crea
        «Tonica Nuova» in magazzino»."
      - "In Magazzino → Prodotti c'è Tonica Nuova, segnata come scheda da
        completare."
    esito: >
      Gin Prova ha un prezzo di listino da Nova (19,50 €/pz); Birra
      Bjorne da Font costa 25 € al collo da 24, cioè 1,04 €/pz. Un
      prodotto può stare nel listino di più fornitori. Tonica Nuova è in
      magazzino e nel listino da cui è nata.
    varianti:
      - quando: "Si cambia un prezzo di listino già salvato (19,50 → 21)"
        allora: "Sotto la riga compaiono le «Variazioni di prezzo» con la data e il
          passaggio dal vecchio al nuovo."
      - quando: "Si entra come bartender"
        allora: "La voce «Fornitori» non c'è nel menu laterale, e l'indirizzo della
          sezione battuto a mano riporta alla coda. Un fornitore nuovo si crea
          comunque dalla tendina della scheda prodotto."
