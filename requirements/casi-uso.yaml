  - id: UC-BANCO-007
    title: "Una serata intera con la rete staccata"
    gruppo: "Il conto al banco"
    attore: "Bartender"
    obiettivo: >
      Il bartender continua a battere, mandare comande e incassare
      quando la rete del locale cade, senza attese e senza conti
      sbagliati; quando la rete torna, tutto arriva al server da solo,
      una volta sola.
    parte_da: >
      Cassa aperta con fondo 50,00 €, entrato come bartender da un
      browser appena collegato che non ha mai aperto un conto. Stati del
      servizio spenti. Poi la rete del browser viene staccata.
    passi:
      - "Compare il nastro «Offline — puoi continuare a lavorare, tutto si
        sincronizza al ritorno della connessione»."
      - "Tocca «Nuovo ordine»: la griglia dei prodotti c'è, perché la coda
        l'aveva già caricata."
      - "Batte Negroni, Spritz Aperol e Mojito: il tasto dice «Pagamento ·
        22,00 €»."
      - "Tocca «Invia comanda»: compare «Comanda inviata al banco»."
      - "Torna alla coda: la card c'è già, con 22,00 € e «3 prodotti»."
      - "Riapre il conto, aggiunge un Gin Tonic e invia: «Pagamento · 30,00
        €»; tornato in coda la card dice 30,00 € e «4 prodotti»."
      - "Riapre il conto, tocca «Pagamento», «Contante» e «Riscuotere · 30,00
        €»: il riepilogo dice «0 aperti» e la card non c'è più."
      - "Riattacca la rete: il nastro sparisce; la campanella mostra lo stato
        della sincronizzazione solo finché ha qualcosa da dire."
    esito: >
      Nel database c'è un conto solo, pagato in contanti, con 4 pezzi e
      30,00 € incassati. Ogni gesto si è visto nell'istante in cui è
      stato fatto, mai «quando sincronizza». Gli altri terminali vedono
      lo stesso conto, incassato, una volta sola.
    varianti:
      - quando: "Si ricarica la pagina mentre si è senza rete"
        allora: "L'app si apre lo stesso, col logo, dalla copia locale."
      - quando: "Una scrittura viene rifiutata quando la rete torna"
        allora: "Si riprova da sola fino a tre volte; oltre, la campanella resta
          rossa, dice il motivo a parole e permette di ripetere l'ultima
          modifica o tutte."
      - quando: "Si prova a incassare col lettore SumUp senza rete"
        allora: "SumUp è spento a vedersi; toccandolo dice che senza rete non può
          autorizzare e di registrare come «Carta di Credito»."
      - quando: "Due terminali offline danno lo stesso numero a due conti"
        allora: "Al ritorno della rete il server lo risolve da solo: chi è arrivato
          dopo prende il primo numero libero, e il numero vecchio resta
          scritto sul conto."
      - quando: "Esce una versione nuova dell'app"
        allora: "Con la rete compare la proposta di aggiornare; senza rete non c'è
          nessun falso avviso."
    si_prova: browser
