  - id: UC-BANCO-005
    title: "Si incassa un conto in contanti, col resto"
    gruppo: "Il conto al banco"
    attore: "Bartender"
    obiettivo: >
      Il bartender incassa un conto in contanti, sa quanto resto dare e
      chiude il conto con lo scontrino, senza aspettare la rete.
    parte_da: >
      Cassa aperta. In coda c'è un conto aperto con Negroni, Mojito e
      Spritz Aperol (22,00 €). In Impostazioni → Pagamenti è acceso
      «Calcolo del resto in contanti». Stati del servizio spenti. Stampa
      automatica degli scontrini accesa, stampante finta.
    passi:
      - "Tocca la card del conto: il tasto in fondo dice «Pagamento · 22,00
        €»."
      - "Tocca «Pagamento»: le righe sono già separate una per una e tutte
        selezionate; in alto «PAGAMENTO» 22,00 €, «Ammontare dovuto» 22,00 €."
      - "Tocca «Contante»: compare il riquadro «Il cliente dà» con i tagli
        tondi che coprono l'importo (fra cui 50 €) e il campo «Altro»."
      - "Tocca 50: sotto compare «Resto da dare» 28,00 €."
      - "Tocca «Riscuotere · 22,00 €»."
    esito: >
      Il conto si chiude nell'istante del tocco, si torna alla coda e la
      card non è più fra gli aperti; il riepilogo dice un aperto in
      meno. L'incasso è registrato come contante da 22,00 € con chi l'ha
      incassato ed esce lo scontrino col metodo scritto per esteso. Il
      resto non cambia l'importo incassato.
    varianti:
      - quando: "La rete è staccata"
        allora: "Tutto come sopra, subito; il conto arriva al server pagato, una
          volta sola, quando la rete torna."
      - quando: "Il cliente non vuole lo scontrino e il locale ha acceso «Un tasto
          per incassare senza stampare»"
        allora: "«Riscuoti (senza stampa)» incassa e chiude uguale, e la stampante
          tace; se il conto verrà riaperto e riscosso, lo scontrino uscirà
          normalmente."
      - quando: "Gli stati del servizio sono accesi e i drink non sono ancora
          serviti"
        allora: "«Riscuotere» incassa ma non chiude il conto (lo dice il suo
          titolo); se il locale ha acceso «Un tasto per incassare e servire
          insieme», «Riscuoti e servi · chiude il conto» incassa e chiude in
          un colpo."
      - quando: "Si incassa direttamente dalla card in coda"
        allora: "I tasti «Contanti» e «Carta» chiudono il conto con quel metodo e
          stampano lo scontrino, senza aprire il conto."
      - quando: "Il «Calcolo del resto» è spento e si batte 50 sul tastierino"
        allora: "La schermata dice «Resto: 28,00 € (si incassano 22,00 €)»."
      - quando: "La cassa è chiusa"
        allora: "«Riscuotere» è spento con «Cassa chiusa: per incassare va aperta la
          cassa.»"
      - quando: "Il conto è già stato pagato da un altro terminale"
        allora: "L'incasso viene rifiutato subito, non dopo un'attesa di rete."
      - quando: "Le colonne della schermata di pagamento sono strette per il lavoro
          di questo terminale"
        allora: "Le due maniglie fra le colonne si trascinano e la misura resta su
          questo terminale."
    si_prova: browser-con-finti
