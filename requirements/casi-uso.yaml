  - id: UC-BANCO-002
    title: "Interrotti a metà battuta, il conto si ritrova com'era"
    gruppo: "Il conto al banco"
    attore: "Bartender, Sala"
    obiettivo: >
      Chi batte un conto e viene interrotto (un cliente, il telefono che
      si blocca, la pagina che si ricarica) ritrova le righe dove le
      aveva lasciate, senza ribatterle e senza far nascere un conto
      doppio.
    parte_da: >
      Cassa aperta. Entrato come bartender, sulla Coda ordini.
    passi:
      - "Tocca «Nuovo ordine» e batte Negroni, Mojito e Gin Tonic, senza
        inviare la comanda."
      - "Ricarica la pagina del browser."
      - "L'app riapre lo stesso conto con le tre righe; non c'è un secondo
        conto in coda."
      - "Torna alla coda con «Torna agli ordini» (e «Salva senza nome»): il
        conto è in coda con le tre righe."
      - "Riapre il conto dalla card, aggiunge uno Spritz Aperol, poi esce
        dalla schermata con il menù laterale senza inviare."
      - "Riapre il conto: lo Spritz c'è ancora, insieme alle altre tre righe."
      - "Tocca «Nuovo ordine»: si apre un conto nuovo e vuoto, non quello di
        prima."
    esito: >
      Nessuna riga battuta è andata persa, il conto è uno solo e il
      conto nuovo parte pulito. Inviata la comanda o incassato il conto,
      la bozza è vuota.
    varianti:
      - quando: "Si batte velocissimo nei primi decimi di secondo, mentre il conto
          sta nascendo"
        allora: "Tutte le righe finiscono nello stesso conto."
      - quando: "Le righe non confermate sono state riordinate a mano"
        allora: "Uscendo e rientrando restano nell'ordine scelto."
      - quando: "In cima a una lista si continua a trascinare in giù"
        allora: "La pagina non si ricarica: lo scorrimento si ferma lì."
      - quando: "Lo stesso gesto, in modifica di un conto già esistente"
        allora: "Le righe non confermate si ritrovano rientrando in quel conto."
      - quando: "Si usa «Svuota il conto» dal menù ⋯"
        allora: "Chiede conferma («Svuotare il conto?») e toglie tutte le righe in
          un colpo."
      - quando: "Il conto ricordato ha più di otto ore o è stato chiuso"
        allora: "Dopo il ricaricamento non viene ripreso."
    si_prova: browser
