  - id: UC-MAG-003
    title: "Il magazzino scala quello che il banco prepara, e dice cosa resterà a fine serata"
    gruppo: "Il magazzino"
    attore: "Gestore, Bartender"
    obiettivo: >
      Sapere durante il servizio quanta merce c'è davvero e quanta ne
      resterà a fine serata, con una giacenza che scende per la ricetta
      con cui ogni drink è stato fatto.
    parte_da: >
      Cassa aperta, locale che segue gli stati del servizio
      (Impostazioni → Gestione preparazione). Gin Prova ha 2 pz (1 pz =
      70 cl). In menù c'è «Gin Tonic Prova» con ricetta 4 cl di Gin
      Prova. Nessun conto aperto. Un terminale è sulla coda, un altro in
      Magazzino → Prodotti, vista «A lista».
    passi:
      - "Dalla coda si apre un conto nuovo con un Gin Tonic Prova e lo si
        conferma: la comanda compare in coda come ricevuta."
      - "In Magazzino compare la colonna «A fine serata»: per Gin Prova la
        giacenza è ancora 2 pz, a fine serata 1,94 pz; per i prodotti che
        nessun conto chiede la colonna dice «—»."
      - "In coda il bartender porta la comanda a «In preparazione» e poi a
        «Pronto»."
      - "In Magazzino la giacenza di Gin Prova è 1,94 pz e la card dice «1
        piene · 1 aperta (66 cl)»; la previsione a fine serata resta 1,94 pz:
        il drink non è contato due volte."
      - "Nel Menù, in «Modifica menù», si porta il gin del Gin Tonic Prova a 5
        cl e si salva."
      - "Nella movimentazione di Gin Prova lo scarico già fatto resta di 4
        cl."
      - "Si batte un secondo conto con un Gin Tonic Prova, lo si porta a
        «Pronto»: la giacenza scende di 5 cl. Poi si annulla quel conto: la
        giacenza torna a 1,94 pz."
    esito: >
      Ogni drink portato a «Pronto» scala la ricetta con cui è stato
      fatto, in unità base: 4 cl sono 40 ml, cioè 0,057 pz di una
      bottiglia da 70 cl, mai 4 pezzi. Il cambio di ricetta vale solo
      per i drink fatti dopo. Il conto annullato restituisce esattamente
      quello che aveva scaricato. La colonna «A fine serata» toglie
      dalla giacenza solo quello che i conti aperti chiedono e il
      magazzino non ha ancora scalato.
    varianti:
      - quando: "La rete è staccata sul terminale del banco"
        allora: "Il passaggio a «Pronto» si vede subito in coda e non aspetta il
          magazzino; se lo scarico non va a segno la comanda resta segnata
          come non scaricata e si recupera alla riscossione."
      - quando: "La sala segna la comanda «Servito»"
        allora: "Il magazzino non si muove: lo scarico è già avvenuto a «Pronto», e
          la sala non scrive sulle giacenze."
      - quando: "Una comanda torna da «Pronto» a «In preparazione» e poi di nuovo a
          «Pronto»"
        allora: "Si scala una volta sola."
      - quando: "Gli stati del servizio sono spenti"
        allora: "Lo scarico avviene alla riscossione del conto."
      - quando: "Si modifica un conto già scalato togliendo un drink"
        allora: "Torna in giacenza solo la differenza, con un movimento di
          correzione."
      - quando: "La giacenza scende sotto la soglia, poi a zero"
        allora: "Nel Menù la card del Gin Tonic Prova dice «Ingrediente in
          esaurimento» (striscia arancione), poi «Ingrediente esaurito»
          (rossa); la giacenza può andare sotto zero."
      - quando: "La cassa è chiusa"
        allora: "La colonna «A fine serata» non c'è."
