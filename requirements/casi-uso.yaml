  - id: UC-IMP-003
    title: "Si fissano l'orario della giornata e la stampa automatica di ogni terminale"
    gruppo: "Le impostazioni"
    attore: "Admin"
    obiettivo: >
      Il titolare dice all'app quando lavora il locale e dove finisce
      una serata, e decide quale terminale stampa da sé comande e
      scontrini.
    parte_da: >
      Collegato come admin dal tablet del banco. «Impostazioni» → gruppo
      «Cassa e giornata»: riquadri «Pagamenti», «Stampa automatica»,
      «Giornata di lavoro». Una stampante finta risponde all'indirizzo
      configurato.
    passi:
      - "In «Giornata di lavoro» imposta «Apertura» 19:00, «Chiusura» 03:00 e
        «Cambio di giornata (ora)» 5."
      - "Prova a mettere il cambio di giornata a 23: compare l'avviso «Il
        cambio di giornata cade dentro l’orario di apertura: una serata
        verrebbe divisa su due giornate.»; lo riporta a 5."
      - "In «Stampa automatica» → «Su questo terminale» accende «Stampa la
        comanda all’arrivo dell’ordine» e, sotto «Comande prese», sceglie da
        dove."
      - "Accende «Stampa lo scontrino alla riscossione del conto»."
      - "In «Comande prese in sala» sceglie «La stampa il banco»."
      - "Dal telefono della sala si batte un conto e si manda la comanda: la
        comanda esce dalla stampante del banco una volta sola."
    esito: >
      Le scelte «Su questo terminale» valgono solo per il tablet del
      banco, quelle «Per tutto il locale» per tutti; i conti battuti
      dopo mezzanotte restano nella stessa giornata.
    varianti:
      - quando: "Si sceglie «La stampa il banco» con la stampa automatica della
          comanda spenta"
        allora: "Compare l'avviso «La stampa automatica della comanda è spenta: così
          le comande della sala non le stampa nessuno.»"
      - quando: "La comanda automatica è impostata solo dal banco con «La stampa il
          banco»"
        allora: "Compare l'avviso «La comanda automatica è impostata solo dal banco:
          così le comande della sala non le stampa nessuno.»"
      - quando: "È acceso «Lo scontrino d’acconto a ogni riscossione»"
        allora: "«Un tasto per l’acconto con lo scontrino» resta in pagina, spento,
          col motivo."
      - quando: "Si apre lo stesso gruppo dal telefono della sala"
        allora: "La stampa automatica del telefono è spenta finché non la si accende
          lì."
