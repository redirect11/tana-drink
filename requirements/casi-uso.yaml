  - id: UC-MENU-001
    title: "Si mette in carta un drink nuovo, con la ricetta e il prezzo"
    gruppo: "Il menù"
    attore: "Gestore"
    obiettivo: >
      Creare una voce di menù collegata agli ingredienti di magazzino,
      così che se ne conosca il costo reale, si scelga il prezzo col
      ricarico del locale e ogni vendita scarichi le dosi giuste.
    parte_da: >
      Gestore in Menù → «Modifica menù». In magazzino Gin Prova (20 €/pz
      netti, IVA 22%, 1 pz = 70 cl) e una tonica a pezzi con costo.
      Ricarico impostato in Impostazioni → «Prezzo consigliato». Esiste
      la categoria «Gin Tonic».
    passi:
      - "Tocca «+ Aggiungi prodotto»: si apre «Nuovo prodotto»."
      - "Scrive «Gin Tonic Prova» in «Nome *» e sceglie «Gin Tonic» in
        «Categoria»."
      - "In «Ricetta / ingredienti» tocca «+ Ingrediente», sceglie Gin Prova,
        scrive 4 e sceglie «cl»; aggiunge la tonica, 1 pz."
      - "Compare il riquadro del costo: «Prezzo reale (costo ingredienti)» e
        «Consigliato (×…)»; tocca «Usa prezzo consigliato», poi corregge a 8
        in «Prezzo (€)»: la riga «Con 8,00 € guadagni …» dice il guadagno e il
        moltiplicatore."
      - "Lascia vuota «IVA vendita %» (vale quella del locale), scrive i
