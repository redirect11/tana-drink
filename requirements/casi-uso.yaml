  - id: UC-MAG-009
    title: "Si leggono i conti del mese: altre spese, acquisti e fatturato per macro-categoria"
    gruppo: "Fornitori, ordini e conti del mese"
    attore: "Admin"
    obiettivo: >
      Mettere a confronto, mese per mese e per famiglia di prodotti,
      quello che esce (merce e altre spese) e quello che entra, come nel
      rapporto per macro del foglio.
    parte_da: >
      Accesso come admin. Nel mese ci sono consegne di ordini e vendite
      di Gin Tonic Prova. Nessuna macro-categoria, nessuna altra spesa.
    passi:
      - "In Magazzino sceglie «Macro-categorie», scrive «Distillati» in «Nuova
        macro (es. Distillati)» e tocca «Aggiungi»."
      - "Apre Distillati: a sinistra «Prodotti del magazzino», a destra «Voci
        del menù», in ordine alfabetico, ognuno con la casella della
        percentuale."
      - "Mette Gin Prova e Gin Tonic Prova al 100%; mette un prodotto
        condiviso al 60%, e al 40% in una seconda macro."
      - "In Fornitori apre «Altre spese», tocca «+ Nuova spesa», scrive
        «Sgabelli» in «Articolo *», quantità 4 e prezzo 200, segna «Già
        comprata» con la «Data dell’acquisto» di oggi e salva."
      - "In Fornitori apre «Riepilogo»: per il mese, la merce dalle fatture,
        le altre spese comprate e quanto resta da pagare."
      - "Dal menu laterale apre «Bilancio» → «Acquisti × Fatturato» e sceglie
        «Mese»: per riga le macro, per colonna i periodi; in ogni cella
        Acquisti, Fatturato, Utile e Fat/Acq."
      - "Passa da «Lordo IVA» a «Netto IVA»: i numeri cambiano, la struttura
        no."
      - "Apre «Venduto × Incassato»: per ogni macro incassato, costo del
        venduto, margine e Inc/Costo."
    esito: >
      Distillati raccoglie gli acquisti di Gin Prova (merce entrata
      dalla porta nel mese) e il fatturato di Gin Tonic Prova; il
      prodotto diviso pesa 60% e 40% sulle due macro, e la parte non
      coperta da quote resta «Non attribuito». Gli sgabelli pesano sul
      mese della data d'acquisto nel Riepilogo, non sugli acquisti di
      merce.
    varianti:
      - quando: "Una spesa è ancora da comprare"
        allora: "Non pesa su nessun mese; segnata comprata dalla riga prende la data
          di oggi."
      - quando: "Una spesa è segnata comprata senza prezzo"
        allora: "Porta la scritta «senza prezzo» in ambra."
      - quando: "La rete è staccata"
        allora: "La spesa nuova o corretta compare subito nell'elenco; la scrittura
          parte dopo."
      - quando: "Si entra come bartender"
        allora: "Le voci «Bilancio» e «Fornitori» non ci sono; Magazzino →
          Macro-categorie sì."
      - quando: "Entra un bartender o la sala"
        allora: "La voce «Bilancio» non c'è nel menù laterale."
      - quando: "Le spese del mese non sono state inserite"
        allora: "Il netto del mese non si può ancora calcolare: le spese si
          scriveranno nell'app (previsto)."
