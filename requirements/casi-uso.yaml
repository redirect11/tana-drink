  - id: UC-SALA-002
    title: "La sala porta i drink pronti e li segna serviti"
    gruppo: "La sala"
    attore: "Sala, Bartender"
    obiettivo: >
      Chi gira coi vassoi vuole sapere quali drink sono pronti e per
      quale tavolo, portarli e segnarli serviti, senza poter toccare per
      sbaglio il lavoro di chi prepara.
    parte_da: >
      Cassa aperta, «Segui la preparazione degli ordini» acceso,
      consegna «Solo servizio». In coda c'è il conto #3 del tavolo 5 (un
      Negroni con la nota «senza ghiaccio») in preparazione. Ciro (sala)
      ha il telefono sulla coda; Marzia (bartender) è al banco.
    passi:
      - "Sul telefono di Ciro la comanda in preparazione si vede nella sua
        colonna, ma senza il tasto per farla avanzare."
      - "Marzia, al banco, la porta a «Pronto»."
      - "Sul telefono di Ciro, che ha la coda aperta, compare l'avviso
        «Pronto» con «Ordine #3»; sul tablet di Marzia no, perché il tasto
        l'ha premuto lei."
      - "Ciro apre «Da servire» dal menu laterale: c'è la card #3 col tavolo
        5, il Negroni e la nota «↳ senza ghiaccio»."
      - "Porta il drink e tocca «✓ Servito»: la card sparisce da «Da servire»
        e in coda il conto passa fra i serviti."
    esito: >
      Il drink pronto è stato annunciato a chi lo deve portare, la sala
      l'ha segnato servito, e gli stati della preparazione li ha mossi
      solo il banco.
    varianti:
      - quando: "Non c'è niente da servire"
        allora: "«Da servire» dice «Nessun drink pronto da servire.»"
      - quando: "Il conto è da ritirare al banco (consegna «Ritiro e servizio»,
          conto con «Ritiro al banco»)"
        allora: "Non compare in «Da servire»: in coda sta nella colonna dei drink da
          ritirare, e l'avviso dice «da consegnare» invece di «da servire»."
      - quando: "Ciro segna il servito dalla coda invece che da «Da servire»"
        allora: "La card nella colonna dei pronti ha il tasto per segnarla servita;
          dopo, sui serviti, compare «Incassa»."
      - quando: "Il telefono di Ciro è chiuso o in tasca"
        allora: "L'avviso «Drink pronti da servire» arriva come notifica di sistema
          (prova a mano: le notifiche push sugli emulatori non si provano)."
      - quando: "Marzia ha segnato «Pronto» per sbaglio"
        allora: "Dal dettaglio della comanda la pastiglia «↩︎ Torna a…» la riporta
          indietro, anche di più passi."
      - quando: "Marzia preferisce trascinare"
        allora: "Tenendo premuta la card la sposta in un'altra colonna, anche
          all'indietro o saltando passi; le colonne che non accettano il
          rilascio si vedono sbiadite."
      - quando: "A battere è la sala e prova a far avanzare la comanda"
        allora: "La sala non ha il tasto per «In preparazione» o «Pronto»: può solo
          segnare «Servito»."
      - quando: "Al banco si preparano insieme i drink uguali di più comande"
        allora: "Dal conto → Comande, «Preparazione parziale» su una comanda «Da
          fare»: si scelgono le unità («Preparo questi») e nascono due
          comande, una in preparazione e una ancora da fare, senza perdere
          un'unità."
      - quando: "La comanda della sala deve uscire su carta"
        allora: "Esce una volta sola: dal telefono di chi l'ha presa o dal banco,
          secondo la scelta del locale in Impostazioni → Stampa automatica (si
          prova con la stampante finta)."
      - quando: "Il conto ha più comande e si vogliono rifare su carta"
        allora: "Dalle comande del conto si ristampano separate o tutte insieme in
          una sola."
      - quando: "Il locale fa anche ritiro al banco"
        allora: "La colonna si chiama «Da servire/Ritirare» e col tastino ✂️ si
          divide in «Da servire» e «Da ritirare», solo su quel terminale."
      - quando: "Il tablet è stretto o l'app è molto zoomata"
        allora: "Le corsie si impilano una sotto l'altra invece di stringersi."
      - quando: "Gli stati del servizio sono spenti"
        allora: "La vista a corsie delle comande non esiste: il banco vede la coda
          dei conti come tutti."
      - quando: "La rete del banco è staccata"
        allora: "Gli avanzamenti si vedono subito e partono in sottofondo; la
          comanda della sala arriva quando la rete torna."
