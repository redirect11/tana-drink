  - id: UC-STAT-001
    title: "Si guarda com'è andata una serata"
    gruppo: "Statistiche"
    attore: "Gestore"
    obiettivo: >
      Ritrovare una serata — quella in corso, ieri o sei mesi fa — e
      leggerne incasso, conti, scontrino medio, orari e prodotti, dalla
      chiusura di cassa.
    parte_da: >
      Gestore. Due chiusure di cassa con conti incassati, una con un
      conto aperto alle 22:00 e un secondo giro battuto all'01:00. La
      cassa è aperta adesso con qualche conto. Una voce venduta ha un
      ingrediente senza costo.
    passi:
      - "Dal menu laterale apre «Statistiche»: si apre «Per serata» con la
        lista delle chiusure, la più recente in cima."
      - "La prima riga è la cassa aperta, in corso, coi numeri di adesso; ogni
        riga dice giorno, apertura → chiusura e durata, con incasso, conti e
        scontrino medio incolonnati."
      - "Tocca la serata di ieri: si apre il dettaglio con «Serata del … —
        dall’apertura alla chiusura della cassa, mezzanotte compresa.»"
      - "Legge i riquadri, l'«Incasso per fascia oraria» (il conto delle 22:00
        ha la sua seconda comanda nella fascia dell'01:00), i «Top prodotti
        per incasso», l'«Incasso per categoria» e l'«Utile per categoria»."
      - "Nell'«Utile per categoria» la categoria con l'ingrediente senza costo
        porta l'asterisco e la nota «Costo incompleto»."
      - "Tocca «← Chiusure»: torna la lista."
      - "Tocca «📅 Calendario»: i giorni con servizio sono verdi, gli altri
        grigi, quelli a venire spenti; tocca un giorno verde e si apre
        direttamente quella serata."
      - "Torna alla lista e scrive in «Data» un giorno senza servizio: compare
        «Nessun servizio …»."
    esito: >
      Il dettaglio comprende tutti i conti della finestra di cassa,
      anche dopo mezzanotte. L'incasso della riga è uguale a quello del
      dettaglio, e incasso = conti × scontrino medio. Uscendo da
      Statistiche e rientrando si riparte dalla lista.
    varianti:
      - quando: "Si sceglie un giorno di prima dell'app (vendite importate da
          Tiller)"
        allora: "Il giorno è verde nel calendario e il dettaglio dice «Giornata del
          … battuta su Tiller — dal primo conto all’ultimo.»"
      - quando: "Un conto con più comande ha uno sconto"
        allora: "Nelle fasce orarie lo sconto è diviso in parti uguali fra le
          comande, e la somma torna con l'incasso del conto."
      - quando: "Si entra come sala"
        allora: "La voce «Statistiche» non c'è."
