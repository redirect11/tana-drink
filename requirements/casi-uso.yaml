  - id: UC-SALA-001
    title: "La sala prende l'ordine al tavolo e il conto arriva al banco"
    gruppo: "La sala"
    attore: "Sala, Bartender"
    obiettivo: >
      Chi serve ai tavoli batte l'ordine dal suo telefono, sul posto, e
      vuole che il banco lo veda subito e lo prepari senza bisogno di
      andarlo a dire a voce.
    parte_da: >
      Due terminali. Al banco è entrata Marzia (bartender) col tablet:
      cassa aperta, coda ordini a schermo, nessun conto in coda. In sala
      è entrato Ciro (account sala) col telefono ed è sulla coda ordini:
      nel menu laterale ha solo «Coda ordini», «Da servire» e
      «Stampante». Nel menù ci sono Negroni e Hugo (15,00 € in tutto nel
      listino di prova).
    passi:
      - "Ciro, dalla coda, tocca «Nuovo ordine»: si apre la schermata del
        conto con la griglia dei prodotti."
      - "Tocca Negroni, poi Hugo: le due righe compaiono subito nel conto e il
        tasto «Pagamento» mostra 15,00 €."
      - "Tocca «Invia comanda»: compare «Comanda inviata al banco»."
      - "Tocca «Torna agli ordini» e, alla richiesta del nome, sceglie «Salva
        senza nome»."
      - "Sul telefono di Ciro la card del conto è in coda: 15,00 €, 2
        prodotti."
      - "Sul tablet del banco, senza che Marzia tocchi niente, compare la
        stessa card: 15,00 €, 2 prodotti, col quadratino di chi l'ha aperta
        («Aperto da Ciro — Sala»)."
      - "Al banco arriva l'avviso «Nuovo ordine» con «Ordine #1 ricevuto.»;
        sul telefono di Ciro, che l'ha mandato, nessun avviso."
    esito: >
      Il conto esiste una volta sola, uguale sui due terminali, con
      righe e totale giusti e firmato da chi l'ha aperto. Al banco è
      arrivato come ordine nuovo; chi l'ha battuto non è stato
      disturbato da un avviso su quello che ha appena fatto.
    varianti:
      - quando: "Il telefono di Ciro è senza rete"
        allora: "Righe, totale, «Comanda inviata al banco» e la card in coda si
          vedono subito sul telefono, nell'istante del gesto; il banco vede il
          conto quando la rete torna, una volta sola."
      - quando: "Ciro prende l'ordine dalla carta: menu laterale → «Ordina dal
          menù»"
        allora: "Si apre il menù come lo vede il cliente, con «Inserimento ordine da
          Ciro — Sala» e la ricerca «Cerca nel menù…». Tocca «Aggiungi» su
          Negroni e Hugo, poi «Rivedi ordine»; nel riepilogo scrive il tavolo
          (campo «Tavolo», vuoto vuol dire banco) e il nome, e tocca «Conferma
          ordine». Entra nel conto appena nato; al banco compare la card col
          tavolo."
      - quando: "Con «Ordina dal menù», il locale lascia stampare il telefono («La
          stampa il telefono») e il telefono ha la stampante impostata"
        allora: "La comanda esce dal telefono di Ciro, una volta sola; l'ordine è
          salvato anche se la stampa non parte, e in quel caso lo dice il
          pallino della stampante in coda."
      - quando: "Il locale ha scelto «La stampa il banco»"
        allora: "Il telefono non stampa niente: la comanda esce dal tablet del banco
          che tiene la coda aperta con la stampa automatica accesa."
      - quando: "La cassa è chiusa"
        allora: "Il conto si batte e arriva in coda lo stesso; è l'incasso a restare
          spento finché qualcuno non apre la cassa."
    si_prova: browser-con-finti
