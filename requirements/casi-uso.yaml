  - id: UC-STAFF-001
    title: "Chi lavora entra nel gestionale col proprio account"
    gruppo: "Il personale"
    attore: "Admin, Bartender, Sala"
    obiettivo: >
      Chi arriva in turno entra nell'app col suo account per trovarsi
      davanti gli strumenti del proprio ruolo, e l'app installata sul
      telefono dice di chi è.
    parte_da: >
      Nessuno è collegato sul dispositivo. Esistono tre account del
      personale (un admin, un bartender, uno di sala) e un cliente
      registrato. Si apre l'indirizzo del gestionale (/bar): compare il
      riquadro «Accesso staff».
    passi:
      - "Scrive l'email del bartender e la password nel campo «Password»: i
        caratteri compaiono coperti."
      - "Tocca l'occhio accanto al campo («Mostra la password»): la password
        si legge in chiaro; ritoccandolo («Nascondi la password») torna
        coperta."
      - "Tocca «Entra»: il tasto dice «Accesso…» e poi compare l'attesa
        animata «Ti sto facendo entrare…»."
      - "Si apre la coda ordini; in alto a destra c'è il nome di chi è
        collegato, con l'iniziale nel quadratino."
      - "La linguetta del browser si chiama «La Tana del Coniglio -
        bartender»."
      - "Dal menu laterale (☰) tocca «Esci»: si torna al riquadro «Accesso
        staff»."
      - "Ripete l'accesso con l'account admin: la linguetta dice «La Tana del
        Coniglio - admin»."
    esito: >
      Ogni account entra e si trova nel gestionale col nome del locale
      seguito dal suo ruolo; la password non si vede finché non lo si
      chiede; durante l'attesa una scritta dice che cosa si sta
      aspettando.
    varianti:
      - quando: "La password è sbagliata"
        allora: "Resta il riquadro d'accesso con la scritta «Email o password non
          corretti.»; email e password scritte restano nei campi."
      - quando: "Si entra con l'account di un cliente registrato"
        allora: "Compare «Quest’area è riservata allo staff.» col tasto «Esci e
          accedi come staff»; nessuna voce del gestionale nel menu laterale."
      - quando: "Si tocca «Entra con Google» con un account Google la cui email è
          quella di un account del personale"
        allora: "Si entra con lo stesso account e lo stesso ruolo. Con un account
          Google senza ruolo del personale si legge «Quest’area è riservata
          allo staff.»"
      - quando: "La rete è staccata al momento dell'accesso"
        allora: "Si legge «Errore di rete. Controlla la connessione.» e il modulo
          resta compilato."
      - quando: "Il tablet del banco era già collegato il giorno prima"
        allora: "Riaprendo l'app non si chiede nessuna password: si entra
          direttamente nella coda, anche con la rete staccata."
      - quando: "L'account è stato sospeso dall'admin"
        allora: "L'accesso non riesce e resta il riquadro d'accesso con un messaggio
          d'errore (vedi UC-STAFF-003)."
      - quando: "È il primo accesso del titolare di un locale appena attivato dalla
          regia"
        allora: "Il suo account esiste già, admin e senza password: la imposta dal
          link dell'email e poi entra con «Entra», trovando le sezioni
          dell'admin."
