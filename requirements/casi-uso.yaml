  - id: UC-CLIENTE-001
    title: "Il cliente ordina dal QR del tavolo e segue il suo ordine fino al servizio"
    gruppo: "Il cliente al telefono"
    attore: "Cliente, Bartender"
    obiettivo: >
      Il cliente vuole ordinare dal tavolo senza aspettare nessuno e
      sapere a che punto è il suo drink e quanto manca, senza chiederlo.
    parte_da: >
      Locale con gli ordini dal telefono attivi nella licenza, «Segui la
      preparazione degli ordini» e «Mostra tempo stimato ai clienti»
      accesi, consegna «Solo servizio». Cassa aperta, Marzia al banco
      sulla coda. Il cliente non ha un account e apre sul telefono il
      collegamento del QR del tavolo 12 (/menu?tavolo=12).
    passi:
      - "Si apre il menù col nome del locale in testa e la riga «Tavolo 12»;
        la prima volta compare il benvenuto con i passi dell'ordinazione:
        tocca «Inizia»."
      - "Sotto la testata legge «Tempo di servizio: ~N min»."
      - "Tocca «Aggiungi» su due drink: in fondo compare il carrello con i due
        drink e il totale."
      - "Tocca «Rivedi ordine»: il riepilogo dice «Tavolo 12», la stima e le
        righe; il tasto dice «Inserisci il nome» ed è spento."
      - "Scrive il nome in «Nome/Pseudonimo» e tocca «Conferma ordine»."
      - "Si apre la pagina dell'ordine: «Il tuo numero», il numero grande,
        «Ordine ricevuto», la stima «Ti serviamo in ~N min» e la frase «Non
        devi fare niente: te lo portiamo al tavolo.»"
      - "Al banco compare il conto col tavolo 12 e arriva l'avviso «Nuovo
        ordine»."
      - "Marzia lo porta a «In preparazione» e poi a «Pronto»: la pagina del
        cliente cambia stato da sola, senza ricaricare."
    esito: >
      Il conto del cliente è in coda al banco col suo tavolo e il suo
      nome; il cliente ha seguito ogni passo dalla pagina dell'ordine,
      che si aggiorna da sola, e ritorna sul menù ritrova l'ordine in
      cima («Ordine #N»).
    varianti:
      - quando: "Le ordinazioni sono sospese (solo consultazione)"
        allora: "Il menù si legge ma non c'è «Aggiungi» né carrello; in alto: «Solo
          consultazione: le ordinazioni sono momentaneamente sospese.
          Rivolgersi allo staff per ordinare.»"
      - quando: "Il locale non ha il modulo degli ordini dal telefono"
        allora: "Il menù si legge e basta, con «Il menù si consulta da qui: per
          ordinare rivolgersi allo staff.»"
      - quando: "È accesa «Posizione obbligatoria per ordinare» e il telefono è
          fuori dal raggio"
        allora: "In alto: «Devi essere al locale per ordinare (sei a ~… m, massimo …
          m).» con «Riprova»; non c'è «Aggiungi». Dentro il raggio si ordina
          come sopra, e la posizione si ricontrolla anche toccando «Rivedi
          ordine»."
      - quando: "Il cliente nega il permesso della posizione"
        allora: "«Per ordinare serve la tua posizione…» con «Riprova»: non si
          ordina."
      - quando: "Consegna «Ritiro e servizio» con «Lo sceglie il cliente» acceso"
        allora: "Nel riepilogo sceglie fra «Servito al tavolo» e «Ritiro al banco»;
          scegliendo il ritiro legge che non paga coperto né costo di
          servizio."
      - quando: "Gli stati del servizio sono spenti"
        allora: "La pagina dell'ordine non mostra i passi né la stima e dice «Questa
          pagina resta aggiornata: ritira al banco quando il drink è pronto.»"
      - quando: "Il cliente apre la vetrina sul telefono"
        allora: "Il menù occupa tutta la larghezza; «I miei ordini» e «Accedi»
          stanno su una riga sotto la barra, già al caricamento."
    si_prova: browser
    bisogni: [UR-008]
    requisiti:
      - REQ-CLI-001
      - REQ-CLI-002
      - REQ-CLI-003
      - REQ-CLI-004
