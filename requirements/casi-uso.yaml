  - id: UC-MAG-001
    title: "Si mette in magazzino un prodotto nuovo, con la sua scheda"
    gruppo: "Il magazzino"
    attore: "Gestore"
    obiettivo: >
      Censire un articolo appena entrato nel listino d'acquisto, con
      costo, contenuto del pezzo, giacenza iniziale e scorta minima,
      perché si possa usare nelle ricette e venga scaricato a ogni
      vendita.
    parte_da: >
      Accesso come bartender o admin, modulo «Magazzino e fornitori»
      attivo. In magazzino esiste la categoria «Gin»; non esiste il
      fornitore «Nova». Si è nel gestionale, sulla coda.
    passi:
      - "Dal menu laterale apre «Magazzino»: il titolo nella barra in alto
        dice «Prodotti»."
      - "Sopra la lista legge la legenda: il pallino dice quanta merce c'è
        (verde, giallo in esaurimento, rosso esaurito), la striscia a sinistra
        l'assortimento."
      - "Tocca «+ Nuovo prodotto»: si apre la scheda «Nuovo prodotto»."
      - "Scrive «Gin Prova» in «Nome *» e sceglie «Gin» in «Categoria»."
      - "Nella tendina «Fornitore» sceglie «+ Nuovo fornitore…», scrive «Nova»
        e conferma: la tendina mostra Nova scelto, senza uscire dalla scheda."
      - "In «Stato» lascia «In linea»; in «Costo €/pz (netto)» scrive 20 e
        lascia «IVA acquisto %» a 22: sotto il costo si legge il costo IVA
        compresa, 24,40 € al pezzo."
      - "In «A quanto corrisponde un pezzo? (facoltativo)» scrive 70 e sceglie
        «cl»."
      - "In «Quantità iniziale (pz)» scrive 2 e in «Soglia di avviso (pz)»
        scrive 1, poi tocca «Salva»."
      - "Scrive «Gin Prova» in «Cerca prodotto…»: la riga dice 2 pz, col
        pallino verde."
      - "Apre la card: la riga «Pezzi» dice «2 pz · 2 piene · 1 pz = 70 cl»;
        nella scheda non c'è nessuna casella per escludere il prodotto dallo
        scarico."
    esito: >
      Gin Prova è in Magazzino → Prodotti, contato a pezzi: giacenza 2
      pz, cioè 140 cl (1.400 ml in unità base), costo 20 € netti al
      pezzo, IVA d'acquisto 22%, soglia di avviso 1 pz. Il fornitore
      Nova esiste in Fornitori → Gestione fornitori. A schermo si legge
      sempre «pz», mai «bottiglie». Il prodotto compare fra gli
      ingredienti sceglibili di una ricetta e si dosa in cl o ml.
    varianti:
      - quando: "Il contenuto si scrive come sta sull'etichetta («0,7» e «L»)"
        allora: "Il prodotto risulta identico: 1 pz = 70 cl. Cambia solo come lo si
          digita, non il valore salvato."
      - quando: "L'articolo non si versa né si pesa (per esempio «Tempo di
          lavorazione»)"
        allora: "In «A quanto corrisponde un pezzo?» si sceglie «U»: l'articolo ha
          un costo per unità, entra nel costo delle ricette e si scarica come
          gli altri; non compare negli ingredienti mostrati al cliente."
      - quando: "Il prodotto si compra a peso (kg o g)"
        allora: "La scheda avvisa che la giacenza in pezzi è una stima."
      - quando: "Dalla card si tocca «⧉ Duplica»"
        allora: "Si apre una scheda nuova già compilata con i dati del prodotto di
          partenza; salvandola nasce un prodotto distinto, l'originale non
          cambia."
      - quando: "La giacenza scende sotto la soglia di avviso"
        allora: "Il pallino diventa giallo e il prodotto compare col filtro «In
          esaurimento»; a zero o sotto diventa rosso ed entra fra gli
          «Esauriti»."
