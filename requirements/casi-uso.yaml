    requisiti: [REQ-LIC-012, REQ-LIC-015]
    previsti: [REQ-LIC-011]
    test_cases: []

  - id: UC-LIC-003
    title: "Un locale col piano Free lavora dentro i limiti del piano, e sa perché"
    gruppo: "Licenza e moduli"
    attore: "Admin"
    obiettivo: >
      Il titolare di un locale Free usa l'app per le cose di base e,
      quando incontra un limite, legge quale è e dove si passa a un
      piano a pagamento, senza errori incomprensibili.
    parte_da: >
      Collegato come admin su un locale Free: la licenza ha piano «free»
      e i limiti prodotti_max 10, conti_aperti_max 5, sconti no, storico
      7 giorni, utenti 1, marchio sì, e l'indirizzo della regia. Il menù
      ha già 10 prodotti; cassa aperta; il locale è pubblicato senza
      Functions né Storage.
    passi:
      - "In «Menù» il tasto «+ Aggiungi prodotto» è spento e si legge «Nel
        piano Free il menù ha al massimo 10 prodotti. Per aggiungerne passa a
        un piano a pagamento.» con «Vedi i piani»."
      - "Si aprono cinque conti; al sesto «Nuovo ordine» si legge «Nel piano
        Free puoi avere al massimo 5 conti aperti insieme.»"
      - "Su un conto aperto, nella schermata di pagamento, non c'è il tasto
        dello sconto né SumUp: ci sono «Contante» e «Carta di Credito». Il
        conto si incassa in contanti."
      - "Lo scontrino d'esempio e il menù digitale finiscono con «Creato con
        …» (il nome del prodotto)."
      - "Nello storico ordini e nelle chiusure di cassa compaiono solo gli
        ultimi 7 giorni (più i conti ancora aperti)."
      - "In «Utenti e ruoli» si legge «Nel piano Free l’app la usa solo il
        titolare. Per aggiungere lo staff passa a un piano a pagamento.»"
      - "In «Impostazioni» → «Licenza» il riquadro «Licenza» elenca i «Limiti
        del piano» in chiaro."
    esito: >
      Ogni limite si fa rispettare dove lo si incontra e lo dice con una
      frase piana e il collegamento «Vedi i piani»; quello che c'è già
      (prodotti, conti, uno sconto già sul conto) resta e si modifica.
    varianti:
      - quando: "Sul conto c'era già uno sconto prima del passaggio a Free"
        allora: "Il tasto dello sconto resta visibile, per poterlo togliere."
      - quando: "La licenza del Free scrive anche `comande: false`"
        allora: "La cassa è semplice: niente stati del servizio né coda di
          preparazione, i conti aperti si vedono come elenco da incassare e
          all'incasso tutto risulta servito. In «Impostazioni» → «Servizio»,
          al posto della preparazione, si legge «Nel piano Free la cassa è
          semplice: …» con «Vedi i piani»."
      - quando: "La licenza del Free scrive anche `stampa: false` (dal 12/11/2026)"
        allora: "Dalla stampante non esce niente e non c'è nessun tasto di stampa;
          in «Impostazioni» → «Stampante» si legge «La stampa di comande e
          scontrini è dei piani a pagamento.» con «Vedi i piani». Il conto si
          incassa e la cassa si chiude come sempre."
      - quando: "Si crea un prodotto con la foto"
        allora: "La scheda dice «Le foto dei prodotti sono dei piani a pagamento.» e
          non offre il caricamento."
      - quando: "La licenza non scrive limiti (un piano a pagamento, la Tana)"
        allora: "Nessuno dei limiti vale: menù, conti, sconti, storico e utenti come
          sempre."
      - quando: "La rete è staccata"
        allora: "I limiti valgono lo stesso: si leggono dalla licenza già in
          memoria."
    si_prova: browser
    bisogni: []
