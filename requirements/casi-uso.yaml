  - id: UC-IMP-002
    title: "Si regola come la coda ordini mostra e cerca i conti"
    gruppo: "Le impostazioni"
    attore: "Admin, Bartender"
    obiettivo: >
      Il titolare adatta la coda al modo di lavorare del locale: la
      vista, i conti colorati per riconoscere le comande dello stesso
      tavolo, e cosa fa la ricerca.
    parte_da: >
      Collegato come admin, cassa aperta, tre conti in coda di cui uno
      con due comande in colonne diverse. «Impostazioni» → gruppo
      «Banco: coda e ordine», riquadro «Coda ordini».
    passi:
      - "Sceglie «Corsie di stato»: la coda mostra una colonna per passo del
        lavoro."
      - "In «Il colore del conto» accende «Ogni conto nuovo nasce col suo
        colore»; batte un conto nuovo: la card del conto e le card delle sue
        comande hanno lo stesso colore."
      - "In «La ricerca» sceglie «Accendi il conto e portami lì»; nella coda
        cerca il numero di un conto: la coda resta intera, scorre fino al
        conto e lo segna con un anello."
      - "Tocca un conto qualsiasi: la ricerca si azzera."
      - "Torna in «La ricerca» e sceglie «Filtra la coda»: la stessa ricerca
        lascia in pagina solo il conto che risponde."
    esito: >
      La coda segue le scelte fatte, su tutti i terminali; un conto
      colorato lo resta anche se si cambia la tavolozza.
    varianti:
      - quando: "La ricerca non trova niente"
        allora: "La coda lo dice, invece di restare immobile; se il conto c'è ma sta
          in un'altra scheda, dice anche quello."
      - quando: "I conti automatici colorati sono spenti"
        allora: "Il colore si dà lo stesso a mano dal «⋯ Azioni» della card, anche
          ai conti già aperti."
      - quando: "Gli stati del servizio sono spenti"
        allora: "In «La vista del banco» la scelta «Corsie di stato» è spenta e il
          testo dice perché."
