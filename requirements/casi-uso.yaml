  - id: UC-STAT-002
    title: "Si analizza un periodo: incassi, venduto, utile e magazzino"
    gruppo: "Statistiche"
    attore: "Gestore"
    obiettivo: >
      Capire come è andato un intervallo scelto (un mese, le feste, la
      stessa settimana dell'anno prima): quanto si è incassato, a che
      ore, cosa si è venduto e reso, quanta merce è entrata e uscita.
    parte_da: >
      Gestore. Ordini incassati nel giugno scorso; una giornata di
      giugno con la cassa aperta e chiusa senza conti; movimenti di
      magazzino nel mese.
    passi:
      - "In Statistiche sceglie «Per periodo»: ci sono le scorciatoie «7
        giorni», «10 giorni», «20 giorni», «30 giorni», «60 giorni» e
        «Personalizzato»."
      - "Tocca «30 giorni»: sotto si legge «Dal … al …: N giornate con ordini
        su 30»."
      - "Tocca «Personalizzato», imposta «Inizio» al 1° giugno ore 18:00 e
        «Fine» al 1° luglio ore 04:00, scrivendo o dal calendario accanto, e
        tocca «Applica»."
      - "In «Incasso per giornata» c'è anche la giornata a cassa aperta senza
        conti, a 0 €."
      - "In «Venduto nella fascia oraria» stringe l'ora fra le 22 e l'1: una
        riga per categoria con pezzi e incasso, che si apre sui suoi
        prodotti."
      - "Nella «Classifica del venduto» tocca «Ordina per incasso», poi
        «Ordina per pezzi»: tutte le voci vendute, non solo le prime dieci."
      - "Sotto «Incasso per categoria» legge «Utile per categoria»: Categoria,
        Incassato, Costo del venduto, Utile, con la posizione e il totale."
      - "In «Magazzino nel periodo» tocca «Calcola»: in testa «Comprato nel
        periodo», «Consumato nel periodo» e «Valore di quel che resta»; sotto,
        l'elenco per prodotto."
    esito: >
      Tutti i riquadri lavorano sullo stesso intervallo, in giornate
      commerciali (la notte dopo mezzanotte appartiene alla giornata in
      cui è cominciata). La fascia oraria stringe solo l'ora. Le cifre
      di utile sono al netto degli sconti, con i costi delle ricette
      attuali.
    varianti:
      - quando: "La fine viene prima dell'inizio"
        allora: "Compare «L’ora di fine deve venire dopo quella di inizio.» e il
          periodo non si calcola."
      - quando: "Si scrivono le date senza toccare «Applica»"
        allora: "Compare «Tocca «Applica» per calcolare il periodo scritto.»"
      - quando: "Il periodo comprende giornate di prima dell'app"
        allora: "Le vendite importate da Tiller entrano negli incassi e nel
          venduto."
