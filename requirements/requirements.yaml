  - id: REQ-MENU-012
    title: "In carta due tipi di voce: il prodotto e la ricetta"
    area: "src/components/MenuManager.jsx, src/lib/inventory.js, src/lib/saveDrink.js"
    description: >
      Idea di Daniele (17/08) per semplificare la vita a chi carica il menù.
      Oggi ogni voce di carta è una RICETTA: anche la birra in bottiglia
      vuole la sua riga «1 pz di Birra», che è una scrittura in più per dire
