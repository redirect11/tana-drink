  - id: REQ-ORD-020
    title: "Servizio o ritiro: il locale dice come nascono i conti, lo staff cambia il suo"
    area: "src/lib/consegna.js, src/components/SettingsTab.jsx, src/components/OrderPosDetail.jsx, src/components/OrderSummary.jsx, src/lib/coda.js, src/lib/api.js"
    description: >
      Un conto è servito al tavolo o ritirato al banco. Chi decide, in
      ordine: il LOCALE dice come NASCONO i conti — non quali modi
      esistono; il CLIENTE sceglie il suo, ma solo se glielo si lascia
      scegliere e solo se ordina da sé; lo STAFF può sempre cambiare quello
      che ha in mano. La scelta sta sul CONTO (`order.service_mode`), non
      sul terminale e non sul locale: due conti battuti dallo stesso tablet
      possono essere uno servito e uno da ritirare, ed è tutto il punto.
      Prima l'impostazione era un VINCOLO: finiva sull'ordine alla
      creazione e non c'era nessun posto in cui cambiarla.

      I DUE MONDI (Impostazioni → Consegna ordine): «Solo servizio» (il
      ritiro non esiste) oppure «Ritiro e servizio» (convivono, ed è il
      caso normale di un bar). Non esiste un mondo «solo ritiro»: quel
      vecchio valore non descriveva un locale, descriveva un DEFAULT — un
      posto che fa solo asporto non ha bisogno che l'app gli vieti il
      servizio, ha bisogno che i conti nascano «ritiro». Dentro il secondo
      mondo ci sono «come nascono i conti» (`consegna_default`) e «lo
      sceglie il cliente» (`cliente_sceglie_consegna`), quest'ultima spenta
      col motivo e il rimando quando i clienti non ordinano (menu_only): la
      voce parla di CHI sceglie, e senza ordinazioni non c'è nessuno a cui
      chiederlo. I vecchi valori si leggono ancora senza migrazioni — la
      traduzione sta in lib/consegna.js, in un posto solo.

      SUL CONTO si cambia da «Dati conto», dove ci sono già nome, tavolo e
      note. E CAMBIA I SOLDI: il ritiro azzera coperto e costo di servizio,
      il servizio li rimette coi valori del locale (supplementiPerModo). Tre
      casi (cambioModoPermesso): conto aperto e nessun incasso → si cambia
      e i supplementi si rifanno; conto con un ACCONTO → il modo si cambia
      ma i supplementi NON si toccano, perché erano stati calcolati sul
      totale su cui si è già incassato e muoverlo sotto un acconto è come
      cambiare il prezzo dopo aver preso i soldi (per quello c'è «Riapri
      conto», che lascia traccia); conto chiuso o annullato → non si tocca
      niente. Quello che succede ai soldi si legge PRIMA di premere.

      IN CODA, la colonna del PRONTO tiene due lavori diversi: roba da
      portare a un tavolo e roba che aspetta il cliente al bancone. Di suo
      resta una colonna sola col badge sulla card («Servizio» /
      «Ritiro»); da «▦ Colonne» si divide in «Da servire» e «Da
      ritirare», ed è una scelta del TERMINALE — il tablet della sala e
      quello del banco non guardano lo stesso lavoro. Si propone solo dove
      il ritiro esiste. «Ritirato/Servito» NON si divide: lì il drink è
      già uscito e come sia uscito non cambia più niente da fare — è il
      traguardo, non una destinazione.

      ANCHE LA FRASE DELL'ANNULLO segue il mondo: «Prego recarsi al
      bancone» ha senso solo dove il ritiro esiste, e con «solo servizio»
      manderebbe una persona a un bancone dove nessuno la aspetta. In
      Impostazioni la voce si spegne col motivo e il rimando (non sparisce:
      sparire fa dubitare di averla immaginata) e quella evidenziata è
      quella che si applica DAVVERO (fraseAnnulloDefault), non
      l'impostazione impossibile rimasta scritta. Nel dialogo di annullo,
      dove c'è il cliente davanti, quella frase non si propone affatto.
    status: implemented
    generate_issue: false
    labels: [ordini, pos, impostazioni]
    test_cases:
      - tests/unit/consegna.test.js
      - tests/component/OrderPosDetail.test.jsx
      - tests/component/CodaCorsie.test.jsx

  - id: REQ-ORD-009
    title: "Un ordine battuto altrove si vede su tutti gli altri terminali"
    area: "src/lib/dispositivo.js, src/pages/BartenderPage.jsx, src/lib/notifyStore.js"
    description: >
      Chi manda un ordine — o lo annulla — non ha bisogno di un avviso che
      gli dica quello che ha appena fatto; tutti gli altri terminali sì.
      Vale anche per l'ANNULLAMENTO, che porta con sé il terminale
      (`cancelled_device`): chi annulla lo fa quasi sempre dal conto e non
      dalla coda, quindi «l'ho premuto io» non basterebbe — quella
      schermata è un'altra. Il metro è il
      DISPOSITIVO, non il ruolo: prima si tacevano tutti gli ordini battuti da
      un gestore su qualunque terminale, e chi stava in sala col telefono non
      sapeva mai che al banco era entrato un ordine — lo stesso account sta su
      tablet, telefono e portatile insieme. Ogni ordine porta l'identificativo
      del dispositivo che l'ha creato (un numero a caso per browser, non
      identifica una persona); gli ordini che non ce l'hanno avvisano, perché
      un avviso in più si chiude e uno in meno è un drink che non parte.
      Le notifiche della campanella si dividono in DA LEGGERE e lette: una
      letta sparisce dall'elenco — in mezz'ora di servizio un elenco che non
      si svuota mai diventa un muro di righe vecchie, e non ci si guarda più —
      e resta nello STORICO, che si apre dalla campanella. Aprire la
      campanella non è leggere: si segna leggendo, toccando la notifica,
      oppure con «segna tutte lette», che è una decisione.
      OGNI AVVISO SI PUÒ SPEGNERE, uno per uno: nuovo ordine, ciascuno stato
      della preparazione separatamente, le scorte (in esaurimento ed esaurita,
      solo per chi tiene il gestionale) e la nuova versione dell'app. La scelta
      è PER DISPOSITIVO E PER PERSONA e resta in memoria locale, perché non è
      una regola del bar: al banco «nuovo ordine» è la cosa più importante
      della serata, in sala serve «pronto», e sul portatile nel retro non serve
      niente. Un interruttore unico si spegnerebbe dove dà fastidio lasciando
      senza chi ne aveva bisogno; e due persone che si passano lo stesso tablet
      nei cambi turno non si sovrascrivono a vicenda. Di partenza sono tutti
      accesi: nessuno deve scoprire di essersi perso un ordine perché «era
      spento di default».
    status: implemented
    generate_issue: false
    labels: [ordini, notifiche]
    test_cases: [tests/unit/dispositivo.test.js, tests/unit/notifyStore.test.js, tests/unit/preferenzeNotifiche.test.js]

