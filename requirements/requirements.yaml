      dentro il POS: se l'app si riapre lì — scheda rimasta aperta, accesso
      appena fatto — si torna alla lista ordini, perché il POS riprende da sé
      il conto lasciato in corso e ci si ritroverebbe a battere righe in un
      conto che non si è scelto. Vale una volta sola, all'avvio: dopo, «Nuovo
