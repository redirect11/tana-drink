      quello del fornitore. Dal costo al pezzo discende il costo al cl
      (`costPerCl`, mostrato da `UnitPrice`) come per ogni altro prodotto.
      Nessun lavoro da fare qui: annotato perché la parola detta a voce
      («cartone») non è quella del codice («collo»), e cercandola con
      quella non si trova.
