  - id: REQ-MAG-003
    title: "Le scorte si scalano quando il drink è servito"
    area: "src/lib/inventory.js computeConsumption, src/lib/comande.js, src/lib/api.js"
    description: >
      Il magazzino si scala quando la comanda risulta SERVITA: allora quel
      drink è uscito per certo. Prima si scaricava alla presa in carico, e un
      drink iniziato e poi non fatto — riga tolta, cliente che cambia idea,
      comanda annullata — aveva già portato via gli ingredienti.
      Con gli stati del servizio spenti non esistono comande da servire:
      risultano servite alla riscossione, ed è lì che si scala. Incassare, di
      per sé, non scala niente: seguendo il servizio si paga anche in
      anticipo, con tre drink ancora da fare.
      Fra l'una e l'altra cosa gli ingredienti sono IMPEGNATI e si leggono in
      magazzino (REQ-MAG-014).
      Si scala una volta sola, salvando lo snapshot del consumo sulla
      comanda: serve per stornare in caso di annullo e per non scalare due
      volte. Il magazzino che non risponde non blocca la comanda: resta
      segnata come non scaricata e si recupera dopo.
