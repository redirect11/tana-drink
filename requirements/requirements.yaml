      scarica niente.
      La proposta: due tipi di voce.
      PRODOTTO — è un articolo di magazzino venduto così com'è: si sceglie
      l'articolo, si mette il prezzo di vendita, e basta. Carico e scarico
      seguono le regole di sempre (una birra venduta = una birra scaricata),
      il costo arriva dal costo dell'articolo — al pezzo o al cl, secondo
      come lo si usa — e da lì escono margine e prezzo consigliato senza che
      nessuno scriva una ricetta.
      RICETTA — quello che c'è adesso: più ingredienti con le loro dosi.
      Da decidere: se il tipo è un campo sulla voce di menù o si deduce
      (ricetta con un solo ingrediente in quantità «1 pz» = prodotto); e
      cosa succede a chi oggi ha già scritto le ricette a un ingrediente —
      la conversione dovrebbe essere automatica e senza perdite.
