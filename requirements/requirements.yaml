# requirements/requirements.yaml
#
# COSA FA QUESTA APP, scritto una volta sola.
#
# Serve a tre cose: capire cosa esiste senza leggere trentamila righe di
# codice, accorgersi di cosa manca, e far lavorare su richieste chiare chi
# — persona o agente — apre una pull request.
#
# I requisiti nascono dai TEST. I test in tests/ sono la specifica vera,
# quella che fallisce quando qualcuno la contraddice: dove un requisito è
# `implemented`, i file elencati in `test_cases` lo dimostrano. Dove è
# `todo` o `partial`, il lavoro è ancora da fare — ed è da lì che si
# generano le issue.
#
# Formato:
#   id:             Identificatore stabile (es. REQ-POS-001)
#   title:          Titolo breve
#   area:           File o modulo che lo implementa
#   description:    Cosa deve fare, e possibilmente perché
#   status:         implemented | partial | todo | deprecated
#   generate_issue: true per creare l'issue GitHub (i todo)
#   labels:         Label GitHub
#   test_cases:     Test che lo coprono (file o id)
#
# Per generare le issue da questo file:
#   node scripts/generate-issues.mjs --dry-run     # anteprima
#   GITHUB_TOKEN=<token> node scripts/generate-issues.mjs
#
# Oppure: GitHub → Actions → "Generate Issues from Requirements".
# Le issue sono idempotenti: il titolo porta il [REQ-ID] e chi c'è già
# viene saltato.

requirements:

  # ══════════════════════════════════════════════════════════════════════
  #  ORDINI E COMANDE — il conto resta aperto, le comande vanno al banco
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-ORD-001
    title: "Un conto aperto contiene più comande, ciascuna col suo stato"
    area: "src/lib/comande.js, src/lib/api.js"
    description: >
      Un ordine è un CONTO che resta aperto (aperto/pagato/annullato) e contiene
      una o più comande. La lavorazione (ricevuto, in preparazione, pronto,
      ritirato) vive sulla singola comanda: un tavolo può avere un giro già
      servito e uno ancora al banco. La comanda attiva è quella al passo più
      indietro; a parità di passo vince la più vecchia.
    status: implemented
    generate_issue: false
    labels: [ordini, comande]
    test_cases: [tests/unit/comande.test.js, tests/unit/orderStatus.test.js, tests/unit/orderLines.test.js]

  - id: REQ-ORD-002
    title: "Gli ordini vecchi continuano a funzionare"
    area: "src/lib/comande.js normalizeOrderDoc"
    description: >
      Gli ordini scritti prima del modello a comande hanno solo `items` e uno
      stato di lavorazione sul conto: vengono normalizzati al volo in un conto
      con una comanda sintetica che porta quello stato. Nessuna migrazione dei
      dati, e lo storico resta leggibile e calcolabile come il resto.
    status: implemented
    generate_issue: false
    labels: [ordini, retrocompatibilita]
    test_cases: [tests/unit/comande.test.js]

  - id: REQ-ORD-003
    title: "Aggiungere a un conto non riapre quello che è già stato servito"
    area: "src/lib/comande.js, src/components/OrderPosDetail.jsx"
    description: >
      Gli aumenti confluiscono nella comanda ancora modificabile (ricevuta o in
      preparazione); se non ce n'è, nasce una comanda nuova. Le diminuzioni
      scalano solo da comande modificabili: quello che è già pronto o servito non
      si tocca, perché il drink è stato fatto davvero.
    status: implemented
    generate_issue: false
    labels: [ordini, comande, pos]
    test_cases: [tests/unit/comande.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-004
    title: "Un conto rimasto senza righe si annulla da solo"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Togliendo tutte le righe di un conto appena aperto, il conto viene annullato
      e si torna alla coda: un conto vuoto in lista è solo un ingombro. Non
      succede se qualcosa è già stato incassato — lì il conto esiste davvero e va
      chiuso a mano.
    status: implemented
    generate_issue: false
    labels: [ordini, pos]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-005
    title: "Annullando un conto le scorte tornano a magazzino"
    area: "src/lib/api.js cancelOrder"
    description: >
      L'annullo rimette in magazzino quello che le comande avevano scalato, usando
      lo snapshot di consumo salvato al momento dello scarico e non ricalcolando
      la ricetta, che intanto può essere cambiata. Fa eccezione l'annullo per
      "non ritirato": lì il drink è stato preparato e il prodotto è consumato.
    status: implemented
    generate_issue: false
    labels: [ordini, magazzino]
    test_cases: [tests/unit/warehouse.test.js]

  - id: REQ-ORD-006
    title: "Chiudendo un conto sparisce subito dalla coda"
    area: "src/lib/ordiniNascosti.js, src/components/OrderPosDetail.jsx"
    description: >
      Chiudendo o annullando si torna alla lista ordini, dove quel conto non deve
      più comparire: la scrittura viaggia in sottofondo e la coda avrebbe ancora
      la versione di prima — lo si vedeva lì, e lo si guardava sparire. I conti
      chiusi da questo dispositivo escono subito dalla lista; se la scrittura
      fallisce ricompaiono, e la memoria scade da sé dopo un minuto.
    status: implemented
    generate_issue: false
    labels: [ordini, coda, ux]
    test_cases: [tests/unit/ordiniNascosti.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-007
    title: "La coda distingue aperti e chiusi, e ignora gli annullati"
    area: "src/lib/coda.js"
    description: >
      La coda smista i conti per stato, conta e somma solo i non annullati e sa
      dire quanti conti sono ancora aperti. Con la gestione della preparazione
      attiva un conto pagato ma non servito resta da fare; senza, il pagamento
      chiude e basta — e nella schermata di pagamento non compare l'avviso
      «comande non ancora servite», che senza preparazione non vuol dire niente
      e uscirebbe a ogni incasso.
    status: implemented
    generate_issue: false
    labels: [ordini, coda]
    test_cases: [tests/unit/coda.test.js, tests/component/PaymentScreen.test.jsx]

  - id: REQ-ORD-008
    title: "Un conto chiuso o annullato si può rimettere in corso"
    area: "src/lib/storiaOrdine.js, src/lib/api.js, src/components/StoriaOrdine.jsx"
    description: >
      Capita di chiudere un conto sul tavolo sbagliato, di annullarlo per un
      malinteso, o che il cliente torni e voglia ordinare ancora su quello.
      Chi ha il gestionale può rimetterlo in corso: si conferma in un pannello
      che dice cosa succederà e si può scrivere il perché — FACOLTATIVO, perché
      se fosse obbligatorio si scriverebbe "x" per passare oltre, e al banco i
      secondi non ci sono. Il conto torna aperto e si può battere di nuovo.
      RIAPRIRE = COME SE NON FOSSE MAI STATO PAGATO. Gli incassi si tolgono:
      il conto riaperto è un conto normale, da battere e da incassare, con
      tutte le righe modificabili. Prima gli incassi restavano attaccati e il
      conto tornava «ad acconto»: le righe già pagate erano bloccate — e
      riaprire serve proprio a toccarle — e i soldi restavano nei guadagni
      della serata di un conto che era di nuovo da incassare, quindi a fine
      turno lo stesso conto risultava incassato due volte.
      La cassa legge gli incassi dagli ordini, perciò toglierli dal conto li
      toglie anche dal flusso di cassa. Non si butta via niente: quello che
      era entrato resta in `payments_annullati` con l'ora in cui è stato
      tolto, e il totale compare nella storia del conto («riaperto — tolti
      15,50 € dagli incassi»), che è dove lo si va a cercare quando la cassa
      non torna. Le comande già servite restano servite: tornano da fare solo
      quelle annullate col conto.
      SU UN CONTO RIAPERTO SI TOCCA TUTTO, righe vecchie comprese. Di norma
      una comanda servita non si modifica più — il drink è stato fatto e
      portato — ma riaprire serve ESATTAMENTE a rimettere a posto quello che
      c'è dentro: un giro battuto sul tavolo sbagliato, una birra di troppo.
      Se le righe di prima restano bloccate, il conto riaperto non serve a
      niente. Le scorte si riallineano con la differenza, come per ogni
      altra modifica.
      Il tasto per riaprire NON è un tasto in più: è quello del PAGAMENTO,
      che su un conto chiuso o annullato era lì spento a non fare niente.
      ANNULLANDO, il saldo di un buono usato per pagare torna al
      beneficiario: il conto non si incassa più, e lasciarlo scalato
      significherebbe fargli perdere il credito per un conto mai pagato. Le
      righe restituite si segnano (`restituito_at`), così riaprendo lo
      stesso conto non tornano una seconda volta — sarebbe credito
      inventato, l'errore opposto.
      IL BUONO NON SI PAGA DUE VOLTE. Il saldo di un buono si scala quando
      lo si usa, non quando i soldi entrano in cassa. Se il conto era stato
      PAGATO con un buono, riaprendolo quella riga di incasso sparisce come
      le altre: il saldo torna al beneficiario, altrimenti avrebbe pagato
      due volte — una col buono che non torna, una quando ripaga il conto.
      Il buono usato come SCONTO invece resta dov'è: lo sconto è ancora sul
      conto, quindi qualcuno deve pagarlo, e ri-chiuderlo non lo scala una
      seconda volta.
      Se il conto annullato era stato scontato con un BUONO VIP, riaprendolo il
      saldo si ri-addebita: annullando era tornato al beneficiario, e lasciarlo
      lì significherebbe uno sconto che nessuno ha pagato e un credito in
      circolazione che non torna più con i conti. Se nel frattempo il buono è
      stato speso altrove e il saldo non basta, si addebita quel che c'è e lo
      sconto si riduce a quella cifra (fino a sparire): meglio un conto che
      chiede qualche euro in più che un buono in rosso. Su un conto CHIUSO non
      si tocca niente, perché lì il buono non era mai stato ristornato.
      Il motivo si legge DENTRO il conto riaperto, senza doverlo cercare, e la
      storia completa — aperto, chiuso, annullato, riaperto, con chi e perché —
      sta dietro i ⋯ del conto, sia nella coda sia nel dettaglio. La storia si
      ricostruisce da quello che il conto porta già addosso, quindi vale anche
      per i conti di ieri, senza migrazioni.
    status: implemented
    generate_issue: false
    labels: [ordini, difetto-risolto]
    test_cases: [tests/unit/storiaOrdine.test.js, tests/component/OrderPosDetail.test.jsx, tests/unit/vouchers.test.js, tests/unit/ripristino.test.js]

  - id: REQ-ORD-010
    title: "Gli annullati hanno una tab loro nella coda"
    area: "src/lib/coda.js, src/pages/BartenderPage.jsx"
    description: >
      La coda si filtra con «In corso», «Chiusi», «Annullati» e «Tutti».
      Gli annullati stavano fra i chiusi: facevano numero senza essere
      incassi — «Chiusi» sono i soldi della serata — e per ritrovarne uno
      da riaprire bisognava cercarlo in mezzo a quelli buoni. Un conto
      annullato non è un conto chiuso: è un conto che non c'è più.
      La regola è pura (`passaFiltroCoda`), così il filtro non si sposta
      di significato fra la griglia e i conteggi.
    status: implemented
    generate_issue: false
    labels: [ordini, ux]
    test_cases: [tests/unit/coda.test.js]

  - id: REQ-ORD-009
    title: "Un ordine battuto altrove si vede su tutti gli altri terminali"
    area: "src/lib/dispositivo.js, src/pages/BartenderPage.jsx, src/lib/notifyStore.js"
    description: >
      Chi manda un ordine — o lo annulla — non ha bisogno di un avviso che
      gli dica quello che ha appena fatto; tutti gli altri terminali sì.
      Vale anche per l'ANNULLAMENTO, che porta con sé il terminale
      (`cancelled_device`): chi annulla lo fa quasi sempre dal conto e non
      dalla coda, quindi «l'ho premuto io» non basterebbe — quella
      schermata è un'altra. Il metro è il
      DISPOSITIVO, non il ruolo: prima si tacevano tutti gli ordini battuti da
      un gestore su qualunque terminale, e chi stava in sala col telefono non
      sapeva mai che al banco era entrato un ordine — lo stesso account sta su
      tablet, telefono e portatile insieme. Ogni ordine porta l'identificativo
      del dispositivo che l'ha creato (un numero a caso per browser, non
      identifica una persona); gli ordini che non ce l'hanno avvisano, perché
      un avviso in più si chiude e uno in meno è un drink che non parte.
      Le notifiche della campanella si dividono in DA LEGGERE e lette: una
      letta sparisce dall'elenco — in mezz'ora di servizio un elenco che non
      si svuota mai diventa un muro di righe vecchie, e non ci si guarda più —
      e resta nello STORICO, che si apre dalla campanella. Aprire la
      campanella non è leggere: si segna leggendo, toccando la notifica,
      oppure con «segna tutte lette», che è una decisione.
      OGNI AVVISO SI PUÒ SPEGNERE, uno per uno: nuovo ordine, ciascuno stato
      della preparazione separatamente, le scorte (in esaurimento ed esaurita,
      solo per chi tiene il gestionale) e la nuova versione dell'app. La scelta
      è PER DISPOSITIVO E PER PERSONA e resta in memoria locale, perché non è
      una regola del bar: al banco «nuovo ordine» è la cosa più importante
      della serata, in sala serve «pronto», e sul portatile nel retro non serve
      niente. Un interruttore unico si spegnerebbe dove dà fastidio lasciando
      senza chi ne aveva bisogno; e due persone che si passano lo stesso tablet
      nei cambi turno non si sovrascrivono a vicenda. Di partenza sono tutti
      accesi: nessuno deve scoprire di essersi perso un ordine perché «era
      spento di default».
    status: implemented
    generate_issue: false
    labels: [ordini, notifiche]
    test_cases: [tests/unit/dispositivo.test.js, tests/unit/notifyStore.test.js, tests/unit/preferenzeNotifiche.test.js]

  # ══════════════════════════════════════════════════════════════════════
  #  CASSA / POS — come si batte un ordine
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-POS-001
    title: "L'ordine nasce al primo prodotto, senza cambiare schermata"
    area: "src/components/OrderPosDetail.jsx, src/pages/PosPage.jsx"
    description: >
      Toccando il primo prodotto il conto viene creato in place: niente
      navigazione, niente ricaricamento, la schermata resta quella e da lì si
      continua come in modifica. Il nome del cliente si chiede all'uscita, una
      volta sola.
    status: implemented
    generate_issue: false
    labels: [pos]
    test_cases: [tests/component/PosPage.test.jsx]

  - id: REQ-POS-002
    title: "Niente si perde mentre l'ordine sta nascendo"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      La creazione dura qualche decimo di secondo e in quei decimi al banco si
      continua a battere: le righe aggiunte nel frattempo devono finire nello
      stesso conto, senza sparire e senza far nascere un secondo conto. La bozza
      cambia chiave quando il conto nasce, e le righe rimaste vanno passate alla
      chiave nuova. Nemmeno il PAGAMENTO si perde: premendo Pagamento mentre la
      creazione è ancora in volo, la schermata deve restare aperta anche quando
      il server risponde e il conto smette di essere "nuovo" — prima si chiudeva
      da sola e bisognava ripremere Pagamento, col cliente davanti.
    status: implemented
    generate_issue: false
    labels: [pos, difetto-risolto]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-POS-003
    title: "La bozza non si perde uscendo dalla schermata"
    area: "src/lib/useDraft.js"
    description: >
      Le righe non ancora confermate restano in memoria locale per contesto:
      uscendo e rientrando si riprende da dove si era. Vale anche per l'ordine
      visivo delle righe, riordinabile a mano.
    status: implemented
    generate_issue: false
    labels: [pos, offline]
    test_cases: [tests/unit/useDraft.test.js]

  - id: REQ-POS-004
    title: "Un ricaricamento non fa perdere il conto in corso"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      In creazione il conto nasce senza cambiare pagina: dopo un ricaricamento
      l'app non saprebbe più su quale conto stava lavorando e ne aprirebbe un
      altro, lasciando il primo in coda con dentro la roba già battuta. L'id del
      conto viene ricordato e ripreso al rientro, se è ancora aperto; si dimentica
      uscendo, alla chiusura, o dopo otto ore.
    status: implemented
    generate_issue: false
    labels: [pos, difetto-risolto]
    test_cases: []

  - id: REQ-POS-005
    title: "Le modifiche sono istantanee a schermo, sincronizzate dopo"
    area: "src/components/OrderPosDetail.jsx, src/lib/sync.js"
    description: >
      Aggiunte e diminuzioni compaiono subito e partono in sottofondo: nessuna
      schermata aspetta il server. Se la scrittura fallisce lo dice un avviso, ma
      il lavoro al banco non si ferma mai.
    status: implemented
    generate_issue: false
    labels: [pos, offline]
    test_cases: [tests/component/OrderPosDetail.test.jsx, tests/unit/incassoOffline.test.js, tests/unit/pendingOrders.test.js]

  - id: REQ-POS-006
    title: "Prodotto libero: una voce che non è a menù"
    area: "src/components/CustomDrinkForm.jsx"
    description: >
      Si aggiunge al conto una voce fuori catalogo, con nome, prezzo e ricetta
      incorporata. La ricetta incorporata ha precedenza su quella del catalogo
      quando si scaricano le scorte.
    status: implemented
    generate_issue: false
    labels: [pos, menu]
    test_cases: [tests/component/CustomDrinkForm.test.jsx, tests/unit/inventory.test.js]

  - id: REQ-POS-007
    title: "Sul telefono la pagina è per le righe e la griglia"
    area: "src/components/OrderPosDetail.jsx, src/components/ActionSheet.jsx"
    description: >
      Sotto i 700px in pagina restano totale, righe del conto e i tre gesti della
      serata (Invia, Paga, Annulla); comande, prodotto libero, dati conto, unisci,
      separa e gruppo stanno dietro i tre puntini. Il pannello si apre mostrando
      l'ultima riga battuta e si alza da una maniglia.
    status: implemented
    generate_issue: false
    labels: [pos, telefono, ux]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-POS-019
    title: "La striscia delle card dice quello che serve a chi lavora"
    area: "src/lib/strisce.js, src/components/SettingsTab.jsx"
    description: >
      La striscia a sinistra delle card — griglia del conto e schede del
      menù — si sceglie, perché dipende da come si lavora: chi conosce il
      listino a memoria vuole i colori delle categorie per trovare il
      prodotto al tatto, chi sta finendo le bottiglie vuole vedere subito
      cosa non si può più fare, chi ha già abbastanza colori addosso la
      vuole spenta.
      Quattro modi: SPENTA (grigia, il colore resta nella linguetta),
      PRODOTTO (il suo colore, o quello della categoria se non ne ha uno),
      CATEGORIA (sempre la categoria: il colore del singolo prodotto lo
      dice la linguetta) e SCORTE (rosso ingrediente esaurito, arancione
      in esaurimento, e «ce n'è abbastanza» a scelta fra grigio e verde).
      Un prodotto fuori menu resta GRIGIO anche col verde acceso: è spento,
      non rotto — il rosso qui diceva due cose opposte, «l'ho tolto io» e
      «è finito il rum».
      La scelta è del LOCALE (settings/bar) e vale per tutti i terminali: la
      griglia dev'essere la stessa dovunque, o due persone parlano di due
      schermate diverse. Le due schermate si impostano separatamente.
      Le regole stanno in una funzione pura: la stessa striscia deve
      significare la stessa cosa in tutte le schermate, e con la logica
      dentro le pagine finiva per divergere.
      L'IMPOSTAZIONE È SOLO DELLA STRISCIA. La linguetta nell'angolo in
      alto a sinistra tiene sempre il colore del PRODOTTO — è quella che si
      tocca per cambiarlo — qualunque cosa dica la striscia. I due segni
      condividevano lo stesso valore, e scegliendo «categoria» il colore
      messo a mano spariva dalla vista pur essendo ancora lì.
      Ogni scelta sta DOVE SI LAVORA quella schermata: la griglia del conto
      in Impostazioni → Vista ordine, le schede del catalogo in Menù e
      catalogo — modo della striscia e colore del «ce n'è abbastanza»,
      separati per le due. Non è la stessa domanda: nel conto si batte di
      corsa e una griglia tutta verde è rumore (lì interessano i guai),
      nel catalogo si guarda con calma cosa si può fare e il verde è
      un'informazione.
      Il MENÙ ha tre sottosezioni nel menu laterale — modifica menù,
      categorie, marginalità del listino — invece dei due pannelli a
      scomparsa in cima al catalogo, che si aprivano spingendo giù la
      griglia: chi voleva solo guardare i margini si portava dietro tutto
      il listino sotto.
      Le scorte si leggono SOLO se servono: con gli altri modi ricette e
      giacenze non si caricano nemmeno.
    status: implemented
    generate_issue: false
    labels: [pos, menu, ux]
    test_cases:
      - tests/unit/strisce.test.js
      - tests/component/PosProductPicker.test.jsx

  - id: REQ-POS-013
    title: "In «Organizza» la card segue il dito"
    area: "src/components/PosProductPicker.jsx, src/index.css"
    description: >
      Trascinando una card dalla maniglia, quella in mano segue il dito e le
      altre si spostano per farle posto; lasciandola, resta dove l'hai messa.
      Lo fa una libreria (dnd-kit), non codice nostro: la versione scritta a
      mano — cattura del puntatore, ciclo di auto-scroll, animazioni a mano —
      aveva un difetto dopo l'altro (lo scorrimento che non si fermava, le
      card che si spostavano solo mentre la griglia scorreva, il rilascio
      fuori area). Trascinare col dito è un problema risolto, con dieci casi
      limite che non si vedono finché non capitano al banco; in più arriva
      gratis il riordino da TASTIERA, che non avevamo.
      Quello che resta nostro è la regola: l'ordine è UNO SOLO e globale,
      anche quando a schermo c'è una sola categoria — se no spostare una birra
      dentro «Birre» la lascerebbe al suo posto in «Tutti».
      La maniglia sta SOPRA la card, sul suo bordo destro, e non a fianco:
      affiancata allargava ogni cella di 38px, e la griglia entrando in
      «organizza» cambiava numero di card per riga e misura — si sistemava
      una disposizione diversa da quella che poi si usa davvero. La cella
      occupa esattamente quello che occupa fuori da qui.
      Il contesto di trascinamento sta SEMPRE attorno alla griglia, anche
      fuori da «organizza» (senza gesti attivi e senza niente di
      trascinabile dentro, non fa nulla). Montarlo solo lì spostava la
      griglia in un altro posto dell'albero, e React a quel punto buttava il
      riquadro e ne faceva uno nuovo: il misuratore della larghezza — quello
      che decide quanto sono grandi le card e i loro testi — restava
      attaccato al vecchio, staccato dalla pagina e quindi largo zero, e le
      card tornavano alla misura di partenza coi testi rimpiccioliti.
      Sistemato quello restava comunque un lampo, il tempo di rifare il
      riquadro e rimisurarlo. Il misuratore, per sicurezza, si riaggancia
      comunque al riquadro che c'è (ref-funzione) e prende subito la misura.
      Dentro «organizza» la card riempie la sua casella come fuori: la
      griglia rende tutte le caselle di una riga alte uguali, ma in mezzo
      c'è il guscio che porta il trascinamento — si allungava lui e la card
      restava alta quanto il suo testo, con una riga di card di altezze
      diverse.
      La card in mano NON ESCE DALLA GRIGLIA. Trascinandola verso destra
      finiva oltre il bordo: lì fuori non c'è niente da riordinare, ma il
      riquadro — che scorre — si allargava per contenerla e partiva uno
      scorrimento orizzontale senza fine, da riportare indietro a mano. Il
      movimento si ferma ai bordi del riquadro (un modifier di dnd-kit) e
      la griglia non scorre di lato: va a capo.
      La card in mano è OPACA: il fondo delle card è un velo (--tile-bg,
      bianco al 5%), che appoggiate sulla pagina va bene ma alzandone una
      sopra le altre le faceva vedere attraverso — e non si capiva più
      quale si sta spostando. Sotto ci va il fondo della pagina, così in
      mano ha l'aspetto identico a quando è posata.
      Il minimo delle colonne — «almeno tre card per riga finché ci stanno»
      — lo calcola il CSS con min()/max(), non il JavaScript sulla
      larghezza misurata: la misura arriva sempre qualche fotogramma dopo, e
      trascinando la maniglia di fianco alla griglia per un attimo ci
      stavano due colonne invece di tre, fino a quando non arrivava. Nel
      CSS il conto si rifà insieme al ridimensionamento.
      Sempre per non far ballare la griglia, lo spazio della barra di
      scorrimento è riservato (`scrollbar-gutter: stable`): compariva e
      spariva a seconda di quanti prodotti ha la categoria, e al confine
      fra tre e quattro card per riga la griglia si riassestava da sola
      mentre la si guardava.
    status: implemented
    generate_issue: false
    labels: [pos, ux]
    test_cases: [tests/component/PosProductPicker.test.jsx]

