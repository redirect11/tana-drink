      può scegliere fra due comportamenti, in Impostazioni → Coda ordini. «Filtra
      la coda» lascia in pagina solo i conti che rispondono, come è sempre stato.
      «Accendi e porta lì» non toglie niente: scorre fino al primo conto che
      risponde e lo accende con un anello nel colore d'accento, così si vede
      dov'è rispetto agli altri; toccando un conto qualsiasi la ricerca si
      azzera da sé. La regola di corrispondenza è una sola per tutti e due i
      modi, altrimenti cambiando impostazione lo stesso testo troverebbe conti
      diversi. Se non risponde nessuno lo dice, invece di lasciare la coda
      apparentemente immobile; e se il conto c'è ma sta in un'altra scheda,
      dice anche quello.
    status: implemented
    generate_issue: false
    labels: [ux, coda]
    test_cases: [tests/unit/coda.test.js, tests/component/SettingsTab.test.jsx]

