  - id: REQ-MAG-016
    title: "L'unità è sempre il pezzo: si sceglie solo a cosa corrisponde"
    area: "src/lib/inventory.js, src/components/InventoryManager.jsx"
    description: >
      Da tre note di Flavio (17/08, 21:11-21:14). Il modello delle unità
      regge i distillati e poco altro: in magazzino ci finiscono cose molto
      diverse — il ghiaccio a sacchi, i limoni al chilo, il tempo di lavoro —
      e ognuna oggi chiede una configurazione sua. Parole sue: «bisogna
      trovare una soluzione per unificare tutti questi elementi».
      Il caso che rompe il modello attuale: i LIMONI si comprano al chilo e
      si usano in cl (da 1 kg esce mezzo litro di succo). Oggi non si può
      dire, perché peso e volume sono famiglie separate — e giustamente, non
      esiste una conversione universale fra le due. Ma questa non è una
      conversione: è una RESA, dichiarata dal locale per quel prodotto.
      PROPOSTA da approvare con lui: ogni prodotto risponde sempre alle
      stesse due domande — «come lo compri» (l'unità in cui conti la merce e
      in cui c'è il prezzo) e «come lo usi in ricetta» — più una terza che
      compare SOLO se sono diverse: «una unità di acquisto quanto rende?».
      Una riga sola, letta come si parla: 1 bottiglia = 70 cl, 1 kg di limoni
      = 50 cl, 1 sacco = 5000 g, 1 confezione = 10 U. Niente sotto-unità,
      niente divisioni, e le famiglie non c'entrano più: la resa la dichiara
      chi compra.
      DECISO da Flavio (17/08): la giacenza si conta in QUELLO CHE SI
      COMPRA — i chili di limoni, i sacchi di ghiaccio, le bottiglie —
      perché l'inventario si fa contando quello che c'è sullo scaffale, non
      il succo che ne uscirà. Le ricette dosano nell'unità d'uso e scalano
      la loro frazione, come già fanno i cl di gin su una bottiglia.
      Il modello è quindi completo e si può scrivere: unità d'acquisto
      (giacenza e prezzo), unità d'uso (ricette), resa fra le due quando
      sono diverse. Con questo, BUG-014 si chiude da sé.
      FATTO (1.4.8). `resaUso` (lib/inventory.js) risponde a «una unità base
      d'acquisto quante unità base d'uso rende?», e da lì passano tutti e
      tre i conti che contano: lo scarico dal magazzino (qtyInStockUnit), il
      costo di quello che si versa (costPerUnit) e le unità che si possono
      scrivere in ricetta (entryUnits). La resa vive su due campi nuovi
      (`resa`, `resa_unit`) validi per qualunque articolo; per i PEZZI resta
      buono quello che c'era — `content_unit` + `package_size` — quindi i
      prodotti già in magazzino non si toccano e si comportano come prima.
      La scheda prodotto è rifatta sulle tre domande, col «?» in alto che le
      spiega. La terza — «Quanto rende», o «A quanto corrisponde un pezzo?»
      per chi si conta a pezzi — è sempre a vista ed è FACOLTATIVA: vuota
      vuol dire «si usa come si compra». Era dietro un interruttore, ma
      nasconderla costringeva a cercarla anche a chi la voleva scrivere —
      una birra, per sapere quanto costa al cl.
      Sparisce anche la domanda «quanto contiene una confezione» per chi non
      conta a pezzi: comprando a chili, una confezione È un chilo. Il prezzo
      si scrive nell'unità d'acquisto (€/kg, €/cl, €/pz, €/U) e sotto resta
      salvato il costo per confezione, che è quello che il resto dell'app
      legge da sempre; i prodotti già caricati tengono il loro contenuto e i
      loro numeri, perché riscriverli vorrebbe dire cambiare i conti di un
      articolo che nessuno ha toccato.
      «A QUANTO CORRISPONDE UN PEZZO» È IL CONTENUTO, non la dose del drink:
      quella la decide la ricetta, drink per drink, e chi confonde le due
      cose scrive lì i centilitri di un cocktail e scarica il magazzino con
      numeri che non tornano. Si può lasciare VUOTO — e allora in ricetta si
      dosa solo a pezzi, che è il caso della birra servita intera — oppure
      scriverlo, e allora la ricetta sceglie fra il pezzo e l'unità del
      contenuto (4 cl da una bottiglia da 100 cl scalano 0,04 pezzi). Lo
      dicono una didascalia sotto al campo e un «?» accanto alla domanda.
      E la SOGLIA DI AVVISO si scrive sempre nell'unità d'acquisto — è il
      prodotto comprato che sta finendo, ed è quello che si va a
      ricomprare: niente più tendina, e l'etichetta dice l'unità.
      E «SI SCARICA DAL MAGAZZINO?» LO DECIDE IL PRODOTTO, non la sua unità
      (`eScorta`). La regola stava sull'unità — quello che si conta a unità
      generiche non si scarica — ed è giusta per la manodopera, che non sta
      su nessuno scaffale, ma non per il GHIACCIO: si conta a unità e finisce
      eccome. Il consumo ora conta tutto quello che la ricetta chiede, e a
      decidere cosa togliere dalla giacenza è chi la scrive, che l'articolo
      ce l'ha in mano — scarico, riallineo di una comanda modificata,
      reintegro all'annullo e previsione «a fine serata». Nella scheda, per i
      soli articoli a unità, c'è la casella «È una scorta: si scarica quando
      si usa»; di suo è spenta, così la manodopera già a listino non cambia
      comportamento. Senza resa dichiarata non si inventa niente: costo
      null e consumo invariato, che è meglio di un numero uscito da una
      moltiplicazione a caso.
      RIVISTA (1.4.8, secondo giro, approvato): la scheda parte da UNA
      domanda — «che tipo di prodotto è?» — con quattro card illustrate in
      griglia 2×2. «Lo vendo intero» (bottiglie e lattine: pezzi, contenuto
      facoltativo che serve solo al costo al cl di confronto), «Lo verso
      nei drink» (pezzi, e «una bottiglia fa…» è OBBLIGATORIO: senza,
      niente costo al cl né scarico frazionato, e il salvataggio si ferma
      spiegandolo), «Sfuso, a peso o volume» (limoni al chilo, spina,
      ghiaccio: unità d'acquisto a scelta fra kg/l/cl/g/U, resa facoltativa
      «5 kg fanno 1,5 l» con la quantità sui due lati), «Lavoro o servizio»
      (solo costo per unità: niente giacenza, mai esaurito, in carta non
      compare). Il tipo decide unità e scorta: spariscono il selettore
      «Unità d'acquisto» a famiglie, la casella «È una scorta» e ogni «lo
      uso come lo compro». Il MODELLO DATI NON CAMBIA: si aggiunge solo un
      campo `tipo` sull'item per le prossime aperture; le schede vecchie,
      che non ce l'hanno, si riaprono nel tipo dedotto da unità, contenuto
      e scorta (U non-scorta → lavoro, U con scorta → sfuso, pezzo con
      contenuto → versato, pezzo senza → intero, il resto → sfuso), senza
      migrazione. Cambiando tipo su un prodotto esistente valgono gli
      avvisi di conversione della giacenza di sempre.
      RIPENSATO (18/08, tre vocali di Flavio uno via l'altro — 14:53, 15:17,
      15:22 — vince l'ultimo, che è la sintesi e decide). Prima idea (14:53):
      «l'unità di misura sono i pezzi, poi dopo i pezzi vengono divisi in
      cl, grammi e unità di misura non definita» — non più la resa fra
      unità d'acquisto e unità d'uso di sopra: sempre e solo PEZZO,
      frazionato da una seconda unità.
      Guardando l'app (15:17), Flavio boccia la domanda RIVISTA qui sopra
      («che tipo di prodotto è?», le quattro card): «questa cosa non è
      male, però secondo me non è molto corretta per un gestionale, cioè va
      un po' troppo nello specifico». Lo stesso articolo si vende in più
      modi — il Jägermeister va nel Jägerbombo E si vende a cicchetto da
      solo, mai la bottiglia intera — e una card sola per prodotto non lo
      permette. Segnala anche diciture da rivedere: «una bottiglia fa»
      (100 cl) «non credo sia molto italiana» — la scheda va riletta con
      questo in mente, non solo quella frase.
      DECISO (15:22, l'ultima parola: qui non è più una proposta da
      confermare). «L'unità di misura iniziale deve scomparire, perché non
      è più selezionabile, in automatico è il pezzo» — FISSO E BLOCCATO, non
      un campo `tipo` né una scelta fra famiglie. Il campo `tipo` previsto
      nella revisione qui sopra NON si aggiunge più, e con lui cadono il
      selettore a quattro card e ogni distinzione fra «lo vendo intero / lo
      verso nel drink / sfuso / lavoro». La SOLA domanda che il modulo fa è
      «a quanto corrisponde un pezzo», con tre risposte possibili: unità di
      CAPACITÀ (l, cl, ml), di PESO (kg, g), o «U» non definita — mai una
      quarta a piacere: «potremmo caricare tantissime cose con tantissime
      unità di misura che non sappiamo, e non ce le possiamo mettere a
      creare ogni volta» — la U resta volutamente generica, il significato
      sta in testa a chi la usa («lo so io che sono minuti, ma non fa
      niente»). NESSUN REQUISITO deve prevedere unità di misura
      personalizzabili dall'utente.
      CHI DECIDE, TOLTA LA DOMANDA: nessuno dichiara più come si vende un
      prodotto — la domanda «lo vendo intero / sfuso a peso o volume /
      lavoro a servizio» sparisce e NON SI SOSTITUISCE con un'altra: quello
      che decideva lei lo decide adesso la RICETTA. Sue parole: «bisogna
      fare i conti rispetto all'utilizzo che viene fatto della merce.
      Quando la merce viene usata in una ricetta, allora la scarichiamo
      dell'unità di misura che può essere una qualsiasi che sia
      convertibile dall'unità di misura del prodotto». La quantità di un
      ingrediente in ricetta si scrive a PEZZI — sempre disponibile, perché
      è la base — o nell'unità in cui si frazionava (cl, g, U). A rendere
      possibile il passaggio è proprio «a quanto corrisponde un pezzo»
      (1 pz = 25 cl, per dire): con quel dato, quello che la ricetta chiede
      in cl si converte in pezzi per la giacenza. LA GIACENZA NON CAMBIA MAI
      UNITÀ — resta sempre in pezzi — a convertirsi è solo quello che la
      ricetta chiede.
      CASO LIMITE (deduzione di chi scrive questo requisito, non parola sua
      — DA CONFERMARE): un prodotto senza corrispondenza impostata (nessun
      «1 pz = …») si può usare SOLO A PEZZI, perché non c'è niente con cui
      convertire; l'app deve dirlo — proponendo solo i pezzi in ricetta, o
      chiedendo di compilare la corrispondenza — invece di lasciare
      scrivere «40 ml» di una cosa di cui non si sa quanto contiene un
      pezzo, che è il modo più veloce per scaricare numeri a caso. E la «U»
      non si converte con nulla: un prodotto in unità non definite si usa
      in pezzi o in U, e va bene così — non è un buco, è la natura di
      quell'unità.
      La scelta pezzo-o-frazione non è solo del CARICO, come diceva il
      primo vocale: vale per QUALUNQUE movimento — «se farmo un carico, uno
      scarico, qualsiasi cosa esso sia di movimentazione» — chiedendo ogni
      volta se muovere a pezzi o nell'unità che compone il pezzo. Casi-prova
      citati a voce: un distillato codificato «1 pezzo = X cl» chiede se
      caricare a pezzi o a centilitri; il ghiaccio codificato «1 pezzo = X
      grammi» chiede pezzi o grammi (il numero detto a voce, «8 grammi», è
      il peso di UN CUBETTO, non di una confezione — vedi sotto); il tempo
      di lavorazione, pezzi o «U» (minuti, nella testa di chi lo carica).
      I TRE LIVELLI, e risolvono anche lo SFUSO (chiarito 18/08, oltre i tre
      vocali sopra): il PEZZO è quello che si prende in mano — un cubetto,
      un limone, un barattolo, una bottiglia; il CONTENUTO dice a quanto
      corrisponde quel pezzo, in capacità, peso o U — un cubetto 8 g, una
      bottiglia 70 cl; il COLLO dice quanti pezzi ci sono nella confezione
      che si compra — 30 cubetti, 24 birre, una cassetta di limoni. Sono i
      tre concetti che c'erano già (pezzo, contenuto, collo — quest'ultimo
      in REQ-MAG-011): il ghiaccio è il caso-prova buono, 1 pz = 8 g e un
      collo = 30 pz, quindi caricando «1 collo» entrano 30 pezzi, cioè
      240 g. Con questo si chiude anche il caso dei LIMONI (comprati al
      chilo, usati in cl) che era rimasto apertissimo dalla prima nota di
      Flavio: un limone è un pezzo, e il fatto che si comprino al chilo non
      rompe niente — è proprio per questo che Flavio vuole poter scegliere
      l'unità a ogni movimento; si compra 5 kg, si carica A GRAMMI, e i
      pezzi si ricavano dal contenuto del pezzo. AVVERTENZA ONESTA da
      scrivere in interfaccia:
      per la roba comprata a peso il conteggio in pezzi è una STIMA — un
      limone non pesa sempre uguale — e va bene finché quello che conta
      davvero è il peso, ma chi legge «47 pz» di limoni deve sapere che
      nessuno li ha contati uno per uno.
      IL CARICO A COLLO RESTA (vedi REQ-MAG-011, dove la parola che usa il
      codice è già «collo», non «cartone»): comprando confezioni intere —
      24 birre, per dire — si scrive il prezzo totale del collo e si
      scompone da sé, prima al singolo pezzo, poi al singolo cl (una
      bottiglia a 33 cl, non gli «8 cl» della trascrizione del vocale delle
      15:17 — il senso è quello della birra da 33, ripetuto poco prima nella
      stessa frase).
      Con questo si scioglie anche il punto rimasto aperto in BUG-014 (la
      «U» nella prima domanda): la prima domanda non c'è più, è sempre
      pezzo, e la «U» sta sempre — e solo — nella seconda.
      La MIGRAZIONE dei prodotti già in magazzino a questo modello è un
      lavoro separato, che si prova diversamente e può essere pronto in un
      momento diverso da questo requisito: vedi REQ-MAG-018.
      DA CHIARIRE (AskUserQuestion non disponibile in questo passaggio,
      quindi non deciso qui): 1) nel vocale delle 15:22 (min 1:00) il
      distillato d'esempio suona come «il Tangerai» — quasi certamente
      Tanqueray, ma la trascrizione non è chiara; 2) nel vocale delle 15:17
      (min 2:01) un prodotto suona come «la maro del capo», trascrizione
      poco chiara — non si capisce a cosa si riferisse l'esempio.
      FATTO (1.5.0). La scheda prodotto non ha più né le quattro card né il
      selettore dell'unità d'acquisto: si salva sempre `unit: 'pz'` e
      `display_unit: 'pz'`, e la sola domanda è «a quanto corrisponde un
      pezzo» — numero più unità fra l, cl, ml, kg, g, U, e nient'altro (le
      unità non sono personalizzabili, mai). Vuota vuol dire che in ricetta
      si dosa solo a pezzi. Il campo `tipo` non si scrive più e si azzera su
      chi l'aveva; la `resa` idem, perché con il pezzo fisso lo stesso legame
      lo dice già il contenuto e due risposte alla stessa domanda litigano
      (resaUso preferisce la resa). Il modello dati resta quello di sempre:
      `package_size` è il contenuto in unità base e `content_unit` dice di che
      famiglia è.
      SI SCARICA DAL MAGAZZINO? Resta una casella sulla scheda («È una
      scorta: si scarica quando si usa», accesa di suo). NON è la domanda
      tolta il 18/08 — quella diceva come si VENDE — ma la decisione che
      questo stesso requisito aveva già messo sul prodotto: senza, con
      l'unità bloccata sul pezzo, il «Tempo di Lavorazione» diventerebbe
      merce, andrebbe a zero al primo drink e il menù farebbe sparire dalla
      carta i drink che lo usano.
      OGNI MOVIMENTO CHIEDE L'UNITÀ: carico e conta hanno accanto alla
      quantità la scelta fra pezzi e contenuto (`unitaMovimento`), la
      conversione la fa `qtyInStockUnit` — lo stesso conto dello scarico — e
      sotto si legge quanto entra davvero prima di confermare. A colli si
      contano pezzi e basta: un cartone ha dentro pezzi, non centilitri.
      La giacenza NON cambia mai unità: resta in pezzi.
      L'AVVERTENZA ONESTA c'è: col contenuto a peso la scheda dice che il
      conteggio in pezzi è una stima, e il carico lo ripete.
      Le schede storiche (ml, g, U) si riaprono e passano ai pezzi al
      salvataggio, con l'avviso di conversione della giacenza di sempre: a
      volume o a peso si divide per il contenuto di un pezzo, la «U» vale uno
      a uno perché era già una cosa che si conta. Il travaso in blocco resta
      REQ-MAG-018.
    status: implemented
    generate_issue: false
    labels: [magazzino, ux]
    priority: P1
    test_cases: [tests/unit/inventory.test.js, tests/component/InventoryManagerCard.test.jsx]

  - id: REQ-MAG-018
    title: "I prodotti che ci sono già si travasano al modello nuovo aggiornando l'app, non li riapre uno per uno chi sta al banco"
    area: "src/lib/inventory.js (articoloNormalizzato), src/lib/api.js (mapItem, loadStock, adjustStock)"
    description: >
      Nasce da REQ-MAG-016 (unità sempre pezzo, con una corrispondenza in
      capacità/peso/U) ma è un lavoro A PARTE: il modello nuovo e il
      travaso dei dati vecchi si provano in modo diverso, e uno può essere
      pronto quando l'altro non lo è ancora — per questo è un requisito suo,
      non un paragrafo dentro l'altro.
      IL FATTO: oggi i 388 prodotti di magazzino hanno unità diverse fra
      loro — liquidi in cl, solidi in grammi, alcuni già a pezzi — e il
      modello nuovo li vuole tutti a PEZZO con una sola corrispondenza
      (capacità, peso o U).
      DECISO da Flavio (18/08): «credo che dobbiamo migrare noi i prodotti
      al nuovo modello, poi capiamo come» — il travaso non lo fa chi sta al
      banco riaprendo 388 schede a mano.
      COME, precisato da lui poco dopo (18/08): «il travaso deve avvenire in
      fase di aggiornamento. Cioè non dobbiamo farlo direttamente sui db:
      quando si aggiorna il bundle si aggiornano i prodotti». Niente script
      di migrazione lanciato contro Firestore, quindi — né in test né
      altrove. Il travaso è dell'APP, e si fa come si è sempre fatto con gli
      ordini vecchi, che nessuno ha mai migrato: li rimette in riga
      `normalizeOrderDoc` alla lettura (REQ-ORD-002).
      FATTO (1.5.0), in due pezzi.
      1) LETTURA TOLLERANTE: `articoloNormalizzato` (src/lib/inventory.js)
      prende un articolo com'è scritto sul database e ne restituisce la forma
      nuova; ci passa `mapItem` in src/lib/api.js, che è il punto da cui
      entrano nell'app tutti gli articoli — magazzino, ricette, menù, costi.
      Da lì in poi il resto del codice non sa più che esistono due forme.
      Chi è già a posto torna identico (stessa identità: sta sulla strada di
      ogni lettura).
      2) RISCRITTURA QUANDO CAPITA: l'articolo si salva nella forma nuova la
      prima volta che qualcuno lo tocca per un motivo suo — una modifica
      (la scheda salva già la forma nuova), un carico (`loadStock`), una
      conta (`adjustStock`). Nessuno deve aprire 388 schede, e non si
      scrivono 388 documenti tutti insieme.
      LE REGOLE DELLA CONVERSIONE, e il perché di ognuna. Il PEZZO è la
      confezione che si comprava: una bottiglia da 70 cl era già «una
      confezione da 700 ml», e la giacenza in ml diventa pezzi frazionati,
      senza stime. Per la «U» il pezzo è l'unità: un sacco di ghiaccio era
      uno, resta uno. La RESA diventa il contenuto, ma solo quando le due
      misure sono della stessa famiglia (il fusto comprato a litri e versato
      a cl): chi si comprava a chili e si dosava in cl di succo — i limoni —
      nel modello nuovo può corrispondere a una cosa sola, e sceglierla al
      posto di chi lavora vuol dire buttare via l'altra; se una ricetta
      dosava nella misura buttata, da quel momento scarica un chilo dove
      voleva un grammo. Quelli restano come sono. `scorta` va scritta nero su
      bianco: «si scarica dal magazzino?» aveva un valore di partenza legato
      all'unità, e portando tutto a pezzi il «Tempo di Lavorazione»
      diventerebbe merce — a zero al primo drink, e il menù farebbe sparire
      dalla carta i drink che lo usano.
      IL TRAVASO NON È SILENZIOSO SU UNA GIACENZA: l'articolo letto si porta
      dietro `formaVecchia` (solo in memoria, non si salva), e la scheda
      scrive «era scritto a litri: la giacenza (18,4 L) si legge come 0,92 pz
      e salvando resta scritta così».
      SI PROVA IN LOCALE PRIMA, con dati come quelli veri: «dobbiamo fare
      degli script di seeding da provare in locale» (Flavio, 18/08).
      `npm run seed:vecchi` (scripts/seed-magazzino-vecchio.js) riempie
      l'emulatore di prodotti scritti in TUTTE le forme vecchie che esistono
      davvero — a pezzo con e senza contenuto, a volume, a peso, a volume
      senza confezione, «U» con e senza scorta, con la resa della stessa
      famiglia e di due famiglie, col campo `tipo` delle quattro card, con la
      giacenza sotto zero — più una ricetta che li usa. Gira solo
      sull'emulatore, su progetto `demo-`, e sta fuori da `seed:tutto`:
      sporca il magazzino di prova con roba che serve per una verifica
      precisa. `node scripts/diagnosi-travaso.js` dice a che punto sta il
      travaso e, soprattutto, se leggerli a pezzi muove valore, pezzi o
      costi: non scrive niente, mai, da nessuna parte.
      QUATTRO VINCOLI DEL MESTIERE, che qui si dimenticano facile:
      1) GLI SCRIPT NON TOCCANO LA PRODUZIONE DI PROPRIA INIZIATIVA
      (CLAUDE.md). Con il travaso fatto dall'app il problema non si pone
      nemmeno: non c'è niente da lanciare contro le giacenze vere.
      2) IL TRAVASO DEVE ESSERE VERIFICABILE: prima e dopo, il VALORE di
      magazzino, la QUANTITÀ in pezzi e il COSTO delle ricette devono tornare
      uguali. Se cambiano, la conversione ha mentito — ed è l'unico controllo
      che se ne accorge da solo, perché un numero sbagliato in pezzi sembra
      comunque plausibile a chi lo legge. Lo controllano
      tests/unit/travasoInventario.test.js (compreso il costo di un drink
      intero, al centesimo) e lo script di diagnosi sui dati veri.
      3) IL TRAVASO TOCCA SOLO IL MODO DI MISURARE, NIENT'ALTRO (Flavio,
      18/08 ore 15:35): in produzione ha già sistemato a mano, uno per uno,
      menù e prodotti con i prezzi corretti e le ricette del menù. La
      conversione tocca unità, contenuto, giacenza, soglia e `scorta`: non
      prezzi, non ricette, non voci di menù.
      4) C'È UNA FINESTRA DI TEMPO (stesso vocale, 15:35): l'unica cosa che
      Flavio non ha ancora fatto è il CARICO REALE delle giacenze. Con il
      travaso alla lettura la finestra conta meno — non c'è un momento in cui
      qualcuno converte tutto — ma resta vero che è meglio aggiornare prima
      che dopo.
      RESTA APERTO: gli articoli comprati in una misura e usati in un'altra
      (i limoni al chilo, spremuti in cl) non si convertono da soli e si
      leggono ancora nella forma vecchia. Vanno sistemati a mano, decidendo
      cos'è un pezzo — un limone, e quanto pesa — e sono pochi: la diagnosi
      li elenca per nome.
    status: implemented
    generate_issue: false
    labels: [magazzino, dati]
    priority: P1
    test_cases: [tests/unit/travasoInventario.test.js]

  - id: REQ-MAG-017
    title: "Il fornitore si aggiunge dalla tendina del prodotto, come già la categoria nel menù"
    area: "src/components/InventoryManager.jsx (select #isup, form prodotto), src/components/DrinkForm.jsx onCategoryChange (il comportamento da copiare)"
    description: >
      Scritto da Flavio (18/08, due messaggi di seguito, 15:33 e 15:34 — il
      secondo semplifica il primo e vince), commentando il modulo «Modifica
      prodotto» del magazzino in test («Acqua Brillante Tonica»). La tendina
      Fornitore elenca solo i fornitori che esistono già: se manca quello
      giusto, oggi bisogna uscire dal prodotto, andare in Fornitori, crearlo,
      e tornare indietro a ricominciare la scheda — proprio nel momento in
      cui ci si accorge che manca.
      Sue parole (15:33): «nella tendina deve comparire il tab AGGIUNGI
      FORNITORE ed aggiungerlo direttamente da una finestra di info dove
      basterà confermare solo il nome per poi aggiungere in un secondo
      momento altre info aziendali».
      Come deve comportarsi (15:34) non è da inventare: il modello esiste
      già nell'app, e lui lo indica come esempio — «proprio come succede nel
      MENU che quando apri la tendina appare NUOVA CATEGORIA». Nel modulo
      del drink (src/components/DrinkForm.jsx) la tendina Categoria ha in
      fondo la voce «➕ Nuova categoria…», che apre al volo una finestra dove
      basta il nome per confermare (onCategoryChange, valore `__new__`). La
      tendina Fornitore del prodotto di magazzino deve comportarsi allo
      stesso modo: ultima voce che apre la creazione al volo, basta il nome
      — il resto dei dati aziendali (indirizzo, contatti…) si compila dopo,
      con tempo, dalla sezione Fornitori — e il fornitore appena creato resta
      SELEZIONATO sul prodotto che si stava compilando, senza doverlo
      riselezionare a mano: se toccasse rifarlo, il giro non si sarebbe
      accorciato.
      DA CHIEDERE (segnalato, non deciso qui — per esplicita richiesta di
      Flavio di non allargare la richiesta da soli): nello stesso modulo, la
      tendina Categoria del prodotto di MAGAZZINO (non quella del menù, che
      il comportamento ce l'ha già) è oggi un elenco semplice, senza
      «+ Nuova categoria» — la stessa mancanza del fornitore, mai segnalata
      a voce finora. Vale lo stesso trattamento anche lì?
      FATTO (1.5.0). La tendina Fornitore della scheda prodotto ha in fondo
      «➕ Nuovo fornitore…», identica alla «➕ Nuova categoria…» del modulo
      del drink: si sceglie, compare una riga dove basta scrivere il nome e
      confermare, e il fornitore appena creato resta SELEZIONATO sul
      prodotto che si stava compilando — se toccasse riselezionarlo a mano
      il giro non si sarebbe accorciato di niente. Il resto dei dati
      aziendali (indirizzo, contatti, email per gli ordini) si mette dopo,
      con calma, dalla sezione Fornitori. L'elenco in memoria si aggiorna da
      sé senza ricaricare il magazzino: la scheda che lo aspetta è aperta, e
      ricaricare la chiuderebbe. Ci si può anche ripensare («✕») senza aver
      creato niente.
      RESTA DA CHIEDERE, e non l'abbiamo allargato di nostra iniziativa: la
      tendina Categoria dello stesso modulo (quella del prodotto di
      MAGAZZINO, non del menù) è ancora un elenco semplice. Vale lo stesso
      trattamento anche lì?
    status: implemented
    generate_issue: false
    labels: [magazzino, fornitori, ux]
    priority: P2
