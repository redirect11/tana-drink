  - id: REQ-UI-007
    title: "La testata della coda sta su una riga sola"
    area: "src/pages/BartenderPage.jsx, src/index.css"
    description: >
      Da tablet in su, nella testata della coda titolo, ricerca e ⋯ stanno tutti
      sulla stessa linea e alti quanto il ☰ (42px), che è fisso e fuori dal
      flusso; conteggi e legenda degli autori vanno sulla riga sotto. Prima i
      conteggi stavano dentro il titolo, il titolo cresceva in altezza e ognuno
      degli altri si centrava a un'altezza diversa. Il ➕ resta invece grande
      com'era (60px) e sporge dalla riga: è il tasto che si prende di corsa e
      con le mani occupate, e un bersaglio largo vale più di una riga
      allineata. Siccome è il ➕ a dare l'altezza alla riga, il ☰ flottante si
      scosta di 21px dal bordo e non di 12: così il suo centro cade su «In
      servizio» invece di restare un dito più in alto. Sul telefono la testata
      resta a due piani — titolo rientrato per fare posto al ☰, ricerca a tutta
      larghezza — e conteggi e legenda partono dal bordo, allineati alla barra
      di ricerca che hanno sotto invece di stare sospesi a metà.
    status: implemented
    generate_issue: false
    labels: [ux, coda]
    test_cases: []

  - id: REQ-UI-008
    title: "Dallo schermo intero si esce dallo stesso tasto con cui si entra"
    area: "src/lib/useSchermoIntero.js, src/App.jsx"
    description: >
      Da browser il tasto ⛶ porta a schermo intero e, richiamato, ne fa uscire:
      vale sia per il tasto in barra sia per la voce nei ⋯ del telefono, che
      cambiano icona e parole quando si è dentro. Il tasto non compare a chi ha
      installato l'app, che gira già senza barre — ma "installata" non va
      confusa con "a schermo intero adesso": il browser risponde di sì a
      `display-mode: fullscreen` anche quando ci siamo andati noi con l'API, e
      il tasto per uscire spariva proprio quando serviva. Al banco il tablet è
      montato e la tastiera non c'è: senza tasto non si esce.
    status: implemented
    generate_issue: false
    labels: [ux, difetto-risolto]
    test_cases: [tests/component/SchermoIntero.test.jsx]

  - id: REQ-UI-009
    title: "La ricerca nella coda: filtra, oppure accende il conto e ci porta lì"
    area: "src/lib/coda.js, src/pages/BartenderPage.jsx, src/components/SettingsTab.jsx"
    description: >
