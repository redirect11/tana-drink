  - id: REQ-MAG-019
    title: "«pz» al posto di «bottiglie», dappertutto sullo schermo"
    area: "src/components/InventoryManager.jsx"
    description: >
      Decisione di Flavio (18/08), sulle diciture segnalate in REQ-MAG-016
      («una bottiglia fa 100 cl» «non credo sia molto italiana»). Testuale:
      «non dobbiamo vincolarci troppo a un gestionale per un bar. "Bottiglie"
      non è generico per un gestionale che in qualche modo deve essere
      generico. Quindi PZ DEVE ESSERE USATO AL POSTO DI BOTTIGLIE OVUNQUE».
      Riguarda le PAROLE CHE SI LEGGONO A SCHERMO — etichette, placeholder,
      testi d'aiuto, messaggi d'avviso — non i nomi interni del codice:
      `bottles_total`, `bottleBreakdown`, `bottleSummary` e i commenti
      restano come sono, che qui si cambia solo quello che legge chi ha in
      mano un vassoio.
      I PUNTI TROVATI (`grep -rn "bottigli" src/ --include=*.jsx`), perché
      chi implementa non debba ricercarli:
      1) l'etichetta del campo contenuto, nel form del prodotto: «Una
      bottiglia fa…»; 2) il suo placeholder: «Es. 70 per una bottiglia da
      70 cl»; 3) le due didascalie sotto lo stesso campo, una per «lo verso
      nei drink» («4 cl da una bottiglia da 70») e una per «lo vendo
      intero» («con le altre bottiglie»); 4) il messaggio d'avviso al
      salvataggio quando il contenuto obbligatorio manca: «Scrivi quanto fa
      una bottiglia (es. 70 cl)…»; 5) l'aiuto «A quanto corrisponde un
      pezzo» (tre paragrafi: «una bottiglia da 100 cl» due volte, «la birra
      in bottiglia»); 6) il sottotitolo «bottiglie, lattine» del tipo «Lo
      vendo intero», e l'aiuto della domanda «che tipo di prodotto è?», che
      ripete «bottiglia/bottiglie» cinque volte in tre paragrafi. Gli ultimi
      due (punto 6) vivono
      dentro la schermata a quattro card che REQ-MAG-016 (ripensamento
      18/08) toglie di mezzo: se le due implementazioni si fanno insieme,
      quel testo semplicemente non c'è più e non va corretto due volte; se
      REQ-MAG-016 arriva dopo, va corretto comunque perché nel frattempo
      resta a schermo.
      DUE AVVERTENZE. La prima: «una bottiglia fa 100 cl» era sbagliato due
      volte — la parola (bottiglia → pz) e il VERBO (fa → corrisponde),
      perché la sostanza del modello deciso il 18/08 è «a quanto
      corrisponde un pezzo», non «quanto fa» — chi corregge la parola senza
      correggere il verbo lascia la frase sbagliata a metà. La seconda: nel
      dettaglio aperto di un articolo (REQ-MAG-002, REQ-MAG-011) restano le
      «bottiglie piene / aperta / finite» che servono a chi va a contarle
      sullo scaffale — quella non è la dicitura da cambiare, è un'altra
      cosa: lì «bottiglia» descrive l'oggetto fisico, non l'unità di
      misura.
      FATTO (1.5.0). I punti 1-6 dell'elenco qui sopra vivevano tutti nella
      scheda prodotto e nella schermata a quattro card, che REQ-MAG-016 ha
      riscritto: quel testo non esiste più, e al suo posto c'è «a quanto
      corrisponde un pezzo» — la parola giusta e anche il verbo giusto.
      Restano corretti qui i tre punti che erano fuori da quella scheda: il
      titolo dell'assortimento «Bottiglie premium» (ora «I prodotti buoni»),
      il costo nel dettaglio di un articolo, che si legge «€/pz» e non più
      «€/conf.», e la riga del generatore ordini, che diceva «1 conf. = 700
      pz» — il contenuto letto nell'unità sbagliata, che con la giacenza
      contata a pezzi era anche un numero falso — e adesso dice «1 pz = 70
      cl», con il suggerimento e il campo in pz.
      Restano volutamente com'erano: le «piene / aperta / finite» del
      dettaglio, che descrivono l'oggetto sullo scaffale, e le due righe
      d'aiuto che elencano cosa può essere un pezzo («un cubetto, un limone,
      una bottiglia, un barattolo») — lì la bottiglia è un esempio fra
      altri, non l'unità di misura.
    status: implemented
    generate_issue: false
    labels: [magazzino, ux]
    priority: P2
    test_cases: [tests/component/InventoryManagerCard.test.jsx]

  - id: REQ-MAG-015
    title: "Macro-categorie di magazzino e di menù, per incrociare speso e incassato"
    area: "src/lib/macros.js, src/components/InventoryManager.jsx, src/components/StatsTab.jsx"
    description: >
      Chiesto da Flavio a voce (17/08, nota delle 20:13). Le macro-categorie
      oggi sono una cosa sola e stanno sul MAGAZZINO: raggruppano le
      categorie dei prodotti che si comprano. Servono anche sul MENÙ, sulle
      categorie dei drink che si vendono — e le due cose vanno tenute
      distinte («macro-categorie magazzino» e «macro-categorie menù»).
      A cosa servono davvero: incrociarle. Da una parte quanto si è SPESO in
      una macro d'acquisto, dall'altra quanto si è INCASSATO in una macro di
      vendita, e il confronto fra le due — che è la domanda che il locale si
      fa a fine mese e a cui oggi si risponde a mano.
      Da decidere prima di scrivere codice: se le due macro vivono nella
      stessa collezione con un campo che dice a chi appartengono o in due
      separate; e come si aggancia una macro d'acquisto alla macro di
      vendita corrispondente (una a una, o molte a molte).
      FATTO (1.4.8) il primo pezzo: i due elenchi esistono davvero. Le macro
      hanno un `ambito` ('magazzino' o 'menu', le righe vecchie sono tutte di
      magazzino), il menù ha la sua sottosezione «Macro-categorie» che
      raggruppa le categorie dei drink, e su ogni macro di spesa si sceglie a
      quale macro di vendita corrisponde (`macro_menu_id`). Il pannello è uno
      solo, condiviso dalle due schermate.
      DA FARE: il confronto vero e proprio — speso su una macro d'acquisto
      contro incassato sulla macro di vendita agganciata. Attenzione: la
      tabella «Mensile per macro» che c'è già confronta acquisti e fatturato
      sulle macro di MAGAZZINO, spalmando l'incasso di ogni drink sugli
      ingredienti in proporzione al costo. Le due letture rispondono a
      domande diverse e vanno tenute distinte, non sovrapposte.
      RIPENSATO (18/08, vocale delle 15:47 — «discorso abbastanza complesso»,
      parole sue). Il confronto sopra non basta quando un ingrediente
      finisce in un drink di una macro DIVERSA dalla propria: «un prodotto
      può essere venduto in due macro categorie differenti». Il gin è
      semplice — comprato in «distillati», venduto nel Gin Tonic che sta in
      «alcolici e distillati»: stessa macro, nessun conflitto. Il caso
      complesso è la SCHWEPPES: comprata come bibita (macro magazzino
      «birre e bibite»), ma quando finisce in un Gin Tonic — che nel menù
      sta in «alcolici e distillati» — quella porzione «deve migrare nei
      distillati». Stesso schema per la RED BULL, comprata come bibita e
      venduta in uno Jäger Bomb (alcolici e distillati). Sintesi sua: «il
      menù alla fine controlla il magazzino».
      INTERPRETAZIONE DA CONFERMARE (non è la sua frase testuale, è la
      lettura che ne dà chi scrive questo requisito — riportata perché presa
      alla lettera la frase è irrealizzabile): non è il PRODOTTO a cambiare
      macro-categoria — la stessa Schweppes si vende anche da sola, quindi
      non può stare in una macro sola, e cambiarla nell'anagrafica romperebbe
      il magazzino. A migrare, ai soli fini del CONFRONTO acquistato/venduto/
      margine, è il singolo CONSUMO: la porzione di Schweppes versata in quel
      Gin Tonic si attribuisce alla macro di vendita del drink (distillati),
      non alla macro d'acquisto del prodotto (bibite). L'anagrafica del
      prodotto — la sua macro di magazzino — non si tocca mai.
      Se questa lettura è sbagliata, il rischio è concreto: al primo Gin
      Tonic venduto il magazzino sballa.
      CASI DI PROVA (le sue parole, non inventati): la Schweppes comprata in
      «birre e bibite» e venduta dentro un Gin Tonic conta, in quel consumo,
      su «alcolici e distillati»; la Red Bull comprata in «birre e bibite» e
      venduta dentro uno Jäger Bomb conta, in quel consumo, su «alcolici e
      distillati».
      CONFERMATO E PRECISATO (18/08, vocale delle 15:52). La lettura qui
      sopra e' quella giusta, e lui la irrigidisce: non si scompone NIENTE.
      Parole sue: «non mi deve fare la scomposizione della ricetta [...] e'
      tutto l'items che va nella macro categoria», e ancora «la Schweppes
      l'ho venduta come se fosse un distillato in quel momento, perche'
      integrato». Quindi la vendita di una voce di menu si attribuisce
      INTERA alla macro di quella voce — incasso e costo di tutti i suoi
      ingredienti insieme — e non si spalma sulle macro dei singoli
      prodotti che la compongono.
      E dice anche cosa il programma NON deve fare, indicando una cosa che
      gia' fa: «credo che sia la cosa che sta facendo adesso». E' la tabella
      «Mensile per macro» descritta qui sopra, che spalma l'incasso di ogni
      drink sugli ingredienti in proporzione al costo: quella scomposizione
      va tolta, non affiancata.
      Resta aperta una sola domanda, e va posta a lui: gli ACQUISTI restano
      contati sulla macro del prodotto (la Schweppes comprata resta una
      spesa di «birre e bibite») mentre le VENDITE vanno sulla macro della
      voce di menu. Se il costo del consumo segue la vendita — com'e'
      necessario perche' il margine per macro torni — allora «birre e
      bibite» mostrera' una spesa d'acquisto che non ritrova nel venduto, e
      va spiegato a chi legge il numero invece di lasciarlo scoprire.
    status: todo
    generate_issue: true
    labels: [magazzino, menu, statistiche]
    priority: P1
    test_cases: [tests/component/MacroCategoryManager.test.jsx]

  - id: REQ-MENU-011
    title: "Un drink si duplica: la ricetta non si riscrive a mano"
    area: "src/components/MenuManager.jsx"
    description: >
      Nelle azioni della card del menù c'è «📋 Duplica». Mezzo listino sono
      variazioni — lo stesso drink col gin diverso, la versione analcolica,
      il formato grande — e rifarle a mano vuol dire riscrivere prezzo,
      categoria, descrizione e soprattutto la RICETTA ingrediente per
      ingrediente: è lì che si sbaglia una dose, e poi il magazzino scala
      storto.
      La copia NON si salva da sola: si apre la scheda già piena, col nome
      marcato «(copia)», così quello che cambia si sistema PRIMA che il
      drink esista — un doppione salvato di nascosto finirebbe in carta al
      cliente. Salvando nasce un prodotto nuovo: l'originale non si tocca.
      La foto resta all'originale: il file è agganciato al drink che l'ha
      caricata, e cancellando quello sparirebbe anche dalla copia.
    status: implemented
    generate_issue: false
    labels: [menu, ux]
    test_cases: [tests/component/MenuManager.test.jsx]

  - id: REQ-MENU-006
    title: "Sulle card i segni dicono cose diverse, dove uno se le aspetta"
    area: "src/components/MenuManager.jsx, src/components/PosBits.jsx, src/index.css"
    description: >
      Un oggetto si riconosce allo stesso modo in ogni schermata. La STRISCIA A
      SINISTRA dice come sta la cosa: sulle card della coda com'è messo il
      conto, sulle card del menù se il prodotto si può fare (verde), se un
      ingrediente sta finendo (arancione) o se non si può fare (rosso, e la
      riga sotto al nome dice se è spento a mano o se manca l'ingrediente).
      IL SEGNO NELL'ANGOLO è il colore che il prodotto ha al banco, e nel
      menù si tocca per cambiarlo. Che forma abbia lo decide il TEMA
      (`--segno-prodotto`, lib/themes.js, scritto anche come `data-segno`
      sul documento): di casa è il nastro d'angolo, largo e squillante; per
      Catppuccin una pastiglia (quadratino stondato), che è il suo modo di
      fare gli angoli; per Pico, look documento, il pallino. Gli ultimi due
      stanno in alto a destra sulle card del menù, dove le card del
      magazzino tengono lo stato delle scorte, e in alto a SINISTRA sulle
      tile del conto: lì a destra c'è la stella dei preferiti, che è un
      tasto e non si copre.
      Con trenta prodotti a schermo trenta bandiere colorate, su una
      palette da foglio di calcolo, restavano la cosa più rumorosa della
      pagina.
      Le tile del POS portano gli stessi due segni del menù, e la striscia
      è 4px come in magazzino (era 5): la griglia è la stessa in tutte e
      tre le schermate.
      Prima il menù aveva un quadratino che sembrava un'etichetta e invece era
      un tasto, e un pallino il cui rosso diceva due cose opposte — «l'ho
      spento io» e «è finito il rum» — che chiedono azioni diverse.
    status: implemented
    generate_issue: false
    labels: [menu, ux]
    test_cases: [tests/unit/temi.test.js]

  - id: REQ-MENU-005
