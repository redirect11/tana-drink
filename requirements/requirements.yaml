  - id: REQ-DEV-001
    title: "I requisiti restano attaccati ai test"
    area: "requirements/requirements.yaml, tests/unit/requisiti.test.js"
    description: >
      Questo elenco dice cosa fa l'app; i test dicono cosa fa davvero. Un test
      controlla che le due cose non si stacchino: ogni file di test dev'essere
      citato da almeno un requisito, ogni test citato deve esistere, gli
      identificativi non si ripetono e non si apre un'issue per qualcosa di già
      fatto. Chi aggiunge un test senza dire a quale requisito appartiene se ne
      accorge subito, non fra sei mesi.
    status: implemented
    generate_issue: false
    labels: [metodo]
    test_cases: [tests/unit/requisiti.test.js]

  - id: REQ-DEV-002
    title: "Si sa sempre quale versione si sta guardando"
    area: "src/lib/versione.js, src/components/VersionBadge.jsx, vite.config.js"
    description: >
      In fondo al menu laterale c'è la versione: in produzione il solo numero,
      altrove numero, ramo e commit — perché sull'unico ambiente di test passano
      a turno develop e i branch in lavorazione, e "l'ho provato e non andava"
      senza sapere cosa era pubblicato non vuol dire niente. Si tocca e si copia.
    status: implemented
    generate_issue: false
    labels: [metodo]
    test_cases: [tests/unit/versione.test.js]

  - id: REQ-DEV-003
    title: "Changelog delle versioni, leggibile anche dall'app"
    area: "CHANGELOG.md, src/components/InfoTab.jsx"
    description: >
      Ogni versione rilasciata ha le sue note in CHANGELOG.md, e le stesse note
      si leggono dentro l'app in Impostazioni → Informazioni, insieme ai dati
      tecnici (versione, ramo, commit, ambiente, progetto). Chi usa l'app deve
      poter sapere cosa è cambiato senza chiederlo a chi l'ha scritta.
      Il NUMERO di versione lo dice package.json, allineato al rilascio, non
      l'ultimo tag raggiungibile: il tag sta sul merge in main, che non è
      antenato dei rami di lavoro, e lì `git describe` risaliva al rilascio
      PRECEDENTE — l'ambiente di test diceva 1.2.0 mentre ci girava la 1.3.0.
      Un numero sbagliato è peggio di nessun numero: chi segnala un problema
      dichiara una versione che non è quella che ha davanti.
      E non deve andarle a cercare: l'app si aggiorna da sé mentre la si usa,
      e chi lavora si accorge del cambiamento solo perché qualcosa è finito in
      un altro posto. Toccando «Nuova versione disponibile», alla riapertura
      compare il BOX con le note di quella versione — una volta sola, poi mai
      più. Se invece l'aggiornamento arriva da sé (l'app riaperta il giorno
      dopo) niente box in faccia mentre si lavora: resta una NOTIFICA nella
      campanella che porta a Impostazioni → Informazioni. Alla prima apertura
      su un dispositivo nuovo non succede niente: un box di benvenuto con le
      note di rilascio non lo vuole nessuno.
    status: implemented
    generate_issue: false
    labels: [metodo, ux]
    test_cases: [tests/unit/novita.test.js, tests/component/AppHeader.test.jsx, tests/unit/notifyStore.test.js]

  - id: REQ-DEV-004
    title: "Il cancello di qualità prima del merge in develop"
    area: "docs/gitflow.md, vitest.config.mjs, .github/workflows/test.yml"
    description: >
      Il merge in develop passa un cancello, descritto in docs/gitflow.md:
      requisiti e registro bug aggiornati coi test citati; lint, test e
      build; la COVERAGE sopra le soglie di vitest.config.mjs — un
      cricchetto tarato appena sotto il misurato, che si alza quando la
      copertura cresce e non si abbassa mai per far passare un merge
      (npm run test:coverage fallisce da solo, e con lui la CI delle
      pull request); e un giro di refactoring sul diff (riuso,
      complessità, commenti sul perché) prima di chiedere il merge.
    status: implemented
    generate_issue: false
    labels: [metodo, qualita]
    test_cases: []

  - id: REQ-DEV-005
    title: "Alzare il cricchetto della coverage, e standard di complessità nel lint"
    area: "vitest.config.mjs, eslint.config.js"
    description: >
      Il cancello ora misura TUTTO il codice di prodotto, con una soglia
      per area tarata sul misurato del 16/08: functions/lib 92/76/88,
      src/lib 64/74/62, componenti 40/72/43, pagine 17/52/16 (src/dev è
      fuori: attrezzi, non prodotto). Le soglie basse — pagine su tutte —
      non certificano qualità: impediscono di peggiorare. Questo
      requisito è il lavoro di ALZARLE: coprire la logica delle pagine
      (BartenderPage e MenuPage in testa) e portare il cricchetto su.
      Insieme, gli standard di complessità nel lint (complexity,
      max-depth, dimensione delle funzioni): prima come avvisi per vedere
      dove siamo, poi come errori — i numeri esatti si decidono guardando
      il misurato, non a tavolino.
    status: todo
    generate_issue: true
    labels: [metodo, qualita]
    test_cases: []

