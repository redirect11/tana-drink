      pagina diversa da quella che stava mostrando al tavolo. Ordinare da qui
      resta possibile quando le impostazioni lo consentono: a «solo menù» i
      tasti per aggiungere spariscono per il cliente, mentre chi è dello staff
      può comunque inserire un ordine ed è segnato come autore. Allo staff la
      pagina dà in più la barra di ricerca, sopra le categorie: filtra per
      nome o ingrediente, perché chi prende l'ordine col cliente davanti non
      scorre otto categorie. Il cliente sfoglia la vetrina senza barra.
