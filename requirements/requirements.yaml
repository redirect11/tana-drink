      accanto a griglia, schede e lista. Gli ordini aperti stanno in quattro
      colonne — «Da fare» (ricevuto), «Al banco» (in preparazione), «Al ritiro»
      (pronto), «Da incassare» (consegnato e non saldato) — con in testa il
      conteggio, il totale della colonna e un filo del colore dello stato; ogni
      colonna scorre per conto suo, così le altre tre restano sott'occhio.
      Sulla card c'è UN tasto solo, quello che manda l'ordine al passo dopo:
      «Lo preparo io», «È pronto», «Consegnato», «Incassa». Sono le stesse
      azioni della griglia — l'avanzamento è updateOrderStatus, e «Incassa»
      apre il pagamento del conto, quello vero con sconto, conto diviso,
      contanti, carta e lettore: una vista è un modo di guardare, non un
      secondo modo di lavorare. Toccando la card (non il tasto) si apre il
      conto. Ricerca e filtro «Miei» valgono qui come nelle altre viste e
      filtrano dentro tutte le corsie insieme; le colonne restano tutte e
      quattro anche svuotate, perché la loro posizione si impara a memoria.
      Due casi che al banco costano un drink: il conto PAGATO ma non ancora
      consegnato resta in «Al ritiro» con il bollo «Pagato» invece del tempo
      (sparire vorrebbe dire dimenticarsi di servirlo), e «Da incassare»
      mostra la cifra al posto delle righe, perché lì la domanda è una sola.
      Con gli stati di servizio SPENTI i quattro passi non esistono e le
      corsie diventano le tre della griglia — in corso, chiusi, annullati —
      con le stesse etichette e le stesse regole (schedeCoda, passaFiltroCoda),
      e sui conti in corso resta l'incasso; quello che è già chiuso non ha
      tasti. Quello che esce dalla coda a fine cassa esce anche dalle corsie:
      la lista è la stessa (ordiniInCoda). Un conto appena battuto al POS
      compare in cima alla prima corsia già mentre parte verso il server:
      chi non lo vede lo ribatte.

      LA VISTA DEL BANCO È UN'ALTRA CODA, non un'altra vista della stessa.
      Ad accenderla sono GLI STATI DEL SERVIZIO: quei passi sono ciò che le
      dà senso, e spenti la vista non esiste proprio — chi è al banco vede
      la coda come tutti gli altri (queue_view). Accesi, chi ha il ruolo
      bartender (isBanco in lib/ruoli.js) apre già lì, senza scegliere
      niente. COME disegnarla lo dice `settings.bartender_view`, una
      impostazione del LOCALE sorella di `queue_view` (default in api.js,
      scelta in SettingsTab → Coda ordini): è scritta come una lista di
      viste possibili, per ora con la sola voce «corsie di stato», così
      quando se ne aggiungerà un'altra il valore già salvato resta buono.

      Gli stati del servizio riguardano le COMANDE, che fanno parte
      dell'ordine: l'ordine ha i suoi stati, le comande ne hanno dei
      sottostati. Nella vista del banco le corsie mostrano quindi le
      COMANDE — una card per ticket, col numero del conto e, solo se il
      conto ne ha più d'una, il numero della comanda («#41 · comanda 2») —
      e il tasto fa avanzare QUELLA comanda (advanceComanda), non tutto il
      conto. LA CODA DI CHI GUARDA LA SERATA NON CAMBIA: con
      `queue_view === 'corsie'` l'admin (e la sala) vede le corsie dei
      CONTI — in corso, chiusi, annullati — esattamente come prima, e con
      UN CONTO CHIUSO È UN CONTO INCASSATO, in tutta la coda dei conti —
      griglia, lista, schede, conteggi e corsie. Con gli stati del servizio
      ne servivano due, pagato E servito, e un conto appena riscosso restava
      fra quelli «in corso»: chi aveva appena preso i soldi lo cercava fra i
      chiusi e non lo trovava (BUG-018). Per lo stesso motivo è sparito il
      tasto «Nascondi pagati», che serviva a togliersi dagli occhi i conti
      incassati e non ancora serviti quando stavano in mezzo a quelli in
      corso. La regola stretta (pagato E servito) resta viva dove serve: il
      magazzino, che deve sapere che un conto pagato e non servito ha ancora
      ingredienti in ballo.
      Dentro i chiusi c'è un SOTTOFILTRO — tutti · serviti · da servire —
      perché si paga in anticipo tutte le sere e «quali dei chiusi hanno
      ancora roba da portare» è una domanda vera. Guarda le COMANDE
      (allServed), non lo stato del conto, e le comande annullate non
      contano: se contassero, un conto con dentro un drink annullato non
      risulterebbe servito mai più. Un conto annullato non è né servito né
      da servire: sta sotto la sua tab. Il sottofiltro compare solo dentro
      i chiusi e solo con gli stati del servizio accesi — senza, tutto
      quello che è stato pagato è uscito per definizione.

      Chi guarda la serata può andare a guardare il lavoro come il
      bartender: è un passaggio a mano di quel terminale (vistaCorsie), non
      il suo default. IL TASTO DICE DOVE PORTA, non dove si è —
      «🍸 Comande» guardando i conti, «🧾 Ordini» guardando le comande —
      perché un interruttore che si legge solo sapendo com'è messo adesso
      obbliga a guardare le colonne per capirlo. Sta nella RIGA DEI FILTRI,
      con la forma delle pastiglie che ci sono già, ma spinto A DESTRA da un
      margine automatico: a sinistra quello che restringe la lista, a destra
      quello che cambia vista — stessa riga, staccati, così non lo si legge
      come un filtro in più. C'è con QUALUNQUE vista della coda —
      griglia, lista, schede, corsie — perché la vista del banco è una vista
      a sé, non una variante delle corsie: chi tiene la cassa lavora in
      griglia e a metà serata vuole dare un'occhiata alla preparazione senza
      passare dalle Impostazioni e poi tornare a rimettere tutto com'era.
      Tornando indietro la coda è come l'aveva lasciata.

      Nella vista a comande le corsie sono sei: i tre passi del lavoro (una
      card per comanda), «Da incassare» (una card per CONTO — si incassa un
      conto, non un ticket — quando ha roba servita e non è saldato),
      «Chiusi» (comande SERVITE di conti pagati) e «Annullati» (comande dei
      conti annullati); le ultime due nascono spente. Una comanda è chiusa
      solo dopo essere stata servita: pagata ma non ancora servita resta
      nella corsia del suo passo col bollo «Pagato» e la card accesa, perché
      il drink va fatto lo stesso. Un tasto «▦ Colonne» spegne e riaccende
      le corsie, «Da incassare» compresa (chi sta allo shaker non incassa);
      la scelta e la vista sono del DISPOSITIVO, non del locale
      (impostazioniLocali.js: corsieNascoste, vistaCorsie).

      PREPARAZIONE PARZIALE. Di base la comanda è una sola ed esce tutta per
      l'intero ordine; dividerla è la deroga, per quando al banco si
      preparano insieme i drink uguali di comande diverse. Dal dettaglio del
      conto → Comande, su una comanda ancora «da fare», la voce
      «Preparazione parziale» fa scegliere quante unità per riga si preparano
      adesso: la comanda di partenza si ANNULLA (resta come storia, la copia
      già stampata ha un riscontro) e nascono due comande nuove — quella
      scelta, già in preparazione, e il resto, ancora da fare — col
      progressivo giusto e senza perdere una sola unità. Prese tutte le
      righe non si divide niente: la comanda avanza e basta. Quell'annullo
      è contabilità interna, non un fatto della serata: la comanda porta
      `annullata_per: 'divisione'` e su quel motivo — non sullo stato — si
      filtra, così non compare fra gli annullati (né nella corsia né nel
      conto annullato) e nel dettaglio si legge «Divisa»: quei drink non
      sono spariti, sono le due comande nate al loro posto, e mostrarli
      due volte farebbe pensare a un guaio che non c'è. Aprendo il
      conto le righe si raggruppano per passo del servizio («In
      preparazione», «Pronto», «Servito») come già accade per le righe
      «Pagati», e i titoli compaiono solo quando i gruppi sono più d'uno. Un
      conto si incassa in qualunque stato di servizio: pagato in cassa e in
      preparazione al banco si dicono insieme, senza contraddirsi.

      DOVE PORTANO I TOCCHI, nella vista del banco: toccando la card si apre
      il DETTAGLIO DELLA COMANDA (REQ-CODA-002), perché da lì la prima
      domanda è «cosa devo fare qui»; al conto si va da un tasto suo
      — «🧾 Conto» — piccolo e scritto, accanto a quello grande
      dell'avanzamento e non al suo posto: quello si preme di corsa, e un
      secondo tasto nella stessa posizione è un incasso aperto per sbaglio.
      Nella colonna «Da incassare» non c'è: lì la card è già il conto, e si
      apre toccandola. Nelle corsie dei CONTI non cambia niente.
    status: implemented
    generate_issue: false
    labels: [ux, coda]
    test_cases:
      - tests/unit/coda.test.js
      - tests/unit/comande.test.js
      - tests/unit/ruoli.test.js
      - tests/component/CodaCorsie.test.jsx
      - tests/component/OrderPosDetail.test.jsx
      - tests/component/SettingsTab.test.jsx

  - id: REQ-CODA-002
    title: "Il dettaglio di una comanda: cosa devo fare adesso, e per chi"
    area: "src/pages/ComandaPage.jsx, src/components/ComandaDetail.jsx, src/lib/comande.js, src/components/CorsieComande.jsx, src/App.jsx"
    description: >
      Schermata di una singola COMANDA, all'indirizzo
      /ordine/:id/comanda/:comandaId. Ci si arriva toccando la card nella
      vista del banco (REQ-CODA-001). È fatta come il dettaglio del conto ma
      risponde a un'altra domanda: quella del conto è della cassa — quanto
      fa, chi paga, cosa aggiungo — questa è del banco: cosa devo fare
      adesso, per chi, da quanto sta lì. Per questo sono due schermate e non
      una: riusare quella del conto avrebbe voluto dire portarsi dietro la
      griglia dei prodotti, lo sconto e il pagamento su un ticket, che sono
      tutte cose del conto. Quello che è di tutte e due sta già in comune:
      il flusso in lib/comande.js, i nomi degli stati in lib/orderStatus.js,
      la destinazione in lib/coda.js.

      Mostra: il numero del conto e quello del ticket, dove va (tavolo o
      bancone, col nome), a che punto sta, da quanto; i quattro passi del
      servizio con l'ORA in cui sono stati toccati (tappeComanda in
      lib/comande.js), perché al banco quei minuti sono la differenza fra
      «siamo indietro» e «questo ticket è stato dimenticato»; le righe di
      QUELLA comanda con prezzi e note di riga, e il totale suo — non
      quello del conto; le note del conto e della comanda; il bollo
      dell'acconto o del pagato, che chi finisce la comanda è spesso quello
      che poi porta il conto al tavolo.

      Si fa: il tasto grande che porta la comanda al passo dopo (uno solo,
      è quello che si preme di corsa) e le pastiglie «↩︎ Torna a…» per
      riportarla indietro anche di più di un passo (statiPrima); la
      ristampa; il ritorno alla coda. Gli avanzamenti passano da
      advanceComanda e si vedono subito, con la scrittura in sottofondo. Su
      un conto chiuso o annullato non c'è nessun tasto di lavorazione.

      DA QUI SI RISALE SEMPRE AL CONTO, con un tasto in evidenza in testata
      («Apri il conto #41»): incassare, aggiungere righe e dividere sono
      cose del conto e stanno nella sua schermata. La pagina è di chi
      gestisce: chi non lo è viene mandato sul conto, che sa già cosa
      mostrare a ognuno, invece di trovarsi davanti un «non puoi». Se la
      comanda non c'è più (divisa, conto rifatto) lo dice e offre il conto.
    status: implemented
    generate_issue: false
    labels: [ux, coda]
    test_cases:
      - tests/unit/comande.test.js
      - tests/component/ComandaDetail.test.jsx

  - id: REQ-UI-012
    title: "Dove la pagina ha sezioni sue, il menu resta aperto nella pagina"
    area: "src/components/StaffDrawer.jsx, src/index.css, docs/navigazione.md"
    description: >
      Nelle pagine con sottosezioni (Impostazioni, Inventario) il menu
      laterale, da 768px in su, non copre il contenuto: è una colonna della
      pagina e il contenuto si stringe per fargli posto. Dentro l'inventario
      si salta fra Prodotti e Conta venti volte di seguito, e un menu che
      copre vuol dire aprirlo, cercare, scegliere — e intanto non vedere più
      dove si era.
      Si apre e si chiude col ☰, lo stesso tasto di sempre: niente secondo
      comando per «agganciarlo», che sarebbe una cosa in più da capire per
      una differenza che a chi lavora non interessa — il menu c'è o non
      c'è. La scelta resta anche il giorno dopo.
      Sulle pagine senza sezioni proprie — la coda ordini —
      resta a scomparsa: lì sarebbe una colonna in meno di conti.
      Da dove in su è un conto sulla larghezza che avanza: sul telefono
      (360-430px) una colonna da 250px è più di metà schermo e il contenuto
      diventa inutilizzabile, quindi lì resta a scomparsa; da 768px —
      l'iPad in verticale, il tablet del banco — restano 500px e la scelta
      ha senso, con la colonna stretta a 200px fino ai 900px.
      E SI ALLARGA TIRANDO IL BORDO. Le voci sono parole corte, le
      sottosezioni no — «Marginalità listino» a 178px si taglia — e su un
      monitor grande quella colonna stretta è spazio sprecato. La maniglia
      sul bordo destro la porta fra 150 e 360px, doppio clic per tornare
      alla misura di partenza, e la larghezza scelta resta anche domani.
      Cresce tutto insieme, testo e icone: una colonna larga con la scritta
      piccola in mezzo sembra rotta. Il nome che non ci sta va a capo: nel
      menu non si scorre mai in orizzontale, e la maniglia è una colonna sua
      fra menu e contenuto — dentro al menu scorreva col contenuto e finiva
      sotto la barra di scorrimento, e per prenderla bisognava azzeccare due
      pixel.
    status: implemented
    generate_issue: false
    labels: [ux, navigazione]
    test_cases: [tests/component/StaffDrawer.test.jsx]

  - id: REQ-UI-011
    title: "La navigazione ha delle regole, e sono scritte"
    area: "docs/navigazione.md, src/App.jsx, src/index.css"
    description: >
      La barra in alto ha tre zone, sempre nello stesso ordine: a sinistra
      come si esce (☰ oppure ←), al centro dove si è (marchio e titolo, che è
      anche il comando delle sottosezioni), a destra cosa si può fare
      (campanella, ⋮). Quando lo spazio manca NON si rimpiccioliscono i tasti
      — al banco si tocca con le dita bagnate e sotto i 44px si sbaglia — si
      toglie, in quest'ordine: il nome del locale (sotto i 700px resta il
      logo), l'«indietro» (sul telefono il ☰ fa quello che fa lui e in più:
      dalla coda alle impostazioni in un tocco solo), il logo (sotto i 400px).
      Il titolo della sezione si accorcia coi puntini ma non sparisce mai: è
      l'unica cosa che dice dove sei; ☰, campanella e ⋮ non cadono mai.
      Le gerarchie stanno una per volta e ognuna al suo posto: le pagine nel
      menu laterale, le sottosezioni nel titolo, i filtri in una tendina, e il
      contenuto non porta navigazione. Niente seconda riga sotto la barra, e
      un solo modo di tornare indietro per schermata.
      Le regole stanno in docs/navigazione.md: si seguono invece di
      ridiscuterle a ogni schermata.
    status: implemented
    generate_issue: false
    labels: [ux, navigazione]
    test_cases: []

  - id: REQ-UI-010
    title: "L'app si chiama come il locale, e dice a chi appartiene"
    area: "src/lib/nomeApp.js, public/manifest.webmanifest"
    description: >
      L'app installata si chiama «La Tana del Coniglio», non con la sigla del
      progetto. A chi lavora il nome porta il suffisso del ruolo — « - admin»,
      « - bartender», « - staff» — così sul telefono l'icona dice di chi è, e
      chi tiene due profili non li confonde; il cliente, e chi non ha fatto
      accesso, vede il nome nudo. Il suffisso segue il ruolo di chi è collegato
      e vale per la linguetta del browser e per il nome proposto
      all'installazione: il telefono lo congela in quel momento, quindi l'app va
      installata da collegati col ruolo che serve. Il manifest riscritto porta
      avvio, ambito e icone per esteso, altrimenti l'app installata partirebbe
      da nessuna parte.
    status: implemented
    generate_issue: false
    labels: [ux, pwa]
