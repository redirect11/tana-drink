  - id: REQ-AVVISI-004
    title: "Uscendo si spengono gli avvisi, rientrando si riaccendono"
    area: "src/lib/logout.js, src/lib/push.js, src/lib/customerAuth.js, src/lib/api.js, src/App.jsx, src/components/AvvisiSpenti.jsx"
    description: >
      Il token push è del DISPOSITIVO, non della persona, e dopo il logout
      restava valido: chi si era scollegato continuava a sentire suonare gli
      ordini del locale sul telefono di casa. Uscendo, quel dispositivo viene
      tolto dai destinatari; al primo accesso successivo si registra da sé,
      senza aspettare che si passi dalla coda.
      Se non ci riesce — offline, regole — si esce lo stesso: restare dentro
      sarebbe peggio, e il token scade da solo. E non ci si impianta
      aspettando: timbratura e rubrica sono scritture su Firestore, e una
      scrittura offline non torna mai — passati due secondi e mezzo si esce
      comunque.
      NON BASTA LA RUBRICA: si spegne il TOKEN. `staff_tokens` è solo
      l'elenco dello staff; il token è del browser e resta valido, e gli
      avvisi al cliente («il tuo drink è pronto», «ordine annullato») lo
      tengono scritto sull'ORDINE, non nell'elenco. Chi si era scollegato
      continuava a sentire suonare il telefono. Uscendo si cancella il
      token: non resta nessun indirizzo a cui bussare, chiunque sia il
      mittente. Vale anche per il cliente che esce, e per «Esci e accedi
      come staff», che passava dal signOut secco e non toglieva niente.
      E QUANDO GLI AVVISI SONO SPENTI SI VEDE. Il permesso lo chiede il
      browser una volta sola, con una finestrella in alto che chi sta
      lavorando scarta senza leggerla: da quel momento quel tablet non suona
      più, e nessuno se ne accorge finché non manca un ordine. Una riga in
      cima lo dice su ogni schermata del gestionale, con il tasto per
      attivarli; rifiutando ricompare — non c'è «non mostrare più», perché è
      proprio il rifiuto per sbaglio il caso da coprire. Se il browser li ha
      bloccati del tutto, l'app non può più chiedere: si spiega dove
      riaccenderli invece di mostrare un tasto che non farebbe niente.
      Non è una finestra modale: al banco non si blocca il lavoro per una
      impostazione.
    status: implemented
    generate_issue: false
    labels: [avvisi, staff]
    test_cases:
      - tests/unit/logoutAvvisi.test.js
      - tests/component/AvvisiSpenti.test.jsx

