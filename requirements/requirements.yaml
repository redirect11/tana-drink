# requirements/requirements.yaml
#
# COSA FA QUESTA APP, scritto una volta sola.
#
# Serve a tre cose: capire cosa esiste senza leggere trentamila righe di
# codice, accorgersi di cosa manca, e far lavorare su richieste chiare chi
# — persona o agente — apre una pull request.
#
# I requisiti nascono dai TEST. I test in tests/ sono la specifica vera,
# quella che fallisce quando qualcuno la contraddice: dove un requisito è
# `implemented`, i file elencati in `test_cases` lo dimostrano. Dove è
# `todo` o `partial`, il lavoro è ancora da fare — ed è da lì che si
# generano le issue.
#
# Formato:
#   id:             Identificatore stabile (es. REQ-POS-001)
#   title:          Titolo breve
#   area:           File o modulo che lo implementa
#   description:    Cosa deve fare, e possibilmente perché
#   status:         implemented | partial | todo | deprecated
#   generate_issue: true per creare l'issue GitHub (i todo)
#   labels:         Label GitHub
#   test_cases:     Test che lo coprono (file o id)
#
# Per generare le issue da questo file:
#   node scripts/generate-issues.mjs --dry-run     # anteprima
#   GITHUB_TOKEN=<token> node scripts/generate-issues.mjs
#
# Oppure: GitHub → Actions → "Generate Issues from Requirements".
# Le issue sono idempotenti: il titolo porta il [REQ-ID] e chi c'è già
# viene saltato.

requirements:

  # ══════════════════════════════════════════════════════════════════════
  #  ORDINI E COMANDE — il conto resta aperto, le comande vanno al banco
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-ORD-001
    title: "Un conto aperto contiene più comande, ciascuna col suo stato"
    area: "src/lib/comande.js, src/lib/api.js"
    description: >
      Un ordine è un CONTO che resta aperto (aperto/pagato/annullato) e contiene
      una o più comande. La lavorazione (ricevuto, in preparazione, pronto,
      ritirato) vive sulla singola comanda: un tavolo può avere un giro già
      servito e uno ancora al banco. La comanda attiva è quella al passo più
      indietro; a parità di passo vince la più vecchia.
    status: implemented
    generate_issue: false
    labels: [ordini, comande]
    test_cases: [tests/unit/comande.test.js, tests/unit/orderStatus.test.js, tests/unit/orderLines.test.js]

  - id: REQ-ORD-002
    title: "Gli ordini vecchi continuano a funzionare"
    area: "src/lib/comande.js normalizeOrderDoc"
    description: >
      Gli ordini scritti prima del modello a comande hanno solo `items` e uno
      stato di lavorazione sul conto: vengono normalizzati al volo in un conto
      con una comanda sintetica che porta quello stato. Nessuna migrazione dei
      dati, e lo storico resta leggibile e calcolabile come il resto.
    status: implemented
    generate_issue: false
    labels: [ordini, retrocompatibilita]
    test_cases: [tests/unit/comande.test.js]

  - id: REQ-ORD-003
    title: "Aggiungere a un conto non riapre quello che è già stato servito"
    area: "src/lib/comande.js, src/components/OrderPosDetail.jsx"
    description: >
      Gli aumenti confluiscono nella comanda ancora modificabile (ricevuta o in
      preparazione); se non ce n'è, nasce una comanda nuova. Le diminuzioni
      scalano solo da comande modificabili: quello che è già pronto o servito non
      si tocca, perché il drink è stato fatto davvero.
    status: implemented
    generate_issue: false
    labels: [ordini, comande, pos]
    test_cases: [tests/unit/comande.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-004
    title: "Un conto rimasto senza righe si annulla da solo"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Togliendo tutte le righe di un conto appena aperto, il conto viene annullato
      e si torna alla coda: un conto vuoto in lista è solo un ingombro. Non
      succede se qualcosa è già stato incassato — lì il conto esiste davvero e va
      chiuso a mano.
    status: implemented
    generate_issue: false
    labels: [ordini, pos]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-005
    title: "Annullando un conto le scorte tornano a magazzino"
    area: "src/lib/api.js cancelOrder"
    description: >
      L'annullo rimette in magazzino quello che le comande avevano scalato, usando
      lo snapshot di consumo salvato al momento dello scarico e non ricalcolando
      la ricetta, che intanto può essere cambiata. Fa eccezione l'annullo per
      "non ritirato": lì il drink è stato preparato e il prodotto è consumato.
    status: implemented
    generate_issue: false
    labels: [ordini, magazzino]
    test_cases: [tests/unit/warehouse.test.js]

  - id: REQ-ORD-006
    title: "Chiudendo un conto sparisce subito dalla coda"
    area: "src/lib/ordiniNascosti.js, src/components/OrderPosDetail.jsx"
    description: >
      Chiudendo o annullando si torna alla lista ordini, dove quel conto non deve
      più comparire: la scrittura viaggia in sottofondo e la coda avrebbe ancora
      la versione di prima — lo si vedeva lì, e lo si guardava sparire. I conti
      chiusi da questo dispositivo escono subito dalla lista; se la scrittura
      fallisce ricompaiono, e la memoria scade da sé dopo un minuto.
    status: implemented
    generate_issue: false
    labels: [ordini, coda, ux]
    test_cases: [tests/unit/ordiniNascosti.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-007
    title: "La coda distingue aperti e chiusi, e ignora gli annullati"
    area: "src/lib/coda.js"
    description: >
      La coda smista i conti per stato, conta e somma solo i non annullati e sa
      dire quanti conti sono ancora aperti. Con la gestione della preparazione
      attiva un conto pagato ma non servito resta da fare; senza, il pagamento
      chiude e basta — e nella schermata di pagamento non compare l'avviso
      «comande non ancora servite», che senza preparazione non vuol dire niente
      e uscirebbe a ogni incasso.
    status: implemented
    generate_issue: false
    labels: [ordini, coda]
    test_cases: [tests/unit/coda.test.js, tests/component/PaymentScreen.test.jsx]

  - id: REQ-ORD-008
    title: "Un conto chiuso o annullato si può rimettere in corso"
    area: "src/lib/storiaOrdine.js, src/lib/api.js, src/components/StoriaOrdine.jsx"
    description: >
      Capita di chiudere un conto sul tavolo sbagliato, di annullarlo per un
      malinteso, o che il cliente torni e voglia ordinare ancora su quello.
      Chi ha il gestionale può rimetterlo in corso: si conferma in un pannello
      che dice cosa succederà e si può scrivere il perché — FACOLTATIVO, perché
      se fosse obbligatorio si scriverebbe "x" per passare oltre, e al banco i
      secondi non ci sono. Il conto torna aperto e si può battere di nuovo.
      RIAPRIRE = COME SE NON FOSSE MAI STATO PAGATO. Gli incassi si tolgono:
      il conto riaperto è un conto normale, da battere e da incassare, con
      tutte le righe modificabili. Prima gli incassi restavano attaccati e il
      conto tornava «ad acconto»: le righe già pagate erano bloccate — e
      riaprire serve proprio a toccarle — e i soldi restavano nei guadagni
      della serata di un conto che era di nuovo da incassare, quindi a fine
      turno lo stesso conto risultava incassato due volte.
      La cassa legge gli incassi dagli ordini, perciò toglierli dal conto li
      toglie anche dal flusso di cassa. Non si butta via niente: quello che
      era entrato resta in `payments_annullati` con l'ora in cui è stato
      tolto, e il totale compare nella storia del conto («riaperto — tolti
      15,50 € dagli incassi»), che è dove lo si va a cercare quando la cassa
      non torna. Le comande già servite restano servite: tornano da fare solo
      quelle annullate col conto.
      Il tasto per riaprire NON è un tasto in più: è quello del PAGAMENTO,
      che su un conto chiuso o annullato era lì spento a non fare niente.
      IL BUONO NON SI PAGA DUE VOLTE. Il saldo di un buono si scala quando
      lo si usa, non quando i soldi entrano in cassa. Se il conto era stato
      PAGATO con un buono, riaprendolo quella riga di incasso sparisce come
      le altre: il saldo torna al beneficiario, altrimenti avrebbe pagato
      due volte — una col buono che non torna, una quando ripaga il conto.
      Il buono usato come SCONTO invece resta dov'è: lo sconto è ancora sul
      conto, quindi qualcuno deve pagarlo, e ri-chiuderlo non lo scala una
      seconda volta.
      Se il conto annullato era stato scontato con un BUONO VIP, riaprendolo il
      saldo si ri-addebita: annullando era tornato al beneficiario, e lasciarlo
      lì significherebbe uno sconto che nessuno ha pagato e un credito in
      circolazione che non torna più con i conti. Se nel frattempo il buono è
      stato speso altrove e il saldo non basta, si addebita quel che c'è e lo
      sconto si riduce a quella cifra (fino a sparire): meglio un conto che
      chiede qualche euro in più che un buono in rosso. Su un conto CHIUSO non
      si tocca niente, perché lì il buono non era mai stato ristornato.
      Il motivo si legge DENTRO il conto riaperto, senza doverlo cercare, e la
      storia completa — aperto, chiuso, annullato, riaperto, con chi e perché —
      sta dietro i ⋯ del conto, sia nella coda sia nel dettaglio. La storia si
      ricostruisce da quello che il conto porta già addosso, quindi vale anche
      per i conti di ieri, senza migrazioni.
    status: implemented
    generate_issue: false
    labels: [ordini, difetto-risolto]
    test_cases: [tests/unit/storiaOrdine.test.js, tests/component/OrderPosDetail.test.jsx, tests/unit/vouchers.test.js, tests/unit/ripristino.test.js]

  # ══════════════════════════════════════════════════════════════════════
  #  CASSA / POS — come si batte un ordine
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-POS-001
    title: "L'ordine nasce al primo prodotto, senza cambiare schermata"
    area: "src/components/OrderPosDetail.jsx, src/pages/PosPage.jsx"
    description: >
      Toccando il primo prodotto il conto viene creato in place: niente
      navigazione, niente ricaricamento, la schermata resta quella e da lì si
      continua come in modifica. Il nome del cliente si chiede all'uscita, una
      volta sola.
    status: implemented
    generate_issue: false
    labels: [pos]
    test_cases: [tests/component/PosPage.test.jsx]

  - id: REQ-POS-002
    title: "Niente si perde mentre l'ordine sta nascendo"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      La creazione dura qualche decimo di secondo e in quei decimi al banco si
      continua a battere: le righe aggiunte nel frattempo devono finire nello
      stesso conto, senza sparire e senza far nascere un secondo conto. La bozza
      cambia chiave quando il conto nasce, e le righe rimaste vanno passate alla
      chiave nuova. Nemmeno il PAGAMENTO si perde: premendo Pagamento mentre la
      creazione è ancora in volo, la schermata deve restare aperta anche quando
      il server risponde e il conto smette di essere "nuovo" — prima si chiudeva
      da sola e bisognava ripremere Pagamento, col cliente davanti.
    status: implemented
    generate_issue: false
    labels: [pos, difetto-risolto]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-POS-003
    title: "La bozza non si perde uscendo dalla schermata"
    area: "src/lib/useDraft.js"
    description: >
      Le righe non ancora confermate restano in memoria locale per contesto:
      uscendo e rientrando si riprende da dove si era. Vale anche per l'ordine
      visivo delle righe, riordinabile a mano.
    status: implemented
    generate_issue: false
    labels: [pos, offline]
    test_cases: [tests/unit/useDraft.test.js]

  - id: REQ-POS-004
    title: "Un ricaricamento non fa perdere il conto in corso"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      In creazione il conto nasce senza cambiare pagina: dopo un ricaricamento
      l'app non saprebbe più su quale conto stava lavorando e ne aprirebbe un
      altro, lasciando il primo in coda con dentro la roba già battuta. L'id del
      conto viene ricordato e ripreso al rientro, se è ancora aperto; si dimentica
      uscendo, alla chiusura, o dopo otto ore.
    status: implemented
    generate_issue: false
    labels: [pos, difetto-risolto]
    test_cases: []

  - id: REQ-POS-005
    title: "Le modifiche sono istantanee a schermo, sincronizzate dopo"
    area: "src/components/OrderPosDetail.jsx, src/lib/sync.js"
    description: >
      Aggiunte e diminuzioni compaiono subito e partono in sottofondo: nessuna
      schermata aspetta il server. Se la scrittura fallisce lo dice un avviso, ma
      il lavoro al banco non si ferma mai.
    status: implemented
    generate_issue: false
    labels: [pos, offline]
    test_cases: [tests/component/OrderPosDetail.test.jsx, tests/unit/incassoOffline.test.js, tests/unit/pendingOrders.test.js]

  - id: REQ-POS-006
    title: "Prodotto libero: una voce che non è a menù"
    area: "src/components/CustomDrinkForm.jsx"
    description: >
      Si aggiunge al conto una voce fuori catalogo, con nome, prezzo e ricetta
      incorporata. La ricetta incorporata ha precedenza su quella del catalogo
      quando si scaricano le scorte.
    status: implemented
    generate_issue: false
    labels: [pos, menu]
    test_cases: [tests/component/CustomDrinkForm.test.jsx, tests/unit/inventory.test.js]

  - id: REQ-POS-007
    title: "Sul telefono la pagina è per le righe e la griglia"
    area: "src/components/OrderPosDetail.jsx, src/components/ActionSheet.jsx"
    description: >
      Sotto i 700px in pagina restano totale, righe del conto e i tre gesti della
      serata (Invia, Paga, Annulla); comande, prodotto libero, dati conto, unisci,
      separa e gruppo stanno dietro i tre puntini. Il pannello si apre mostrando
      l'ultima riga battuta e si alza da una maniglia.
    status: implemented
    generate_issue: false
    labels: [pos, telefono, ux]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-POS-008
    title: "Le maniglie, col dito, si prendono solo tenendo premuto"
    area: "src/lib/useResizable.js"
    description: >
      Col mouse si prende e si trascina; col dito la maniglia si arma dopo 400ms,
      con vibrazione e segnale visivo. Se prima dello scatto il dito si sposta di
      oltre 10px stava scorrendo, e non succede niente: sfiorare una maniglia
      mentre si scorre non deve cambiare la misura di nulla.
    status: implemented
    generate_issue: false
    labels: [pos, telefono, ux]
    test_cases: [tests/unit/useResizable.test.js]

  - id: REQ-POS-009
    title: "Nelle schermate di lavoro non parte il tira-per-aggiornare"
    area: "src/index.css, src/components/PosProductPicker.jsx"
    description: >
      Arrivati in cima a una lista, continuando a trascinare in giù il browser
      ricaricava la pagina, in mezzo alla composizione di un ordine. Nelle
      schermate a tutto schermo lo scorrimento si ferma dov'è e non si propaga al
      documento.
    status: implemented
    generate_issue: false
    labels: [pos, telefono]
    test_cases: []

  - id: REQ-POS-010
    title: "Unisci e Separa: un tasto solo"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Oggi sono due tasti distinti e solo uno dei due è utile alla volta. Vanno
      unificati in un comando unico che fa la cosa sensata a seconda delle righe:
      accorpa se ci sono righe uguali, separa se c'è una riga con quantità
      multipla.
    status: todo
    generate_issue: true
    labels: [pos, ux]
    test_cases: []

  # ══════════════════════════════════════════════════════════════════════
  #  PAGAMENTI
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-PAG-001
    title: "Incasso in contanti, carta o acconto, anche senza rete"
    area: "src/components/PaymentScreen.jsx, src/lib/api.js"
    description: >
      Il conto si chiude subito a schermo e la scrittura va in coda: contanti,
      carta e acconti non aspettano il server. Un conto già pagato viene rifiutato
      subito, non dopo un timeout di rete. Il metodo scelto resta scritto
      sull'incasso: serve alla chiusura di cassa e allo scontrino.
    status: implemented
    generate_issue: false
    labels: [pagamenti, offline]
    test_cases: [tests/unit/incassoOffline.test.js, tests/component/PaymentScreen.test.jsx, tests/unit/pagamento.test.js, tests/unit/payments.test.js, tests/unit/payment-core.test.js]

  - id: REQ-PAG-002
    title: "Il tasto Pagamento dice quanto resta da incassare"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Sul tasto è scritta la cifra da incassare al netto di sconti e acconti già
      presi, e resta scritta anche dopo che l'ordine è stato creato. A conto
      saldato la cifra sparisce, perché non c'è più niente da incassare.
    status: implemented
    generate_issue: false
    labels: [pagamenti, pos]
    test_cases: [tests/component/OrderPosDetail.test.jsx]

  - id: REQ-PAG-003
    title: "Sconto sul conto, con tre strategie a scelta"
    area: "src/lib/pricing.js, src/components/SettingsTab.jsx"
    description: >
      Lo sconto si applica dal tastierino e si può impostare come tetto al totale,
      come proporzione sulle righe o come semplice avviso; la strategia si sceglie
      nelle impostazioni (default: tetto al totale). Le statistiche e il rendiconto
      devono sempre scorporare lo sconto, mai mostrare il prezzo di listino come
      venduto. Il tastierino dello sconto ha le cifre nell'ordine di sempre
      (7 8 9 / 4 5 6 / 1 2 3 / C 0 ←), su tre colonne: si batte a memoria.
    status: implemented
    generate_issue: false
    labels: [pagamenti, sconti]
    test_cases: [tests/unit/pricing.test.js, tests/component/PaymentScreen.test.jsx]

  - id: REQ-PAG-004
    title: "Lettore SumUp: pairing e incasso con carta"
    area: "functions/lib/payment-service.js, src/lib/paymentsApi.js"
    description: >
      Il lettore si associa con un codice di pairing (riservato a chi sta al
      banco); da lì si incassa con carta direttamente dall'app. Il webhook verifica
      l'esito tramite la Transactions API prima di segnare il conto pagato.
      Nella schermata di pagamento SumUp resta sempre in lista: se il lettore non
      è configurato — o manca la rete — il tasto è spento a vedersi ma si può
      toccare, e al tocco dice il perché e dove si rimedia. Il motivo non sta
      scritto sotto al tasto: occupava una riga in una schermata che ne ha
      poche, e chi incassa non lo leggeva comunque.
    status: implemented
    generate_issue: false
    labels: [pagamenti, sumup]
    test_cases: [tests/bdd/payment-reader.test.js, tests/component/PaymentScreen.test.jsx]

  - id: REQ-PAG-005
    title: "Pagamento online con link o QR"
    area: "functions/lib/payment-service.js"
    description: >
      Si può creare un checkout online per un conto e verificarne lo stato; il
      webhook salda il conto quando il pagamento arriva. Vale anche per i conti di
      gruppo, dove il pagamento chiude tutti gli ordini del gruppo.
    status: implemented
    generate_issue: false
    labels: [pagamenti, online]
    test_cases: [tests/bdd/payment-checkout.test.js, tests/bdd/payment-group.test.js]

  - id: REQ-PAG-006
    title: "Buoni VIP: credito prepagato intestato a una persona"
    area: "src/lib/vouchers.js, src/components/VipTab.jsx"
    description: >
      Un buono ha un saldo che si consuma sui conti; si vede quanto credito è in
      circolazione e i buoni scaduti non sono spendibili. Annullando un conto che
      ha usato un buono, il credito torna al beneficiario.
    status: implemented
    generate_issue: false
    labels: [pagamenti, vip]
    test_cases: [tests/unit/vouchers.test.js]

  - id: REQ-PAG-007
    title: "Codice lotteria e fattura di cortesia"
    area: "src/components/PaymentScreen.jsx, src/components/InvoicesTab.jsx"
    description: >
      Al pagamento si può registrare il codice lotteria del cliente ed emettere una
      fattura di cortesia numerata, con il suo registro nel gestionale.
    status: implemented
    generate_issue: false
    labels: [pagamenti, fatture]
    test_cases: [tests/component/PaymentScreen.test.jsx, tests/component/InvoicesTab.test.jsx]

  - id: REQ-PAG-008
    title: "Preconto prima di incassare"
    area: "src/components/PaymentScreen.jsx"
    description: >
      Si può stampare o mostrare il conto al cliente prima dell'incasso, senza
      chiudere niente: il conto resta aperto e modificabile.
    status: implemented
    generate_issue: false
    labels: [pagamenti, stampa]
    test_cases: [tests/component/PaymentScreen.test.jsx]

  # ══════════════════════════════════════════════════════════════════════
  #  CASSA DI SERATA, STATISTICHE, RENDICONTO
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-CASSA-001
    title: "La giornata di lavoro finisce dopo la mezzanotte"
    area: "src/lib/businessDay.js"
    description: >
      La serata appartiene al proprio giorno anche dopo la mezzanotte, fino
      all'ora di taglio configurata: un drink servito all'una di notte è della
      serata precedente. L'ora di taglio è un'impostazione (0 = giorno solare).
    status: implemented
    generate_issue: false
    labels: [cassa, serata]
    test_cases: [tests/unit/businessDay.test.js]

  - id: REQ-CASSA-002
    title: "Apertura e chiusura cassa, con fondo e conteggio"
    area: "src/lib/cassa.js, src/components/CashFlow.jsx"
    description: >
      La cassa si apre con un fondo e si chiude con il riepilogo della serata:
      incassato per metodo e per ora, conti chiusi, conti ancora da incassare.
      Senza cassa aperta non si battono ordini.
    status: implemented
    generate_issue: false
    labels: [cassa]
    test_cases: [tests/unit/cassa.test.js]

  - id: REQ-CASSA-003
    title: "La carta non finisce mai nei contanti"
    area: "src/lib/cassa.js"
    description: >
      Il contante atteso in cassa conta solo il contante. Ogni metodo è contato col
      suo nome, anche uno mai visto prima, e i metodi noti compaiono sempre, pure a
      zero. Le chiusure vecchie senza metodo indicato restano contate come contanti.
    status: implemented
    generate_issue: false
    labels: [cassa, difetto-risolto]
    test_cases: [tests/unit/cassa.test.js]

  - id: REQ-CASSA-004
    title: "Rendiconto della serata: ordini e prodotti venduti"
    area: "src/lib/rendiconto.js, src/components/RendicontoSerata.jsx"
    description: >
