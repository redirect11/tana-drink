    area: "src/pages/MenuPage.jsx"
    description: >
      A /menu si apre sempre la stessa schermata, per chi ordina e per chi
      lavora: le categorie con le voci del listino, così come le vede il
      cliente. C'era anche una seconda vista, riservata allo staff — catalogo a
      due colonne con la ricerca — nata per gli ordini battuti a mano: quelli
