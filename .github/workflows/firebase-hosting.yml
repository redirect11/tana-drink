name: Deploy to Firebase

# SI PUBBLICA SOLO CON UN TAG.
#
#   tag su un commit di `main`  → PRODUZIONE, ma il deploy lo approva una
#                                 persona (environment "production")
#   tag su qualsiasi altro ramo → TEST, subito, senza chiedere niente
#   push su un ramo             → NON pubblica: girano solo lint e test
#                                 (test.yml)
#
# Perché: pubblicare a ogni push voleva dire che l'ambiente di prova
# cambiava sotto le mani di chi ci stava provando sopra, e che bastava un
# merge su `main` per mandare in produzione senza che nessuno lo avesse
# deciso in quel momento. Il tag è una decisione esplicita: si tagga quando
# si vuole pubblicare quella cosa lì.
#
# L'ambiente di test è UNO e vale per tutti: l'ultimo tag pubblicato è
# quello che si vede. Per sapere cosa si sta guardando, l'app mostra
# versione, ramo e commit in fondo al menu (vedi VersionBadge).
#
# I segreti per-ambiente vivono nelle GitHub Environments "production" e
# "test" (stessi NOMI, valori diversi).
#
# L'APPROVAZIONE NON STA QUI: si configura una volta su GitHub, in
# Settings → Environments → production → "Required reviewers". Senza quella
# spunta un tag su main pubblicherebbe da sé. È scritto in docs/gitflow.md.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Un deploy alla volta. Non si annulla quello in corso: un deploy fermo in
# attesa di approvazione non deve sparire perché nel frattempo è stato
# taggato qualcos'altro.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # PRIMA I TEST, POI IL DEPLOY. Se qui qualcosa è rosso non si pubblica
  # niente — né in test né in produzione.
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # DOVE VA QUESTO TAG? Non lo dice il suo nome — un `v1.4.2` può stare su
  # develop mentre matura — lo dice DOVE SI TROVA il commit: se è dentro
  # `main` è roba di produzione, altrimenti è una prova.
  destinazione:
    name: Dove va
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.scelta.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scelta
        run: |
          # `main` non arriva col checkout di un tag: va chiesto a parte.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ambiente=production" >> "$GITHUB_OUTPUT"
            echo "Il tag ${GITHUB_REF_NAME} è su main → PRODUZIONE (con approvazione)."
          else
            echo "ambiente=test" >> "$GITHUB_OUTPUT"
            echo "Il tag ${GITHUB_REF_NAME} non è su main → ambiente di TEST."
          fi

  prova:
    name: Test
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'test'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: test
      progetto: tana-drink-test
      versione: ${{ github.ref_name }}
    secrets: inherit

  produzione:
    name: Produzione
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'production'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: production
      progetto: tana-drink
      versione: ${{ github.ref_name }}
    secrets: inherit
