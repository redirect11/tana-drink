name: Deploy to Firebase

# UN PUSH NON PUBBLICA. Ci vuole un gesto esplicito, e sono due: il tag,
# oppure il lancio a mano di questo workflow.
#
#   tag su un commit di `main`  → PRODUZIONE, ma il deploy lo approva una
#                                 persona (environment "production")
#   tag su qualsiasi altro ramo → TEST, subito, senza chiedere niente
#   lancio a mano (workflow_dispatch: Actions → Run workflow → il ramo)
#                               → TEST. È così che si prova un ramo di
#                                 lavoro: nessun tag, nessuna traccia nella
#                                 storia. Sul ramo di hotfix si fa così.
#   push su un ramo             → NON pubblica: girano solo lint e test
#                                 (test.yml)
#
# Perché: pubblicare a ogni push voleva dire che l'ambiente di prova
# cambiava sotto le mani di chi ci stava provando sopra, e che bastava un
# merge su `main` per mandare in produzione senza che nessuno lo avesse
# deciso in quel momento. Il tag è una decisione esplicita: si tagga quando
# si vuole pubblicare quella cosa lì.
#
# L'ambiente di test è UNO e vale per tutti: l'ultimo tag pubblicato è
# quello che si vede. Per sapere cosa si sta guardando, l'app mostra
# versione, ramo e commit in fondo al menu (vedi VersionBadge).
#
# I segreti per-ambiente vivono nelle GitHub Environments "production" e
# "test" (stessi NOMI, valori diversi).
#
# L'APPROVAZIONE NON STA QUI: si configura una volta su GitHub, in
# Settings → Environments → production → "Required reviewers". Senza quella
# spunta un tag su main pubblicherebbe da sé. È scritto in docs/gitflow.md.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Un deploy alla volta. Non si annulla quello in corso: un deploy fermo in
# attesa di approvazione non deve sparire perché nel frattempo è stato
# taggato qualcos'altro.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # PRIMA I TEST, POI IL DEPLOY. Se qui qualcosa è rosso non si pubblica
  # niente — né in test né in produzione.
  test:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # DOVE VA QUESTO TAG? Non lo dice il suo nome — un `v1.4.2` può stare su
  # develop mentre matura — lo dice DOVE SI TROVA il commit: se è dentro
  # `main` è roba di produzione; se è dentro `develop`, o si sta lanciando a
  # mano un ramo di rilascio o di hotfix, è il test della Tana.
  #
  # TUTTO IL RESTO È «FLOTTA» (REQ-FLOTTA-001, docs/flotta.md): un ramo
  # `feature/`, un tag su un commit che non sta in nessuno dei rami sopra.
  # Va sul progetto scritto nella variabile di repository PROGETTO_FLOTTA
  # (`drink-demo`), e se la variabile non c'è si FERMA: il test della Tana
  # non si raggiunge mai da un ramo che non è suo. È successo con la
  # 1.9.x che tre commit finissero sul ramo sbagliato; qui l'errore
  # equivalente — provare il prodotto nuovo sopra i dati di prova della
  # Tana — costerebbe una serata di confusione a chi lo sta provando.
  destinazione:
    name: Dove va
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.scelta.outputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scelta
        run: |
          # `main` e `develop` non arrivano col checkout di un tag: vanno
          # chiesti a parte.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ambiente=production" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} è su main → PRODUZIONE (con approvazione)."
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "ambiente=test" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} è su develop → ambiente di TEST della Tana."
          elif [ "$GITHUB_REF_TYPE" = "branch" ] && [[ "$GITHUB_REF_NAME" =~ ^(release|hotfix)/ ]]; then
            echo "ambiente=test" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} è un ramo di rilascio o di hotfix → ambiente di TEST della Tana."
          else
            echo "ambiente=flotta" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} non è della Tana → FLOTTA (PROGETTO_FLOTTA)."
          fi

  prova:
    name: Test
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'test'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: test
      progetto: tana-drink-test
      versione: ${{ github.ref_name }}
    secrets: inherit

  produzione:
    name: Produzione
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'production'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: production
      progetto: tana-drink
      versione: ${{ github.ref_name }}
    secrets: inherit

  # LA FLOTTA: il prodotto neutro, compilato per il cliente `demo`
  # (clienti/demo/), sul progetto che dice la variabile. I segreti stanno
  # nell'environment GitHub «flotta», come per «test» e «production».
  flotta:
    name: Flotta
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'flotta' && vars.PROGETTO_FLOTTA != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: flotta
      progetto: ${{ vars.PROGETTO_FLOTTA }}
      cliente: demo
      versione: ${{ github.ref_name }}
    secrets: inherit

  flotta-senza-progetto:
    name: Flotta (manca PROGETTO_FLOTTA)
    needs: destinazione
    if: needs.destinazione.outputs.ambiente == 'flotta' && vars.PROGETTO_FLOTTA == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::${GITHUB_REF_NAME} non è un ramo della Tana e la variabile di repository PROGETTO_FLOTTA non è impostata: niente deploy. Si imposta in Settings → Secrets and variables → Actions → Variables (es. drink-demo), con i segreti nell'environment «flotta»."
          exit 1
