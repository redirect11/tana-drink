name: Deploy to Firebase

# Due ambienti, stessa pipeline:
#   push su main    → PRODUZIONE (progetto tana-drink)
#   push su develop → TEST       (progetto tana-drink-test)
# I segreti per-ambiente vivono nelle GitHub Environments "production" e
# "test" (stessi NOMI, valori diversi). La produzione, senza segreti
# d'ambiente, usa i segreti a livello repo già esistenti: invariata.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Un deploy alla volta per ramo (prod e test non si annullano a vicenda).
concurrency:
  group: firebase-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    env:
      # ID di progetto per ramo (pubblici, non segreti).
      TARGET_PROJECT: ${{ github.ref_name == 'main' && 'tana-drink' || 'tana-drink-test' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      # SICUREZZA: la config del build deve corrispondere al progetto del
      # ramo. Se i segreti dell'ambiente test mancassero, qui si fallisce
      # invece di deployare codice di test sul progetto di produzione.
      - name: Guardia ambiente
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ "$VITE_FIREBASE_PROJECT_ID" != "$TARGET_PROJECT" ]; then
            echo "::error::Config ($VITE_FIREBASE_PROJECT_ID) ≠ progetto del ramo ($TARGET_PROJECT). Configura i segreti dell'environment GitHub."
            exit 1
          fi
          echo "Deploy su $TARGET_PROJECT (ramo ${GITHUB_REF_NAME})."

      - name: Build
        env:
          # Su Firebase Hosting il sito è servito dalla radice.
          BASE_PATH: /
          # Ambiente (dal ramo): abilita DevTools + nastro "TEST" sul test.
          VITE_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'test' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Chiave VAPID per le notifiche push (Console → Cloud Messaging → Web Push certificates)
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          # Chiave reCAPTCHA v3 per App Check (captcha ordini)
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      # Deploy delle Functions (richiede la Cloud Build API, attiva col piano Blaze).
      - name: Deploy Firebase Functions
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools deploy --only functions \
            --project "$TARGET_PROJECT" --force
          rm /tmp/sa.json

      # Deploy di regole Firestore (+ indici da firestore.indexes.json) e
      # regole Storage. Il service account ha i ruoli necessari
      # (firebaserules.admin, datastore.indexAdmin, serviceUsageConsumer).
      - name: Deploy Firestore rules & indexes + Storage rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools deploy --only firestore,storage \
            --project "$TARGET_PROJECT"
          rm /tmp/sa.json

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.TARGET_PROJECT }}
          channelId: live
