name: Tests

# DOVE SERVE, E NON A OGNI PUSH. Qui lavora una persona sola, e il lavoro
# quotidiano sta su release/x.y.z: far girare tutta la suite a ogni push
# voleva dire pagare venti minuti di macchina al giorno per un verde che
# nessuno guardava — mentre chi lavora i test se li fa girare in locale,
# ed e' li' che scopre le cose, non dieci minuti dopo su GitHub.
#
# Adesso gira dove una risposta cambia una decisione:
#
#   pull request verso develop  -> e' il cancello del merge: la CI qui e'
#                                  obbligatoria (ruleset «linee-permanenti»)
#   pull request verso main     -> l'hotfix passa di qui, e lo stesso
#                                  ruleset pretende il check anche su main:
#                                  senza, quelle PR non si potrebbero
#                                  mergiare mai
#   push su develop             -> quello che e' entrato regge davvero
#   a mano (workflow_dispatch)  -> quando lo si vuole
#
# Sui rami di lavoro NON gira piu'. Non resta scoperto niente di
# pubblicato: chi pubblica e' firebase-hosting.yml, che lint e test se li
# rifa' da se' prima di mandare online qualunque cosa.
#
# Sulle pull request gira anche la copertura: li c'e' il tempo di
# guardarla, mentre in mezzo al lavoro sarebbe solo attesa.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # La copertura solo sulle pull request: in mezzo al lavoro sarebbe
      # tempo in più a ogni push.
      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: npm run test:coverage

      - name: Upload coverage report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
