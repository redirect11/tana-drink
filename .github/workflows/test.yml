name: Tests

# Sui push i test girano dentro la pipeline di deploy, che senza il loro
# verde non pubblica niente (firebase-hosting.yml). Qui restano le pull
# request — dove non c'è nessun deploy da bloccare — e la copertura, che
# nella pipeline sarebbe solo tempo in più prima di andare online.
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vitest – unit & BDD tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
