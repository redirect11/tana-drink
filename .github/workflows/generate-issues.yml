name: Generate Issues from Requirements

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (non crea issue, mostra solo cosa verrebbe creato)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  # Le issue nascono dal registro, non a mano. Su `main` per i requisiti; sui
  # rami `hotfix/**` perché lì il registro dei bug arriva PRIMA della
  # correzione: si scrive la voce, si spinge, e le issue esistono — con la
  # loro etichetta `hotfix` — prima che qualcuno tocchi il codice. Così chi
  # corregge lavora su un'issue vera, e quello che è stato raccontato a voce
  # dal banco resta scritto anche se la correzione slitta.
  #
  # E SUI RAMI DI RILASCIO, che è dove si lavora tutti i giorni. Aspettare
  # `main` voleva dire che una richiesta arrivata a voce restava scritta solo
  # in un file: chi guardava le issue non la vedeva per giorni, e nel
  # frattempo la si raccontava di nuovo. Lo script è idempotente — cerca per
  # titolo esatto fra le issue aperte E chiuse — quindi spingere dieci volte
  # lo stesso registro non crea dieci issue: nascono solo quelle che mancano.
  # TRE LINEE, TRE COSE DIVERSE sulla stessa voce del registro:
  #   release/** -> si scrive e si riallinea (l'issue nasce, o si aggiorna)
  #   develop    -> si mette IN PROVA: e' finita, ma al banco non l'ha vista
  #                 ancora nessuno
  #   main       -> si chiude: adesso e' davvero in mano a chi lavora
  push:
    branches:
      - main
      - develop
      - "hotfix/**"
      - "release/**"
    paths:
      - "requirements/requirements.yaml"
      - "requirements/bugs.yaml"

jobs:
  generate-issues:
    name: Generate issues from requirements.yaml + bugs.yaml
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # Su push automatico crea le issue; su run manuale rispetta la scelta dry_run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # Le issue si CHIUDONO solo da main, la linea della produzione. Su
          # un ramo di hotfix o di rilascio la voce passa a `fixed` appena la
          # correzione è scritta, ma al banco l'app sbaglia ancora: chiudere
          # lì vuol dire dire a chi ha segnalato il guaio che è sistemato
          # quando non lo è. Da quei rami le issue si aprono soltanto.
          CHIUDE_RISOLTI: ${{ github.ref == 'refs/heads/main' }}
          # Su develop la voce finita prende l'etichetta «in-test»: e' il pezzo
          # di mezzo che prima non si vedeva da nessuna parte — una correzione
          # scritta e non ancora provata era indistinguibile da una da fare.
          SEGNA_IN_TEST: ${{ github.ref == 'refs/heads/develop' }}
        run: node scripts/generate-issues.mjs
